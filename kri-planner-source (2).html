афіку дня» → шторка з «Редагувати»/«Видалити». Старі прострочені завдання рухає перемикач\n      «Переносити прострочені на сьогодні» в налаштуваннях щоденника.\n- [x] **Відступ під банером «Найближче / Зараз»** на «Графіку дня»: `.page-day > .gradient-note`\n      отримав `margin-bottom: 22px` — раніше банер стояв упритул до колонок днів (зазор 0).\n- [x] **Прибрано анімацію KRI у Щоденнику**: заголовок «Щоденник» більше не перебирає символи\n      (`tasks.js` не імпортує `scrambleText`; `maybeAnimateTitle()` лише з'їдає флаг). Анімація лишилась\n      тільки в Календарі й стала **неквапливішою** (~1.6 с) з м'яким «вискакуванням» літер (`.kri-pop`).\n- [x] **Нейтральні тексти** (не «тільки для школи/дітей»): «урок» → «заняття», «предмет» → «тема»,\n      «ДЗ» → «завдання», «кабінет» → «місце», «вчитель» → «керівник / викладач» у `tasks.js`,\n      `calendar-edit.js`, `diary-edit.js`, `forms.js`, `itemdetail.js`, `ai.js`, `store.js`.\n- [x] **Профіль**: кругла кнопка зверху праворуч тепер відкриває повноцінний профіль —\n      **фото** (двічі натиснути на аватар → вибір файлу, кадрується до 192×192 JPEG і зберігається в\n      акаунті як лого; кнопка «Прибрати фото»), **Ім'я** (лише для напису), **Назва профілю** (ключ\n      входу) і **Пароль** (крапки). Кожен рядок змінюється **подвійним натисканням** (або кліком по\n      олівцю); пароль — поточний + новий + повтор. Усе зберігається в акаунті (`accounts` kv).\n- [x] **Вхід/реєстрація**: поле «Назва профілю» (ключ входу) + окреме необов'язкове «Ім'я» + пароль.\n\n## Зроблено (остання сесія)\n\n- [x] **Панель годин у «Графік дня» — завжди повна доба (00:00–23:00) для кожного дня**, навіть якщо подій\n      немає. Раніше діапазон підганявся під події (міг бути 3 години) або день взагалі замінювався\n      заглушкою «Вільно» — через це «завтра/післязавтра не показані». Тепер сітка однакова всюди, нічні\n      години (до 07:00 / з 22:00) приглушені (`.night-band`, `.hour-label.is-night`), а порожній день має\n      лише коротку підказку `.day-free-note`.\n- [x] **Натискання на порожню годину = нова подія**: у формі вже підставлені дата й час (крок 30 хв).\n      Для цього `openEventForm(ctx, existing, presetMode, preset)` отримав 4-й параметр `preset`.\n- [x] **Бейдж «зараз» більше не ховає підпис години**: замість пропуску підпис зсувається на ±22 px у бік,\n      протилежний до бейджа (перевірено: вертикальний зазор 4.8 px, усі 24 підписи на місці).\n- [x] **Анімація заголовка «Календар»**: `Календар → КRалендар → КRIалендар → КRалендар → Календар`\n      (`kriTitle()` у `ui.js`), причому **всі додані літери включно з «К»** — кольору застосунку (`--accent`).\n- [x] **«На найближчий урок»** у формі ДЗ: чіп з'являється для будь-якого обраного предмета; дата = найближчий\n      урок від сьогодні (сьогоднішній рахується лише якщо ще не закінчився); за налаштуванням «Пропонувати\n      \"на наступний урок\"» дата підставляється автоматично; якщо в розкладі немає уроків цього предмета —\n      показується підказка.\n- [x] **Охайність і поліш**: червоний бейдж часу «зараз» більше не накладається на підпис години; хінт\n      секції переноситься на новий рядок, а не затискається поруч із заголовком; поле вводу в чаті\n      притиснуте до низу навіть при короткій історії; плейсхолдери скорочено, щоб не обрізались на 390px;\n      вирівняно вертикальний ритм відступів секцій і карток.\n- [x] **Полагоджено кольори тексту на кнопках/полях**: `normalize.css` платформи перебивав наші правила\n      (`color: inherit` має вищу специфічність) — білі написи на градієнтних кнопках були сірі, а галочка\n      на незавершеному завданні ставала видимою. Див. README → Conventions / gotchas.\n\n## Зроблено (попередня сесія)\n\n- [x] «Графік дня» перероблено на компактну стрічку-картки: опис/посилання/початок-кінець — **лише при\n      натисканні** (шторка деталей); банер «Найближче / Зараз».\n- [x] Розділено джерела даних: **Графік дня = лише події з часом**, **Календар = події на весь день +\n      свята + подорожі** (див. `SPEC.md` §2.1).\n- [x] Додано **подорожі** («Додати подорож», «Мої подорожі»): багатоденні, з написами «Завтра подорож»,\n      «Сьогодні у вас подорож», «Подорож триває», «Сьогодні повернення» і шторкою деталей.\n- [x] **Зарядка** більше не спливає на весь екран: це звичайна подія у графіку дня з кнопкою «Почати»\n      поруч (глобальний тост прибрано).\n- [x] ШІ навчено додавати/видаляти подорожі (`add_trip` / `delete_trip`).\n- [x] Оновлено `SPEC.md`, `README.md`, `TODO.md`.\n\n## Заплановано користувачем\n\n- [ ] **Змінити мову** — кнопка існує, але поки без функцій (Кирило: «потім додамо»).\n      Коли робитимемо: додати `en` до кожного рядка UI + `settings.language`, перекласти всі підписи\n      (`app.js` PANELS, screens/*, `ui.toast`, `ai.js` промпти) через словник `t(key)`.\n\n## Гігієна робочого простору\n\n- [!] **НЕ видаляти дані з `kv` / `localStorage`.** Тестові дані прибрано ще раніше (акаунти\n      `accounts` / `appData` і ключі `kri.planner.*`), але тепер у цьому ж origin працює **реальний\n      акаунт користувача** (наприклад `крикри`) з його справжніми подіями, розкладом і ДЗ — це не\n      тест. Під час перевірок або мутуй дані лише в пам'яті (`store.data`) і роби `page_refresh`,\n      або заводи окремий тимчасовий акаунт (напр. `__qa__`) і видаляй **тільки його**.\n\n## Дрібниці / можливі покращення (не критично)\n\n- [ ] Колір-роздільник у двоколонковому тижні на десктопі досить блідий — можна трохи підсилити.\n- [ ] Порожні дні (СБ/НД) у тижневому вигляді залишають «дирки» — можна малювати плейсхолдер.\n- [ ] Експорт/імпорт даних (JSON) — не просили, але було б природно для планера.\n\n## Не робити\n\n- Не перейменовувати й не публікувати генератор без прямого прохання користувача.\n"},{"path":"src/ai.js","text":"import { store } from \"./store.js\";\nimport {\n  todayStr, addDaysStr, fmtDateLong, weekdayIdx, WEEKDAYS_LONG,\n  normalizeUrl, uid, strToDate, roomLabel, tripDuration,\n} from \"./util.js\";\n\nconst SESSION_PREFIX =\n  \"Ти — KRI ШІ, розумний і доброзичливий помічник у застосунку «Календар і Щоденник». Допомагаєш користувачеві з розкладом, подіями та завданнями — навчання, робота, дім.\";\n\nconst CAL_STATIC = `${SESSION_PREFIX}\n\nЩО ТИ ВМІЄШ:\n1. Відповідати на питання про розклад і події (що сьогодні, що завтра, коли наступне заняття, чи є вільний час, скільки подій тощо).\n2. Створювати нові події в календарі, коли користувач просить щось додати (наприклад: «додай тренування у четвер о 18:00», «нагадай про лікаря 20 вересня»).\n3. Змінювати або видаляти події, якщо користувач просить.\n4. Додавати подорожі, коли користувач називає дати виїзду та повернення.\n\nЯК ВЛАШТОВАНИЙ ЗАСТОСУНОК (важливо для відповідей):\n- «Графік дня» показує ЛИШЕ події з часом (заняття з розкладу, тренування, зустрічі) — по годинах.\n- «Календар» показує ЛИШЕ події на весь день, свята та подорожі.\n- Тому якщо подію додано без часу — вона видима в Календарі, а якщо з часом — у Графіку дня.\n\nЖОРСТКІ ПРАВИЛА:\n- Відповідай ЛИШЕ українською мовою, коротко (1–4 речення), дружньо й по суті. Без зайвих вступів.\n- Спирайся ВИКЛЮЧНО на блок СТАН нижче. Ніколи не вигадуй занять, подій чи завдань, яких там немає.\n- Якщо чогось немає — прямо скажи, що в розкладі цього немає.\n- Час пиши у форматі 14:00, дати — словами з дужками: «завтра, 15 вересня (2026-09-15)».\n- Можна використовувати простий markdown: **жирний** для назв і списки через «- ».\n- Не питай зайвих підтверджень: якщо користувач просить додати подію й даних достатньо — просто додай.\n- Якщо даних для дії бракує (наприклад незрозуміла дата), постав коротке уточнювальне питання і НЕ додавай блок дій.\n- Ніякого NSFW-контенту.\n\nБЛОК ДІЙ (тільки якщо треба щось змінити в календарі):\nПісля тексту відповіді додай РІВНО ОДИН блок такого вигляду, і більше нічого після нього:\n\u003c\u003c\u003cДІЇ>>>\n{\"actions\":[...]}\n\u003c\u003c\u003cКІНЕЦЬ>>>\n\nФормати дій у масиві:\n{\"type\":\"add_event\",\"title\":\"Назва\",\"date\":\"YYYY-MM-DD\",\"start\":\"HH:MM\",\"end\":\"HH:MM\",\"desc\":\"опис\",\"link\":\"https://...\",\"repeat\":\"none\"}\n{\"type\":\"add_event\",\"title\":\"Назва\",\"date\":\"YYYY-MM-DD\",\"start\":\"HH:MM\",\"end\":\"HH:MM\",\"repeat\":\"weekly\",\"days\":[1,3],\"until\":\"YYYY-MM-DD\"}\n{\"type\":\"add_event\",\"title\":\"День народження\",\"date\":\"YYYY-MM-DD\",\"repeat\":\"yearly\"}\n{\"type\":\"add_trip\",\"title\":\"Прага\",\"from\":\"YYYY-MM-DD\",\"to\":\"YYYY-MM-DD\",\"desc\":\"опис\",\"link\":\"https://...\"}\n{\"type\":\"delete_event\",\"title\":\"Назва\",\"date\":\"YYYY-MM-DD\"}\n{\"type\":\"delete_trip\",\"title\":\"Прага\"}\n\nДозволені значення \"repeat\": \"none\", \"daily\", \"weekly\", \"monthly\", \"yearly\".\nОбов'язкові поля: type, title, date. Решту додавай лише якщо вони відомі. Якщо змін не потрібно — блок НЕ додавай взагалі.`;\n\nconst DIARY_STATIC = `${SESSION_PREFIX}\n\nЗАРАЗ ТИ ПРАЦЮЄШ У РОЗДІЛІ «ЩОДЕННИК» — це завдання й доручення: навчання, робота, дім.\n\nЩО ТИ ВМІЄШ:\n1. Відповідати на питання про завдання (що саме, на коли, з якої теми, що лишилось зробити).\n2. Додавати нові завдання з тексту користувача (наприклад: «алгебра, параграф 12 на завтра» або «звіт до п'ятниці»).\n3. Позначати завдання виконаними або видаляти їх.\n\nЖОРСТКІ ПРАВИЛА:\n- Відповідай ЛИШЕ українською мовою, коротко (1–4 речення), дружньо й по суті. Без зайвих вступів.\n- Спирайся ВИКЛЮЧНО на блок СТАН нижче. Ніколи не вигадуй завдань, яких там немає.\n- Час пиши у форматі 14:00, дати — «завтра, 15 вересня (2026-09-15)».\n- Можна використовувати простий markdown: **жирний** для назв і списки через «- ».\n- Якщо тема схожа на одну з тем розкладу — використай саме її назву.\n- Якщо незрозуміло, на яку дату завдання, постав коротке уточнення і НЕ додавай блок дій.\n- Ніякого NSFW-контенту.\n\nБЛОК ДІЙ (тільки якщо треба щось змінити в щоденнику):\nПісля тексту відповіді додай РІВНО ОДИН блок такого вигляду, і більше нічого після нього:\n\u003c\u003c\u003cДІЇ>>>\n{\"actions\":[...]}\n\u003c\u003c\u003cКІНЕЦЬ>>>\n\nФормати дій у масиві:\n{\"type\":\"add_task\",\"subject\":\"Робота\",\"title\":\"Звіт за квартал\",\"desc\":\"до п'ятниці\",\"due\":\"YYYY-MM-DD\",\"link\":\"https://...\"}\n{\"type\":\"complete_task\",\"title\":\"Звіт за квартал\",\"due\":\"YYYY-MM-DD\"}\n{\"type\":\"delete_task\",\"title\":\"Звіт за квартал\",\"due\":\"YYYY-MM-DD\"}\n\nОбов'язкові поля: type, title. Для add_task також обов'язкове \"due\". Якщо змін не потрібно — блок НЕ додавай взагалі.`;\n\nfunction fmtTime(t) {\n  return t ? String(t).slice(0, 5) : \"\";\n}\n\nfunction timeRange(start, end) {\n  if (!start) return \"\";\n  return end ? `${fmtTime(start)}–${fmtTime(end)}` : fmtTime(start);\n}\n\nfunction dateBlocks(days = 14) {\n  const lines = [];\n  const t = todayStr();\n  for (let i = 0; i \u003c days; i++) {\n    const d = addDaysStr(t, i);\n    const label = i === 0 ? \"сьогодні\" : i === 1 ? \"завтра\" : i === 2 ? \"післязавтра\" : `через ${i} дн.`;\n    lines.push(`- ${label}: ${WEEKDAYS_LONG[weekdayIdx(d)]}, ${fmtDateLong(d)} — \"${d}\"`);\n  }\n  return lines.join(\"\\n\");\n}\n\nexport function buildCalendarState() {\n  const t = todayStr();\n  const d = new Date();\n  const lines = [];\n  lines.push(\"СТАН\");\n  lines.push(`Сьогодні: ${WEEKDAYS_LONG[weekdayIdx(t)]}, ${fmtDateLong(t)} (\"${t}\"). Зараз ${String(d.getHours()).padStart(2, \"0\")}:${String(d.getMinutes()).padStart(2, \"0\")}.`);\n  lines.push(\"\");\n  lines.push(\"Дати найближчих 14 днів (використовуй саме ці ISO-дати у полі date):\");\n  lines.push(dateBlocks(14));\n  lines.push(\"\");\n  lines.push(\"Розклад занять (повторюється щотижня):\");\n  for (let dow = 1; dow \u003c= 7; dow++) {\n    const lessons = store.timetableFor(dow);\n    if (!lessons.length) continue;\n    const parts = lessons.map((l, i) => `${i + 1}) ${timeRange(l.start, l.end)} ${l.subject}${l.room ? ` (${roomLabel(l.room)})` : \"\"}`);\n    lines.push(`- ${WEEKDAYS_LONG[dow - 1]}: ${parts.join(\"; \")}`);\n  }\n  const anyLessons = Object.keys(store.data.timetable).some((k) => (store.data.timetable[k] || []).length);\n  if (!anyLessons) lines.push(\"- (розклад ще не заповнено)\");\n  lines.push(\"\");\n  const upcoming = store.upcomingEvents(t, 21);\n  lines.push(\"Події на найближчі 21 день:\");\n  if (!upcoming.length) lines.push(\"- (подій немає)\");\n  for (const { date, ev } of upcoming.slice(0, 60)) {\n    const when = ev.allDay ? \"весь день\" : timeRange(ev.start, ev.end) || \"без часу\";\n    lines.push(`- ${fmtDateLong(date)} (\"${date}\") ${when} — ${ev.title}${ev.desc ? ` — ${ev.desc}` : \"\"}${ev.kind && ev.kind !== \"once\" ? ` [повтор: ${ev.kind}]` : \"\"}`);\n  }\n  lines.push(\"\");\n  lines.push(\"Подорожі:\");\n  const trips = store.data.trips.slice().sort((a, b) => String(a.from).localeCompare(String(b.from)));\n  if (!trips.length) lines.push(\"- (подорожей немає)\");\n  for (const trip of trips) {\n    lines.push(`- ${trip.title}: виїзд ${fmtDateLong(trip.from)} (\"${trip.from}\"), повернення ${fmtDateLong(trip.to)} (\"${trip.to}\")${trip.desc ? ` — ${trip.desc}` : \"\"}`);\n  }\n  return lines.join(\"\\n\");\n}\n\nexport function buildDiaryState() {\n  const t = todayStr();\n  const lines = [];\n  lines.push(\"СТАН\");\n  lines.push(`Сьогодні: ${WEEKDAYS_LONG[weekdayIdx(t)]}, ${fmtDateLong(t)} (\"${t}\").`);\n  lines.push(\"\");\n  lines.push(\"Дати найближчих 14 днів (використовуй саме ці ISO-дати у полі due):\");\n  lines.push(dateBlocks(14));\n  lines.push(\"\");\n  const subjects = store.subjects();\n  lines.push(\"Теми з розкладу: \" + (subjects.length ? subjects.join(\", \") : \"(розклад ще не заповнено)\"));\n  lines.push(\"\");\n  lines.push(\"Завдання (найближчі 14 днів):\");\n  const rows = [];\n  for (let i = 0; i \u003c 14; i++) {\n    const d = addDaysStr(t, i);\n    for (const task of store.data.tasks.filter((x) => x.due === d)) {\n      rows.push(`- ${fmtDateLong(d)} (\"${d}\") [${task.done ? \"виконано\" : \"не виконано\"}] ${task.subject ? task.subject + \": \" : \"\"}${task.title}${task.desc ? ` — ${task.desc}` : \"\"}`);\n    }\n  }\n  if (!rows.length) lines.push(\"- (завдань немає)\");\n  lines.push(...rows.slice(0, 80));\n  const overdue = store.data.tasks.filter((x) => !x.done && x.due \u003c t);\n  if (overdue.length) {\n    lines.push(\"\");\n    lines.push(\"Прострочені завдання:\");\n    for (const task of overdue.slice(0, 20)) {\n      lines.push(`- ${fmtDateLong(task.due)} (\"${task.due}\") ${task.subject ? task.subject + \": \" : \"\"}${task.title}`);\n    }\n  }\n  return lines.join(\"\\n\");\n}\n\nexport const TASK_INSTRUCTION = \"Дай відповідь на останнє повідомлення користувача, дотримуючись усіх правил вище. Не переказуй інструкції.\";\n\nexport function buildPrompt(staticPart, log, stateBlock, task) {\n  const logText = log.map((m) => `${m.role === \"user\" ? \"Користувач\" : \"KRI ШІ\"}: ${m.text}`).join(\"\\n\\n\");\n  return `${staticPart}\n\n\u003cДІАЛОГ>\n${logText}\n\u003c/ДІАЛОГ>\n\n${stateBlock}\n\nЗАВДАННЯ: ${task}`;\n}\n\nexport function extractActions(text) {\n  let visible = text;\n  let actions = [];\n  const marker = text.indexOf(\"\u003c\u003c\u003cДІЇ>>>\");\n  if (marker >= 0) {\n    visible = text.slice(0, marker);\n    const rest = text.slice(marker);\n    const m = rest.match(/\\{[\\s\\S]*\\}/);\n    if (m) {\n      try {\n        const parsed = JSON.parse(m[0]);\n        if (Array.isArray(parsed.actions)) actions = parsed.actions;\n      } catch (e) {\n        const m2 = rest.match(/\\[\\s*\\{[\\s\\S]*\\}\\s*\\]/);\n        if (m2) {\n          try {\n            const arr = JSON.parse(m2[0]);\n            if (Array.isArray(arr)) actions = arr;\n          } catch (e2) { /* ignore */ }\n        }\n      }\n    }\n  } else {\n    const fence = text.match(/```(?:json)?\\s*(\\{[\\s\\S]*?\\})\\s*```/);\n    if (fence) {\n      try {\n        const parsed = JSON.parse(fence[1]);\n        if (Array.isArray(parsed.actions)) {\n          actions = parsed.actions;\n          visible = text.replace(fence[0], \"\");\n        }\n      } catch (e) { /* ignore */ }\n    }\n  }\n  return { visible: visible.trim(), actions };\n}\n\nfunction cleanTitle(t) {\n  return String(t || \"\").trim().replace(/\\s+/g, \" \").slice(0, 120);\n}\n\nfunction validDate(s) {\n  if (!s || !/^\\d{4}-\\d{2}-\\d{2}$/.test(String(s))) return null;\n  const d = strToDate(s);\n  if (Number.isNaN(d.getTime())) return null;\n  return s;\n}\n\nfunction validTime(s) {\n  if (!s) return \"\";\n  const m = String(s).match(/^(\\d{1,2}):(\\d{2})/);\n  if (!m) return \"\";\n  const hh = Math.min(23, Math.max(0, Number(m[1])));\n  const mm = Math.min(59, Math.max(0, Number(m[2])));\n  return `${String(hh).padStart(2, \"0\")}:${String(mm).padStart(2, \"0\")}`;\n}\n\nexport function applyCalendarActions(actions) {\n  const results = [];\n  const t = todayStr();\n  for (const a of actions || []) {\n    if (!a || typeof a !== \"object\") continue;\n    const type = String(a.type || \"\");\n    if (type === \"add_event\") {\n      const title = cleanTitle(a.title);\n      if (!title) continue;\n      const date = validDate(a.date) || t;\n      const repeat = String(a.repeat || \"none\");\n      const ev = {\n        id: uid(),\n        title,\n        date,\n        desc: String(a.desc || \"\").slice(0, 400),\n        link: a.link ? normalizeUrl(a.link) : \"\",\n        start: validTime(a.start),\n        end: validTime(a.end),\n        allDay: !a.start,\n        createdAt: Date.now(),\n      };\n      if (repeat === \"yearly\") ev.kind = \"yearly\";\n      else if (repeat === \"daily\") ev.kind = \"daily\";\n      else if (repeat === \"monthly\") ev.kind = \"monthly\";\n      else if (repeat === \"weekly\") {\n        ev.kind = \"weekly\";\n        const days = Array.isArray(a.days) ? a.days.map(Number).filter((n) => n >= 1 && n \u003c= 7) : [];\n        ev.days = days.length ? days : [weekdayIdx(date) + 1];\n      } else ev.kind = \"once\";\n      if (ev.kind !== \"once\" && validDate(a.until)) ev.until = a.until;\n      store.data.events.push(ev);\n      results.push(`Додано: «${title}» — ${fmtDateLong(date)}${ev.start ? \", \" + ev.start : \"\"}`);\n    } else if (type === \"delete_event\") {\n      const title = cleanTitle(a.title).toLowerCase();\n      const date = validDate(a.date);\n      const before = store.data.events.length;\n      store.data.events = store.data.events.filter((ev) => {\n        const sameTitle = String(ev.title).trim().toLowerCase() === title;\n        if (!sameTitle) return true;\n        if (date && ev.kind === \"once\" && ev.date !== date) return true;\n        return false;\n      });\n      if (store.data.events.length \u003c before) results.push(`Видалено: «${cleanTitle(a.title)}»`);\n    } else if (type === \"add_trip\") {\n      const title = cleanTitle(a.title);\n      if (!title) continue;\n      const from = validDate(a.from) || validDate(a.to) || t;\n      const to = validDate(a.to) || from;\n      const trip = store.addTrip({\n        title,\n        from,\n        to,\n        desc: String(a.desc || \"\").slice(0, 400),\n        link: a.link ? normalizeUrl(a.link) : \"\",\n      });\n      results.push(`Додано подорож: «${trip.title}» — ${fmtDateLong(trip.from)} → ${fmtDateLong(trip.to)} (${tripDuration(trip)} дн.)`);\n    } else if (type === \"delete_trip\") {\n      const title = cleanTitle(a.title).toLowerCase();\n      const before = store.data.trips.length;\n      store.data.trips = store.data.trips.filter((tr) => String(tr.title).trim().toLowerCase() !== title);\n      if (store.data.trips.length \u003c before) {\n        store.commit();\n        results.push(`Видалено подорож: «${cleanTitle(a.title)}»`);\n      }\n    }\n  }\n  if (results.length) store.commit();\n  return results;\n}\n\nexport function applyDiaryActions(actions) {\n  const results = [];\n  const t = todayStr();\n  for (const a of actions || []) {\n    if (!a || typeof a !== \"object\") continue;\n    const type = String(a.type || \"\");\n    const title = cleanTitle(a.title);\n    if (!title) continue;\n    const due = validDate(a.due);\n    if (type === \"add_task\") {\n      const task = store.addTask({\n        subject: String(a.subject || \"\").slice(0, 60),\n        title,\n        desc: String(a.desc || \"\").slice(0, 400),\n        link: a.link ? normalizeUrl(a.link) : \"\",\n        due: due || t,\n      });\n      results.push(`Додано завдання: ${task.subject ? task.subject + \" — \" : \"\"}${title} (${fmtDateLong(task.due)})`);\n    } else if (type === \"complete_task\") {\n      let hit = 0;\n      for (const task of store.data.tasks) {\n        if (task.done) continue;\n        if (String(task.title).trim().toLowerCase() !== title.toLowerCase()) continue;\n        if (due && task.due !== due) continue;\n        task.done = true;\n        task.doneAt = Date.now();\n        hit++;\n      }\n      if (hit) { store.commit(); results.push(`Позначено виконаним: «${title}»`); }\n    } else if (type === \"delete_task\") {\n      const before = store.data.tasks.length;\n      store.data.tasks = store.data.tasks.filter((task) => {\n        if (String(task.title).trim().toLowerCase() !== title.toLowerCase()) return true;\n        if (due && task.due !== due) return true;\n        return false;\n      });\n      if (store.data.tasks.length \u003c before) { store.commit(); results.push(`Видалено: «${title}»`); }\n    }\n  }\n  return results;\n}\n\n/* ---------- conversation ---------- */\n\nexport class ChatSession {\n  constructor(kind) {\n    this.kind = kind;\n    this.log = (store.data.chats && store.data.chats[kind]) || [];\n    this.summary = (store.data.chatSummaries && store.data.chatSummaries[kind]) || \"\";\n    this.busy = false;\n    this._compacting = false;\n  }\n\n  static load(kind) {\n    if (!store.data.chats) store.data.chats = {};\n    if (!store.data.chatSummaries) store.data.chatSummaries = {};\n    return new ChatSession(kind);\n  }\n\n  persist() {\n    if (!store.data.chats) store.data.chats = {};\n    store.data.chats[this.kind] = this.log.slice(-60);\n    if (!store.data.chatSummaries) store.data.chatSummaries = {};\n    store.data.chatSummaries[this.kind] = this.summary;\n    store.save();\n  }\n\n  clear() {\n    this.log = [];\n    this.summary = \"\";\n    this.persist();\n  }\n\n  get staticPart() {\n    return this.kind === \"calendar\" ? CAL_STATIC : DIARY_STATIC;\n  }\n\n  stateBlock() {\n    return this.kind === \"calendar\" ? buildCalendarState() : buildDiaryState();\n  }\n\n  build(task) {\n    const logPart = this.summary ? [{ role: \"assistant\", text: `[Стислий конспект попередньої розмови: ${this.summary}]` }, ...this.log] : this.log;\n    return buildPrompt(this.staticPart, logPart, this.stateBlock(), task);\n  }\n\n  async send(userText, { onChunk } = {}) {\n    const text = String(userText || \"\").trim();\n    if (!text || this.busy) return null;\n    this.busy = true;\n    this.log.push({ role: \"user\", text });\n    this.persist();\n\n    let raw = \"\";\n    try {\n      const promise = window.root.generateText({\n        instruction: this.build(TASK_INSTRUCTION),\n        onChunk: (d) => {\n          raw = d.fullTextSoFar || \"\";\n          const cut = raw.indexOf(\"\u003c\u003c\u003cДІЇ>>>\");\n          const shown = cut >= 0 ? raw.slice(0, cut) : raw;\n          onChunk && onChunk(shown.replace(/\u003c\u003c\u003cКІНЕЦЬ>>>/g, \"\"));\n        },\n      });\n      this._promise = promise;\n      const result = await promise;\n      raw = result.text || result.toString() || raw;\n    } catch (err) {\n      console.warn(\"AI error\", err);\n      this.log.pop();\n      this.persist();\n      this.busy = false;\n      if (!raw) throw new Error(\"Не вдалося отримати відповідь від ШІ. Перевірте з'єднання й спробуйте ще раз.\");\n    } finally {\n      this._promise = null;\n    }\n\n    const { visible, actions } = extractActions(raw);\n    const results = this.kind === \"calendar\" ? applyCalendarActions(actions) : applyDiaryActions(actions);\n    const reply = { role: \"assistant\", text: visible || \"Готово.\", changes: results };\n    this.log.push(reply);\n    this.persist();\n    this.busy = false;\n    this.maybeCompact();\n    return reply;\n  }\n\n  stop() {\n    if (this._promise && typeof this._promise.stop === \"function\") {\n      try { this._promise.stop(); } catch (e) { /* ignore */ }\n    }\n  }\n\n  async maybeCompact() {\n    if (this._compacting || this.log.length \u003c= 14) return;\n    try {\n      const meta = window.root.generateText({ getMetaObject: true });\n      if (!meta || !meta.countTokens) return;\n      const probe = this.build(TASK_INSTRUCTION);\n      if (meta.countTokens(probe) \u003c (meta.idealMaxContextTokens || 6000) * 0.8) return;\n      this._compacting = true;\n      const keep = 8;\n      const n = this.log.length - keep;\n      if (n \u003c 4) return;\n      const boundary = this.log[n - 1].text.slice(-30);\n      const res = await window.root.generateText(\n        this.build(`Стисло перекажи перші ${n} повідомлень діалогу (до повідомлення, яке закінчується на «${boundary}»), враховуючи наявний конспект. Тільки факти, дати, назви. Без вступів.`),\n      );\n      this.summary = String(res.text || \"\").trim().slice(0, 2000);\n      this.log = this.log.slice(n);\n      this.persist();\n    } catch (e) {\n      console.warn(\"compact failed\", e);\n    } finally {\n      this._compacting = false;\n    }\n  }\n\n  suggestions() {\n    if (this.kind === \"calendar\") {\n      return [\n        \"Що в розкладі на завтра?\",\n        \"Скільки в мене подій цього тижня?\",\n        \"Додай тренування у четвер о 18:00\",\n        \"Що в мене сьогодні?\",\n      ];\n    }\n    return [\n      \"Що задано на завтра?\",\n      \"Додай з алгебри параграф 12 на завтра\",\n      \"Що в мене найближчим часом?\",\n      \"Додай проєкт з історії до п'ятниці\",\n    ];\n  }\n}\n"},{"path":"src/app.js","text":"import { store } from \"./store.js\";\nimport { applyTheme, PALETTES } from \"./themes.js\";\nimport { h, append, clear, openSheet, btn, toast, segmented, confirmDialog, field, textInput } from \"./ui.js\";\nimport { iconMarkup } from \"./icons.js\";\nimport { renderOnboarding } from \"./screens/onboarding.js\";\nimport { renderAuth } from \"./screens/auth.js\";\nimport { renderWeek } from \"./screens/week.js\";\nimport { renderDay } from \"./screens/day.js\";\nimport { renderChat } from \"./screens/chat.js\";\nimport { renderCalendarEdit } from \"./screens/calendar-edit.js\";\nimport { renderTasks } from \"./screens/tasks.js\";\nimport { renderDiaryEdit } from \"./screens/diary-edit.js\";\nimport { openEventForm, openTaskForm, openTripForm } from \"./forms.js\";\nimport { openExercise } from \"./screens/exercise.js\";\nimport { startScheduler, stopScheduler } from \"./scheduler.js\";\nimport { todayStr, plural } from \"./util.js\";\n\nconst PANELS = {\n  calendar: {\n    id: \"calendar\",\n    name: \"Календар\",\n    otherName: \"Щоденник\",\n    otherIcon: \"book\",\n    defaultTab: \"week\",\n    tabs: [\n      { id: \"week\", label: \"Календар\", icon: \"calendar\", render: renderWeek },\n      { id: \"day\", label: \"Графік дня\", icon: \"clock\", render: renderDay },\n      { id: \"ai\", label: \"ШІ\", icon: \"sparkles\", render: renderChat },\n      { id: \"edit\", label: \"Редагування\", icon: \"sliders\", render: renderCalendarEdit },\n    ],\n  },\n  diary: {\n    id: \"diary\",\n    name: \"Щоденник\",\n    otherName: \"Календар\",\n    otherIcon: \"calendar\",\n    defaultTab: \"tasks\",\n    tabs: [\n      { id: \"tasks\", label: \"Завдання\", icon: \"clipboard\", render: renderTasks },\n      { id: \"ai\", label: \"ШІ\", icon: \"sparkles\", render: renderChat },\n      { id: \"edit\", label: \"Редагування\", icon: \"sliders\", render: renderDiaryEdit },\n    ],\n  },\n};\n\nconst appEl = document.getElementById(\"app\");\nconst state = {\n  stage: \"boot\",\n  panel: \"calendar\",\n  tabs: { calendar: \"week\", diary: \"tasks\" },\n  titleAnim: true,\n  authMode: \"login\",\n  chatSessions: {},\n};\nlet currentPage = null;\nlet mainEl = null;\nlet avatarEl = null;\n\napplyTheme(\"teal\", \"light\");\n\nstore.subscribe(() => {\n  if (state.stage === \"boot\") return;\n  if (state.stage === \"app\" && !store.user) {\n    state.stage = \"onboarding\";\n    state.chatSessions = {};\n    stopScheduler();\n    render();\n    return;\n  }\n  if (state.stage === \"app\") {\n    paintAvatar();\n    if (currentPage && typeof currentPage.update === \"function\") currentPage.update();\n  }\n});\n\nfunction ctxFor() {\n  return {\n    user: store.displayName(),\n    profileName: store.user,\n    panel: state.panel,\n    tab: state.tabs[state.panel],\n    mainEl,\n    chatSessions: state.chatSessions,\n    navigate,\n    scrollToEl,\n    openEventForm: (ev) => openEventForm(ctxFor(), ev),\n    openTaskForm: (task) => openTaskForm(ctxFor(), task),\n    openTripForm: (trip) => openTripForm(ctxFor(), trip),\n    consumeTitleAnim: () => {\n      const was = state.titleAnim;\n      state.titleAnim = false;\n      return was;\n    },\n    pokeRefresh: () => {},\n  };\n}\n\nfunction navigate(panel, tab, opts = {}) {\n  const changedPanel = panel !== state.panel;\n  state.panel = panel;\n  if (tab) state.tabs[panel] = tab;\n  if (changedPanel) state.titleAnim = true;\n  renderShell();\n  mountPage();\n  if (opts.scrollTo) {\n    setTimeout(() => {\n      const target = document.getElementById(opts.scrollTo);\n      if (target) scrollToEl(target, 90);\n    }, 140);\n  }\n}\n\nfunction scrollToEl(target, extra = 0) {\n  if (!mainEl || !target) return;\n  const r = target.getBoundingClientRect();\n  const mr = mainEl.getBoundingClientRect();\n  mainEl.scrollTop += (r.top - mr.top) - extra;\n}\n\nfunction render() {\n  if (state.stage === \"boot\") {\n    clear(appEl);\n    return;\n  }\n  if (state.stage === \"onboarding\") {\n    stopScheduler();\n    if (currentPage && currentPage.destroy) currentPage.destroy();\n    currentPage = null;\n    clear(appEl);\n    appEl.appendChild(renderOnboarding({\n      onFinish: (mode) => {\n        state.authMode = mode || \"login\";\n        state.stage = \"auth\";\n        render();\n      },\n    }));\n    return;\n  }\n  if (state.stage === \"auth\") {\n    stopScheduler();\n    if (currentPage && currentPage.destroy) currentPage.destroy();\n    currentPage = null;\n    clear(appEl);\n    appEl.appendChild(renderAuth({\n      mode: state.authMode,\n      onMode: (m) => { state.authMode = m; },\n      onAuthed: () => {\n        state.stage = \"app\";\n        state.panel = \"calendar\";\n        state.tabs = { calendar: \"week\", diary: \"tasks\" };\n        state.titleAnim = true;\n        state.chatSessions = {};\n        applyTheme(store.data.settings.theme, store.data.settings.mode);\n        render();\n      },\n    }));\n    return;\n  }\n  renderShell();\n  mountPage();\n  startScheduler(ctxFor());\n}\n\nfunction renderShell() {\n  clear(appEl);\n  mainEl = h(\"div\", { class: \"app-main\", id: \"viewRoot\" });\n  avatarEl = h(\"button\", { class: \"floating-avatar\", title: \"Профіль\", onclick: () => openProfileSheet() });\n  paintAvatar();\n  appEl.appendChild(avatarEl);\n  appEl.appendChild(mainEl);\n  appEl.appendChild(renderNav());\n}\n\nfunction paintAvatar() {\n  if (!avatarEl) return;\n  const av = store.avatar();\n  const inner = h(\"span\", { class: \"av-inner\" });\n  if (av) {\n    inner.appendChild(h(\"img\", { src: av, alt: \"\" }));\n  } else {\n    inner.appendChild(document.createTextNode((store.displayName() || \"?\").trim().charAt(0).toUpperCase()));\n  }\n  clear(avatarEl);\n  avatarEl.appendChild(inner);\n  avatarEl.title = `Профіль${store.displayName() ? \": \" + store.displayName() : \"\"}`;\n}\n\nfunction renderNav() {\n  const panel = PANELS[state.panel];\n  const other = PANELS[state.panel === \"calendar\" ? \"diary\" : \"calendar\"];\n  const pill = h(\"div\", { class: \"tabbar-pill\" }, panel.tabs.map((tab) => {\n    const active = state.tabs[panel.id] === tab.id;\n    const longestWord = Math.max(...tab.label.split(\" \").map((w) => w.length));\n    const tight = longestWord > 9 ? \" is-tight\" : (Math.max(longestWord, tab.label.length) > 7 ? \" is-mid\" : \"\");\n    const b = h(\"button\", { class: `tab-btn${active ? \" is-active\" : \"\"}`, onclick: () => navigate(panel.id, tab.id) },\n      h(\"span\", { class: \"ico\", html: iconMarkup(tab.icon) }),\n      h(\"span\", { class: `tab-btn-label${tight}` }, tab.label),\n    );\n    return b;\n  }));\n  const switchBtn = h(\"button\", {\n    class: \"app-switch\",\n    title: `Перейти до розділу «${other.name}»`,\n    onclick: () => {\n      state.titleAnim = true;\n      navigate(other.id, state.tabs[other.id] || other.defaultTab);\n      toast(`Розділ «${other.name}»`, { icon: other.otherIcon, duration: 1600 });\n    },\n  },\n    h(\"span\", { class: \"app-switch-circle\" },\n      h(\"span\", { class: \"ico\", html: iconMarkup(other.otherIcon) }),\n      h(\"span\", { class: \"app-switch-badge\", html: iconMarkup(\"refresh\") }),\n    ),\n    h(\"span\", { class: \"app-switch-label\" }, other.name),\n  );\n  return h(\"nav\", { class: \"tabbar\" }, switchBtn, pill);\n}\n\nfunction mountPage() {\n  if (currentPage && typeof currentPage.destroy === \"function\") currentPage.destroy();\n  clear(mainEl);\n  const panel = PANELS[state.panel];\n  const tabId = state.tabs[panel.id];\n  const def = panel.tabs.find((t) => t.id === tabId) || panel.tabs[0];\n  currentPage = def.render(ctxFor());\n  mainEl.appendChild(currentPage.el);\n  mainEl.scrollTop = 0;\n}\n\n/* ---------- профіль ---------- */\n\nfunction shrinkImage(file, size = 192) {\n  return new Promise((resolve, reject) => {\n    const reader = new FileReader();\n    reader.onerror = () => reject(new Error(\"Не вдалося прочитати файл\"));\n    reader.onload = () => {\n      const img = new Image();\n      img.onerror = () => reject(new Error(\"Не вдалося відкрити зображення\"));\n      img.onload = () => {\n        const side = Math.min(img.width, img.height);\n        const sx = (img.width - side) / 2;\n        const sy = (img.height - side) / 2;\n        const canvas = document.createElement(\"canvas\");\n        canvas.width = canvas.height = size;\n        const cx = canvas.getContext(\"2d\");\n        cx.drawImage(img, sx, sy, side, side, 0, 0, size, size);\n        resolve(canvas.toDataURL(\"image/jpeg\", 0.86));\n      };\n      img.src = reader.result;\n    };\n    reader.readAsDataURL(file);\n  });\n}\n\nfunction editableRow(cfg) {\n  const el = h(\"div\", { class: \"profile-row\", role: \"button\", tabindex: \"0\" });\n  let open = false;\n  let lastTap = 0;\n  let errEl = null;\n\n  function paint() {\n    clear(el);\n    el.classList.toggle(\"is-open\", open);\n    if (!open) {\n      append(el, [\n        h(\"div\", { class: \"pr-ico\", html: iconMarkup(cfg.icon) }),\n        h(\"div\", { class: \"pr-text\" },\n          h(\"div\", { class: \"pr-label\" }, cfg.label),\n          h(\"div\", { class: `pr-value${cfg.masked ? \" is-masked\" : \"\"}` }, cfg.value()),\n        ),\n        h(\"div\", { class: \"pr-edit\", html: iconMarkup(\"edit\") }),\n      ]);\n      return;\n    }\n    const inputs = cfg.fields().map((f) => textInput({\n      type: f.type || \"text\",\n      value: f.value || \"\",\n      placeholder: f.placeholder || \"\",\n      autocomplete: \"off\",\n    }));\n    errEl = h(\"div\", { class: \"profile-error hidden\" });\n    append(el, [\n      h(\"div\", { class: \"pr-head\" },\n        h(\"div\", { class: \"pr-ico\", html: iconMarkup(cfg.icon) }),\n        h(\"div\", { class: \"pr-text\" }, h(\"div\", { class: \"pr-label\" }, cfg.label)),\n      ),\n      h(\"div\", { class: \"pr-fields\" }, inputs.map((inp, i) =>\n        cfg.fields()[i] && cfg.fields()[i].label ? field(cfg.fields()[i].label, inp) : inp,\n      )),\n      cfg.hint ? h(\"div\", { class: \"pr-hint\" }, cfg.hint) : null,\n      errEl,\n      h(\"div\", { class: \"pr-actions\" },\n        btn(\"Зберегти\", { size: \"sm\", icon: \"check\", onClick: () => submit(inputs) }),\n        btn(\"Скасувати\", { size: \"sm\", variant: \"ghost\", onClick: () => { open = false; paint(); } }),\n      ),\n    ]);\n    setTimeout(() => { if (inputs[0]) inputs[0].focus(); }, 40);\n  }\n\n  async function submit(inputs) {\n    errEl.classList.add(\"hidden\");\n    try {\n      await cfg.onSave(inputs.map((i) => i.value));\n      open = false;\n      paint();\n    } catch (e) {\n      errEl.textContent = (e && e.message) || \"Не вдалося зберегти\";\n      errEl.classList.remove(\"hidden\");\n    }\n  }\n\n  el.addEventListener(\"click\", (e) => {\n    if (open) return;\n    if (e.target.closest(\".pr-edit\")) { open = true; paint(); return; }\n    const now = Date.now();\n    if (now - lastTap \u003c 460) { lastTap = 0; open = true; paint(); } else lastTap = now;\n  });\n  el.addEventListener(\"keydown\", (e) => {\n    if (open) return;\n    if (e.key === \"Enter\" || e.key === \" \") { e.preventDefault(); open = true; paint(); }\n  });\n\n  paint();\n  return { el, repaint: paint };\n}\n\nfunction openProfileSheet() {\n  const s = store.data.settings;\n  const sheet = openSheet({\n    title: store.displayName() || store.user || \"Профіль\",\n    subtitle: \"Профіль і швидкі налаштування\",\n    icon: \"user\",\n    size: \"md\",\n  });\n  const ex = s.exercise;\n\n  /* --- фото --- */\n  const avatarBtn = h(\"button\", { class: \"profile-avatar\", type: \"button\", title: \"Двічі натисніть, щоб змінити фото\" });\n  const fileInput = h(\"input\", { type: \"file\", accept: \"image/*\", style: \"position:absolute;width:0;height:0;opacity:0\" });\n  const nameEl = h(\"div\", { class: \"profile-name\" });\n  const subEl = h(\"div\", { class: \"profile-sub\" });\n  const removePhotoBtn = h(\"button\", {\n    type: \"button\",\n    style: \"background:none;border:none;padding:0;color:var(--accent);font-weight:800;font-size:12.5px;text-decoration:underline;text-underline-offset:3px;cursor:pointer\",\n  }, \"Прибрати фото\");\n  removePhotoBtn.addEventListener(\"click\", async () => {\n    await store.saveProfile({ avatar: \"\" });\n    paintPhoto();\n    paintAvatar();\n    toast(\"Фото прибрано\", { icon: \"check\" });\n  });\n\n  function paintPhoto() {\n    clear(avatarBtn);\n    const av = store.avatar();\n    if (av) avatarBtn.appendChild(h(\"img\", { src: av, alt: \"\" }));\n    else avatarBtn.appendChild(document.createTextNode((store.displayName() || \"?\").trim().charAt(0).toUpperCase()));\n    avatarBtn.appendChild(h(\"span\", { class: \"pa-badge\", html: iconMarkup(\"edit\") }));\n    removePhotoBtn.hidden = !av;\n    nameEl.textContent = store.displayName() || \"\";\n    subEl.textContent = `Назва профілю: ${store.user || \"—\"}`;\n  }\n\n  let avatarTap = 0;\n  avatarBtn.addEventListener(\"click\", () => {\n    const now = Date.now();\n    if (now - avatarTap \u003c 460) { avatarTap = 0; fileInput.click(); }\n    else avatarTap = now;\n  });\n  fileInput.addEventListener(\"change\", async () => {\n    const f = fileInput.files && fileInput.files[0];\n    if (!f) return;\n    try {\n      const dataUrl = await shrinkImage(f, 192);\n      await store.saveProfile({ avatar: dataUrl });\n      paintPhoto();\n      paintAvatar();\n      toast(\"Фото профілю оновлено\", { icon: \"check\" });\n    } catch (e) {\n      toast((e && e.message) || \"Не вдалося обробити фото\", { tone: \"warn\", icon: \"info\" });\n    }\n    fileInput.value = \"\";\n  });\n\n  /* --- рядки акаунту --- */\n  const nameRow = editableRow({\n    icon: \"user\",\n    label: \"Ім'я\",\n    value: () => store.displayName() || \"—\",\n    fields: () => [{ placeholder: \"Як до вас звертатися\", value: store.displayName() }],\n    hint: \"Показується у привітанні та у профілі. Це не назва профілю.\",\n    onSave: async ([v]) => {\n      await store.saveProfile({ displayName: v });\n      paintPhoto();\n      paintAvatar();\n      sheet.setTitle(store.displayName() || store.user);\n      nameRow.repaint();\n      toast(\"Ім'я збережено\", { icon: \"check\" });\n    },\n  });\n\n  const profileKeyRow = editableRow({\n    icon: \"briefcase\",\n    label: \"Назва профілю\",\n    value: () => store.user || \"—\",\n    fields: () => [{ placeholder: \"Назва профілю\", value: store.user }],\n    hint: \"Це ключ входу — саме його вводите при вході в акаунт. Ім'я та фото збережуться.\",\n    onSave: async ([v]) => {\n      const next = await store.renameProfile(v);\n      paintPhoto();\n      paintAvatar();\n      sheet.setTitle(store.displayName() || next);\n      profileKeyRow.repaint();\n      nameRow.repaint();\n      toast(`Профіль: «${next}»`, { icon: \"check\" });\n    },\n  });\n\n  const passRow = editableRow({\n    icon: \"lock\",\n    label: \"Пароль\",\n    masked: true,\n    value: () => \"••••••••\",\n    fields: () => [\n      { type: \"password\", label: \"Поточний пароль\", placeholder: \"Поточний пароль\" },\n      { type: \"password\", label: \"Новий пароль\", placeholder: \"Мінімум 4 символи\" },\n      { type: \"password\", label: \"Повторіть новий\", placeholder: \"Ще раз новий пароль\" },\n    ],\n    hint: \"Зберігається у зашифрованому вигляді разом з акаунтом на цьому пристрої.\",\n    onSave: async ([cur, next, again]) => {\n      if (next !== again) throw new Error(\"Нові паролі не збігаються\");\n      await store.changePassword(cur, next);\n      toast(\"Пароль змінено\", { icon: \"lock\" });\n    },\n  });\n\n  /* --- зарядка --- */\n  const streakNum = ex.streak || 0;\n\n  /* --- колір і режим --- */\n  const swatches = h(\"div\", { class: \"chip-row\" }, PALETTES.map((p) => {\n    const c = p[s.mode === \"dark\" ? \"dark\" : \"light\"];\n    return h(\"button\", {\n      class: `color-swatch${p.id === s.theme ? \" is-active\" : \"\"}`,\n      style: `background:linear-gradient(135deg,${c.c1},${c.c2} 55%,${c.c3});width:44px;height:44px;border-radius:14px;${p.id === s.theme ? \"outline:2.5px solid var(--accent);outline-offset:2px\" : \"\"}`,\n      title: p.name,\n      onclick: () => { store.setSetting(\"theme\", p.id); applyTheme(p.id, store.data.settings.mode); sheet.close(); openProfileSheet(); },\n    });\n  }));\n\n  append(sheet.body, [\n    h(\"div\", { class: \"profile-head\" },\n      avatarBtn, fileInput, nameEl, subEl,\n    ),\n    removePhotoBtn,\n    h(\"div\", { class: \"profile-note\" },\n      h(\"span\", { class: \"ico\", html: iconMarkup(\"info\") }),\n      h(\"span\", { class: \"grow\" }, \"Натисніть двічі на фото або на рядок, щоб змінити. Усе зберігається в акаунті.\"),\n    ),\n    nameRow.el,\n    profileKeyRow.el,\n    passRow.el,\n    h(\"div\", { class: \"streak-card\", style: \"margin:16px 0\" },\n      h(\"div\", { class: \"streak-ico\", html: iconMarkup(\"flame\") }),\n      h(\"div\", {},\n        h(\"div\", { class: \"streak-num\" }, `${streakNum} ${plural(streakNum, \"день\", \"дні\", \"днів\")}`),\n        h(\"div\", { class: \"streak-label\" }, ex.lastDone === todayStr() ? \"Зарядку сьогодні виконано\" : \"серія тренувань поспіль\"),\n      ),\n    ),\n    h(\"div\", { class: \"field-label\" }, \"Головний колір\"),\n    swatches,\n    h(\"div\", { class: \"field-label\", style: \"margin-top:16px\" }, \"Режим\"),\n    segmented(\n      [{ value: \"light\", label: \"Світлий\", icon: \"sun\" }, { value: \"dark\", label: \"Темний\", icon: \"moon\" }],\n      s.mode,\n      (v) => { store.setSetting(\"mode\", v); applyTheme(store.data.settings.theme, v); },\n      { fill: true },\n    ),\n  ]);\n\n  paintPhoto();\n\n  append(sheet.footer, [\n    btn(\"Усі налаштування\", { variant: \"soft\", block: true, icon: \"sliders\", onClick: () => { sheet.close(); navigate(\"calendar\", \"edit\", { scrollTo: \"app-settings\" }); } }),\n    btn(\"Зарядка\", { variant: \"ghost\", block: true, icon: \"dumbbell\", onClick: () => { sheet.close(); openExercise(ctxFor()); } }),\n    btn(\"Вийти з акаунту\", {\n      variant: \"danger-ghost\", block: true, icon: \"arrowLeft\",\n      onClick: async () => {\n        if (await confirmDialog({ title: \"Вийти з акаунту?\", message: \"Дані залишаться на цьому пристрої — ви зможете увійти знову.\", confirmText: \"Вийти\", danger: true })) {\n          sheet.close();\n          await store.logout();\n        }\n      },\n    }),\n  ]);\n  return sheet;\n}\n\n/* ---------- старт ---------- */\n\nwindow.addEventListener(\"error\", (e) => {\n  console.warn(\"app error\", e.message);\n});\n\n(async function boot() {\n  await store.init();\n  if (store.user) {\n    state.stage = \"app\";\n    applyTheme(store.data.settings.theme, store.data.settings.mode);\n    render();\n  } else {\n    state.stage = \"onboarding\";\n    render();\n  }\n})();\n"},{"path":"src/forms.js","text":"import { h, append, clear, openSheet, btn, field, textInput, textarea, selectInput, toast, confirmDialog } from \"./ui.js\";\nimport { iconMarkup } from \"./icons.js\";\nimport { store } from \"./store.js\";\nimport { todayStr, WEEKDAYS_SHORT, WEEKDAYS_LONG, normalizeUrl, fmtDateLong, fmtDateMedium, minOf, minutesToTime, roomLabel, diffDays, plural } from \"./util.js\";\n\nconst REPEAT_MODES = [\n  { value: \"once\", label: \"Одноразова\" },\n  { value: \"daily\", label: \"Щодня\" },\n  { value: \"weekly\", label: \"Щотижня\" },\n  { value: \"monthly\", label: \"Щомісяця\" },\n  { value: \"yearly\", label: \"Щороку\" },\n  { value: \"everyN\", label: \"Кожні N\" },\n];\n\nfunction kindToMode(kind) {\n  if (kind === \"once\" || !kind) return \"once\";\n  if (kind === \"daily\" || kind === \"weekly\" || kind === \"monthly\" || kind === \"yearly\") return kind;\n  return \"everyN\";\n}\n\nexport function openEventForm(ctx, existing, presetMode, preset) {\n  const isEdit = !!existing;\n  const ev = existing || {};\n  const seed = preset || {};\n  let mode = isEdit ? kindToMode(ev.kind) : (presetMode || \"once\");\n  let selectedDays = (ev.days || []).slice();\n\n  const sheet = openSheet({\n    title: isEdit ? \"Редагувати подію\" : \"Нова подія\",\n    subtitle: isEdit ? ev.title : (seed.date ? fmtDateLong(seed.date) : undefined),\n    icon: \"calendar\",\n    size: \"lg\",\n  });\n  const body = sheet.body;\n\n  const titleInput = textInput({ placeholder: \"Наприклад: Тренування\", value: ev.title || \"\", maxlength: 120 });\n  const dateInput = h(\"input\", { class: \"input\", type: \"date\", value: ev.date || seed.date || todayStr() });\n  const allDayToggle = h(\"input\", { type: \"checkbox\", class: \"switch-input\" });\n  let allDay = isEdit ? (!!ev.allDay || !ev.start) : false;\n  allDayToggle.checked = allDay;\n  const startInput = h(\"input\", { class: \"input\", type: \"time\", value: ev.start || seed.start || \"\" });\n  const endInput = h(\"input\", { class: \"input\", type: \"time\", value: ev.end || seed.end || \"\" });\n  const descInput = textarea({ placeholder: \"Опис (необов'язково)\", value: ev.desc || \"\", rows: 3, maxlength: 500 });\n  const linkInput = textInput({ placeholder: \"https://посилання (необов'язково)\", value: ev.link || \"\" });\n  const untilInput = h(\"input\", { class: \"input\", type: \"date\", value: ev.until || \"\" });\n  const intervalInput = h(\"input\", { class: \"input\", type: \"number\", min: 1, max: 99, value: String(ev.interval || 1) });\n  const unitSelect = selectInput([\n    { value: \"day\", label: \"днів\" },\n    { value: \"week\", label: \"тижнів\" },\n    { value: \"month\", label: \"місяців\" },\n  ], ev.unit || \"day\");\n\n  const timeRow = h(\"div\", { class: \"input-row\" }, field(\"Початок\", startInput), field(\"Кінець\", endInput));\n  const repeatBox = h(\"div\", {});\n  const daysBox = h(\"div\", { class: \"chip-row\", style: \"flex-wrap:wrap\" });\n\n  function renderDays() {\n    clear(daysBox);\n    for (let i = 0; i \u003c 7; i++) {\n      const dow = i + 1;\n      const chip = h(\"button\", { class: `chip${selectedDays.includes(dow) ? \" is-active\" : \"\"}`, type: \"button\" }, WEEKDAYS_SHORT[i]);\n      chip.addEventListener(\"click\", () => {\n        if (selectedDays.includes(dow)) selectedDays = selectedDays.filter((d) => d !== dow);\n        else selectedDays = selectedDays.concat(dow).sort();\n        renderDays();\n      });\n      daysBox.appendChild(chip);\n    }\n  }\n\n  function renderRepeat() {\n    clear(repeatBox);\n    if (mode === \"once\") return;\n    if (mode === \"yearly\") {\n      repeatBox.appendChild(h(\"div\", { class: \"gradient-note\", style: \"padding:13px 15px\" },\n        h(\"div\", { class: \"gn-text\", style: \"margin:0\" }, \"Повторюється щороку в цей самий день — чудово для свят і днів народження.\")));\n      return;\n    }\n    if (mode === \"weekly\") {\n      if (!selectedDays.length) {\n        const dow = ((new Date(dateInput.value || todayStr()).getDay() + 6) % 7) + 1;\n        selectedDays = [dow];\n      }\n      renderDays();\n      repeatBox.appendChild(field(\"Дні тижня\", daysBox));\n      repeatBox.appendChild(field(\"Кожні N тижнів\", intervalInput, \"1 — щотижня. 2 — раз на два тижні.\"));\n    } else if (mode === \"everyN\") {\n      repeatBox.appendChild(h(\"div\", { class: \"input-row\" },\n        field(\"Кожні\", intervalInput),\n        field(\"Одиниця\", unitSelect),\n      ));\n    }\n    repeatBox.appendChild(field(\"Повторювати до (необов'язково)\", untilInput));\n  }\n\n  function renderAll() {\n    clear(body);\n    const modeRow = h(\"div\", { class: \"chip-row\", style: \"margin-bottom:16px\" });\n    for (const m of REPEAT_MODES) {\n      const chip = h(\"button\", { class: `chip${mode === m.value ? \" is-active\" : \"\"}`, type: \"button\" }, m.label);\n      chip.addEventListener(\"click\", () => { mode = m.value; renderAll(); });\n      modeRow.appendChild(chip);\n    }\n\n    append(body, [\n      field(\"Назва\", titleInput),\n      field(\"Дата\", dateInput),\n      h(\"div\", { class: \"switch-row\", style: \"margin:-6px 0 8px\" },\n        h(\"span\", { class: \"switch-text\" },\n          h(\"span\", { class: \"switch-label\" }, \"Весь день\"),\n          h(\"span\", { class: \"switch-hint\" }, \"Без часу — буде в Календарі\"),\n        ),\n        h(\"span\", { class: \"switch\" }, allDayToggle, h(\"span\", { class: \"switch-knob\" })),\n      ),\n      allDay ? null : timeRow,\n      field(\"Опис\", descInput),\n      field(\"Посилання\", linkInput),\n      h(\"div\", { class: \"divider\" }),\n      h(\"div\", { class: \"field-label\", style: \"margin-bottom:8px\" }, \"Повторення\"),\n      modeRow,\n      repeatBox,\n    ]);\n    renderRepeat();\n  }\n\n  allDayToggle.addEventListener(\"change\", () => {\n    allDay = allDayToggle.checked;\n    renderAll();\n  });\n  startInput.addEventListener(\"change\", () => {\n    if (startInput.value && !endInput.value) {\n      const m = minOf(startInput.value);\n      if (m != null) endInput.value = minutesToTime(m + 60);\n    }\n  });\n\n  const saveBtn = btn(isEdit ? \"Зберегти зміни\" : \"Додати подію\", { block: true, size: \"lg\", icon: \"check\" });\n  saveBtn.addEventListener(\"click\", () => {\n    const title = titleInput.value.trim();\n    if (!title) { toast(\"Введіть назву події\", { icon: \"info\", tone: \"plain\", duration: 2400 }); titleInput.focus(); return; }\n    const date = dateInput.value || todayStr();\n    const payload = {\n      title,\n      date,\n      allDay,\n      start: allDay ? \"\" : startInput.value,\n      end: allDay ? \"\" : endInput.value,\n      desc: descInput.value.trim(),\n      link: linkInput.value.trim() ? normalizeUrl(linkInput.value) : \"\",\n      kind: mode,\n      days: mode === \"weekly\" ? selectedDays.slice() : [],\n      interval: (mode === \"weekly\" || mode === \"everyN\") ? Math.max(1, Number(intervalInput.value) || 1) : 1,\n      unit: mode === \"everyN\" ? unitSelect.value : \"day\",\n      until: (mode === \"once\" || mode === \"yearly\") ? null : (untilInput.value || null),\n    };\n    if (isEdit) {\n      store.updateEvent(ev.id, payload);\n      toast(\"Подію оновлено\", { icon: \"check\" });\n    } else {\n      store.addEvent(payload);\n      toast(`Додано: «${title}»`, { icon: \"check\" });\n    }\n    sheet.close();\n  });\n\n  append(sheet.footer, [saveBtn, btn(\"Скасувати\", { variant: \"ghost\", block: true, onClick: () => sheet.close() })]);\n  renderAll();\n  return sheet;\n}\n\n/* ---------- подорож ---------- */\n\nexport function openTripForm(ctx, existing) {\n  const isEdit = !!existing;\n  const t = existing || {};\n  const sheet = openSheet({\n    title: isEdit ? \"Редагувати подорож\" : \"Нова подорож\",\n    subtitle: isEdit ? t.title : \"Обери день виїзду та день повернення\",\n    icon: \"luggage\",\n    size: \"md\",\n  });\n\n  const titleInput = textInput({ placeholder: \"Куди? Наприклад: Прага\", value: t.title || \"\", maxlength: 90 });\n  const fromInput = h(\"input\", { class: \"input\", type: \"date\", value: t.from || todayStr() });\n  const toInput = h(\"input\", { class: \"input\", type: \"date\", value: t.to || t.from || todayStr() });\n  const descInput = textarea({ placeholder: \"Деталі (необов'язково)\", value: t.desc || \"\", rows: 3, maxlength: 500 });\n  const linkInput = textInput({ placeholder: \"https://посилання (необов'язково)\", value: t.link || \"\" });\n\n  const info = h(\"div\", { class: \"trip-info\" });\n\n  function renderInfo() {\n    clear(info);\n    const from = fromInput.value || todayStr();\n    const to = toInput.value || from;\n    const days = diffDays(from, to) + 1;\n    const one = from === to;\n    append(info, [\n      h(\"div\", { class: \"trip-info-row\" },\n        h(\"span\", { class: \"trip-info-label\" }, \"Виїзд\"),\n        h(\"span\", { class: \"trip-info-value\" }, fmtDateLong(from)),\n      ),\n      h(\"div\", { class: \"trip-info-row\" },\n        h(\"span\", { class xtLesson);\n\n  append(sheet.body, [\n    field(\"Тема\", subjectSelect, subjects.length ? null : \"Спочатку додайте розклад — тоді теми з'являться тут.\"),\n    field(\"Своя тема\", customSubject),\n    field(\"Завдання\", titleInput),\n    field(\"Опис\", descInput),\n    field(\"На яку дату\", dueInput),\n    nextLessonBox,\n    field(\"Посилання\", linkInput),\n  ]);\n  renderNextLesson();\n\n  const save = btn(isEdit ? \"Зберегти\" : \"Додати завдання\", { block: true, size: \"lg\", icon: \"check\" });\n  save.addEventListener(\"click\", () => {\n    const title = titleInput.value.trim();\n    if (!title) { toast(\"Введіть назву завдання\", { icon: \"info\", duration: 2200 }); titleInput.focus(); return; }\n    const payload = {\n      subject: currentSubject(),\n      title,\n      desc: descInput.value.trim(),\n      due: dueInput.value || todayStr(),\n      link: linkInput.value.trim() ? normalizeUrl(linkInput.value) : \"\",\n    };\n    if (isEdit) { store.updateTask(t.id, payload); toast(\"Завдання оновлено\", { icon: \"check\" }); }\n    else { store.addTask(payload); toast(`Додано: «${title}»`, { icon: \"check\" }); }\n    sheet.close();\n  });\n  append(sheet.footer, [save, btn(\"Скасувати\", { variant: \"ghost\", block: true, onClick: () => sheet.close() })]);\n  setTimeout(() => titleInput.focus(), 320);\n  return sheet;\n}\n"},{"path":"src/icons.js","text":"const S = (inner, extra = \"\") =>\n  `\u003csvg viewBox=\"0 0 24 24\" width=\"100%\" height=\"100%\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\" ${extra}>${inner}\u003c/svg>`;\n\nexport const ICONS = {\n  calendar: S(`\u003crect x=\"3\" y=\"4.5\" width=\"18\" height=\"16.5\" rx=\"3.2\"/>\u003cpath d=\"M8 2.8v3.4M16 2.8v3.4M3 10h18\"/>\u003ccircle cx=\"8.4\" cy=\"14.4\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\"/>\u003ccircle cx=\"12\" cy=\"14.4\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\"/>\u003ccircle cx=\"15.6\" cy=\"14 "4.4\"/>\u003cpath d=\"M12 1.6v2.6M12 19.8v2.6M4.2 4.2l1.9 1.9M17.9 17.9l1.9 1.9M1.6 12h2.6M19.8 12h2.6M4.2 19.8l1.9-1.9M17.9 6.1l1.9-1.9\"/>`),\n  moon: S(`\u003cpath d=\"M20.8 13.3A9 9 0 1 1 11 3.4a7.4 7.4 0 0 0 9.8 9.9z\"/>`),\n  bell: S(`\u003cpath d=\"M18 8.4a6 6 0 1 0-12 0c0 6.6-2.6 8.4-2.6 8.4h17.2S18 15 18 8.4\"/>\u003cpath d=\"M13.7 20.6a2 2 0 0 1-3.4 0\"/>`),\n  trophy: S(`\u003cpath d=\"M8 3.5h8v5.2a4 4 0 0 1-8 0z\"/>\u003cpath d=\"M8 4.8H5.4a1.4 1.4 0 0 0-1.4 1.4c0 2.1 1.5 3.6 4 3.8M16 4.8h2.6a1.4 1.4 0 0 1 1.4 1.4c0 2.1-1.5 3.6-4 3.8\"/>\u003cpath d=\"M12 12.7v3.6M8.6 20.5h6.8l-.7-4.2H9.3z\"/>`),\n  dumbbell: S(`\u003cpath d=\"M6.5 6.5v11M3 9v6M17.5 6.5v11M21 9v6M6.5 12h11\"/>`),\n  user: S(`\u003cpath d=\"M20 21v-1.8a4.2 4.2 0 0 0-4.2-4.2H8.2A4.2 4.2 0 0 0 4 19.2V21\"/>\u003ccircle cx=\"12\" cy=\"7.4\" r=\"4.1\"/>`),\n  lock: S(`\u003crect x=\"3.6\" y=\"10.4\" width=\"16.8\" height=\"11\" rx=\"2.6\"/>\u003cpath d=\"M7.4 10.4V7.2a4.6 4.6 0 0 1 9.2 0v3.2\"/>\u003ccircle cx=\"12\" cy=\"15.9\" r=\"1.3\" fill=\"currentColor\" stroke=\"none\"/>`),\n  arrowRight: S(`\u003cpath d=\"M4.5 12h15M13 5.5l6.5 6.5-6.5 6.5\"/>`),\n  arrowLeft: S(`\u003cpath d=\"M19.5 12h-15M11 5.5L4.5 12 11 18.5\"/>`),\n  globe: S(`\u003ccircle cx=\"12\" cy=\"12\" r=\"9.2\"/>\u003cpath d=\"M2.8 12h18.4\"/>\u003cpath d=\"M12 2.8a14 14 0 0 1 3.6 9.2A14 14 0 0 1 12 21.2a14 14 0 0 1-3.6-9.2A14 14 0 0 1 12 2.8z\"/>`),\n  palette: S(`\u003cpath d=\"M12 21.4a9.4 9.4 0 1 1 9.4-9.4c0 1.9-1.2 2.9-3 2.9h-1.6a1.9 1.9 0 0 0-1 3.4 1.9 1.9 0 0 1-1.4 3.1z\"/>\u003ccircle cx=\"7.8\" cy=\"11.6\" r=\"1.2\" fill=\"currentColor\" stroke=\"none\"/>\u003ccircle cx=\"11\" cy=\"7.8\" r=\"1.2\" fill=\"currentColor\" stroke=\"none\"/>\u003ccircle cx=\"15.6\" cy=\"9.2\" r=\"1.2\" fill=\"currentColor\" stroke=\"none\"/>`),\n  flame: S(`\u003cpath d=\"M12 2.8s5.4 4.2 5.4 9a5.4 5.4 0 0 1-10.8 0c0-1.6.7-3 1.7-4.2.3 1.2 1.1 2 2.1 2.2-.4-2.6.3-5.2 1.6-7z\"/>\u003cpath d=\"M12 21.2a3.1 3.1 0 0 0 3.1-3.1c0-1.7-1.6-2.9-3.1-4.6-1.5 1.7-3.1 2.9-3.1 4.6A3.1 3.1 0 0 0 12 21.2z\"/>`),\n  briefcase: S(`\u003crect x=\"2.8\" y=\"7.2\" width=\"18.4\" height=\"13.4\" rx=\"2.6\"/>\u003cpath d=\"M8.4 7.2V5.4a2 2 0 0 1 2-2h3.2a2 2 0 0 1 2 2v1.8M2.8 12.6h18.4\"/>`),\n  home: S(`\u003cpath d=\"M3.6 10.4L12 3.2l8.4 7.2V20a1.6 1.6 0 0 1-1.6 1.6H5.2A1.6 1.6 0 0 1 3.6 20z\"/>\u003cpath d=\"M9.4 21.6v-7.4h5.2v7.4\"/>`),\n  ruler: S(`\u003crect x=\"2.6\" y=\"8.4\" width=\"18.8\" height=\"7.2\" rx=\"1.8\" transform=\"rotate(-45 12 12)\"/>\u003cpath d=\"M9.4 6.6l1.6 1.6M12.2 9.4l1.6 1.6M15 12.2l1.6 1.6\"/>`),\n  refresh: S(`\u003cpath d=\"M20.5 11.5a8.5 8.5 0 1 0-2.2 6\"/>\u003cpath d=\"M20.8 5.4v6.1h-6.1\"/>`),\n  send: S(`\u003cpath d=\"M21 3L10.5 13.5M21 3l-7.2 18-3.3-7.5L3 10.2z\"/>`),\n  stop: S(`\u003crect x=\"6.4\" y=\"6.4\" width=\"11.2\" height=\"11.2\" rx=\"2.4\"/>`),\n  info: S(`\u003ccircle cx=\"12\" cy=\"12\" r=\"9.2\"/>\u003cpath d=\"M12 11v5.4\"/>\u003ccircle cx=\"12\" cy=\"7.8\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\"/>`),\n  filter: S(`\u003cpath d=\"M3.4 5.4h17.2l-6.6 7.8v6.2l-4-2v-4.2z\"/>`),\n  eye: S(`\u003cpath d=\"M2 12s3.6-6.4 10-6.4S22 12 22 12s-3.6 6.4-10 6.4S2 12 2 12z\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"2.8\"/>`),\n  eyeOff: S(`\u003cpath d=\"M4 4l16 16\"/>\u003cpath d=\"M9.6 9.7A2.8 2.8 0 0 0 12 14.8c.8 0 1.5-.3 2-.9\"/>\u003cpath d=\"M6.4 6.6C3.7 8.3 2 12 2 12s3.6 6.4 10 6.4c1.7 0 3.2-.4 4.4-1.1\"/>\u003cpath d=\"M19.5 15.4C21.2 13.8 22 12 22 12s-3.6-6.4-10-6.4c-.9 0-1.7.1-2.4.3\"/>`),\n  layers: S(`\u003cpath d=\"M12 2.6L2.6 7.6 12 12.6l9.4-5z\"/>\u003cpath d=\"M2.6 12.4L12 17.4l9.4-5M2.6 16.8L12 21.8l9.4-5\"/>`),\n  gift: S(`\u003cpath d=\"M19.6 12.4V20a1.8 1.8 0 0 1-1.8 1.8H6.2A1.8 1.8 0 0 1 4.4 20v-7.6\"/>\u003crect x=\"2.6\" y=\"7.6\" width=\"18.8\" height=\"4.8\" rx=\"1.4\"/>\u003cpath d=\"M12 21.8V7.6\"/>\u003cpath d=\"M12 7.6H7.9a2.4 2.4 0 0 1 0-4.8C11.1 2.8 12 7.6 12 7.6zM12 7.6h4.1a2.4 2.4 0 0 0 0-4.8C12.9 2.8 12 7.6 12 7.6z\"/>`),\n  frown: S(`\u003ccircle cx=\"12\" cy=\"12\" r=\"9.2\"/>\u003cpath d=\"M8.4 15.6a4.6 4.6 0 0 1 7.2 0\"/>\u003ccircle cx=\"9\" cy=\"9.6\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\"/>\u003ccircle cx=\"15\" cy=\"9.6\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\"/>`),\n  target: S(`\u003ccircle cx=\"12\" cy=\"12\" r=\"9\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"5.2\"/>\u003ccircle cx=\"12\" cy=\"12\" r=\"1.4\" fill=\"currentColor\" stroke=\"none\"/>`),\n  mapPin: S(`\u003cpath d=\"M12 21.6s7-5.9 7-11.2a7 7 0 1 0-14 0c0 5.3 7 11.2 7 11.2z\"/>\u003ccircle cx=\"12\" cy=\"10.2\" r=\"2.6\"/>`),\n  luggage: S(`\u003crect x=\"4.4\" y=\"7.6\" width=\"15.2\" height=\"12.4\" rx=\"2.4\"/>\u003cpath d=\"M9 7.6V5.2a1.6 1.6 0 0 1 1.6-1.6h2.8A1.6 1.6 0 0 1 15 5.2v2.4\"/>\u003cpath d=\"M9.4 11.4v4.8M14.6 11.4v4.8\"/>`),\n};\n\nexport function iconEl(name, cls = \"ico\") {\n  const span = document.createElement(\"span\");\n  span.className = cls;\n  span.innerHTML = ICONS[name] || ICONS.info;\n  return span;\n}\n\nexport function iconMarkup(name) {\n  return ICONS[name] || ICONS.info;\n}\n"},{"path":"src/itemdetail.js","text":"import { h, append, openSheet, btn, toast, confirmDialog } from \"./ui.js\";\nimport { iconMarkup } from \"./icons.js\";\nimport { store } from \"./store.js\";\nimport { fmtDateLong, prettyUrl, normalizeUrl, todayStr, tripDuration, tripRangeLabel, tripReminder, WEEKDAYS_LONG, weekdayIdx, plural } from \"./util.js\";\nimport { statusLabel, itemStatus } from \"./schedule.js\";\n\nexport function openItemSheet(item, dateStr, ctx) {\n  const sheet = openSheet({\n    title: item.title,\n    subtitle: `${fmtDateLong(dateStr)}${item.start ? \" · \" + (item.end ? `${item.start}–${item.end}` : item.start) : \" · весь день\"}`,\n    icon: item.source === \"lesson\" ? \"book\" : \"calendar\",\n  });\n  const st = itemStatus(item, dateStr);\n  const body = sheet.body;\n\n  append(body, [\n    h(\"div\", { class: \"chip-row\", style: \"margin-bottom:14px\" },\n      h(\"span\", { class: `tag${item.source === \"lesson\" ? \"\" : \" tag-muted\"}` }, item.source === \"lesson\" ? `Заняття №${item.lessonNo}` : (item.kind && item.kind !== \"once\" ? \"Повторювана подія\" : \"Подія\")),\n      item.meta ? h(\"span\", { class: \"tag tag-muted\" }, item.meta) : null,\n      statusLabel(st, item) ? h(\"span\", { class: \"tag\" }, statusLabel(st, item)) : null,\n    ),\n    item.desc ? h(\"div\", { style: \"font-size:14.5px;line-height:1.55;white-space:pre-wrap;color:var(--dim)\" }, item.desc) : h(\"div\", { class: \"faint\", style: \"font-size:14px\" }, \"Опису немає.\"),\n    item.link\n      ? h(\"a\", { class: \"task-link\", href: normalizeUrl(item.link), target: \"_blank\", rel: \"noopener noreferrer\", style: \"margin-top:14px\" },\n          h(\"span\", { class: \"ico\", html: iconMarkup(\"link\") }), prettyUrl(item.link))\n      : null,\n    item.raw && item.raw.kind && item.raw.kind !== \"once\"\n      ? h(\"div\", { class: \"faint\", style: \"font-size:12.5px;margin-top:14px\" }, \"Повторюється: \" + repeatText(item.raw))\n      : null,\n  ]);\n\n  const actions = [];\n  if (item.source === \"event\") {\n    actions.push(btn(\"Редагувати\", { variant: \"soft\", block: true, icon: \"edit\", onClick: () => { sheet.close(); ctx.openEventForm(item.raw); } }));\n    actions.push(btn(\"Видалити\", {\n      variant: \"danger-ghost\", block: true, icon: \"trash\",\n      onClick: async () => {\n        if (await confirmDialog({ title: \"Видалити подію?\", message: `«${item.title}» буде видалено з календаря.`, confirmText: \"Видалити\", danger: true })) {\n          store.removeEvent(item.raw.id);\n          toast(\"Подію видалено\", { icon: \"trash\", duration: 2400 });\n          sheet.close();\n        }\n      },\n    }));\n  } else {\n    actions.push(btn(\"Перейти в графік дня\", { variant: \"soft\", block: true, icon: \"clock\", onClick: () => { sheet.close(); ctx.navigate(\"calendar\", \"day\"); } }));\n  }\n  append(sheet.footer, actions);\n  return sheet;\n}\n\nexport function openTripSheet(trip, ctx) {\n  const today = todayStr();\n  const rem = tripReminder(trip, today);\n  const days = tripDuration(trip);\n  const sheet = openSheet({\n    title: trip.title || \"Подорож\",\n    subtitle: `${tripRangeLabel(trip)} · ${days} ${plural(days, \"день\", \"дні\", \"днів\")}`,\n    icon: \"luggage\",\n    size: \"md\",\n  });\n\n  append(sheet.body, [\n    rem ? h(\"div\", { class: `trip-head is-${rem.kind}` },\n      h(\"span\", { class: \"trip-head-ico\", html: iconMarkup(\"luggage\") }),\n      h(\"div\", { class: \"trip-head-text\" },\n        h(\"div\", { class: \"trip-head-title\" }, rem.title),\n        rem.note ? h(\"div\", { class: \"trip-head-sub\" }, rem.note) : null,\n      ),\n    ) : null,\n    h(\"div\", { class: \"trip-rows\" },\n      tripRow(\"Виїзд\", trip.from),\n      tripRow(\"Повернення\", trip.to),\n      tripRow(\"Тривалість\", null, `${days} ${plural(days, \"день\", \"дні\", \"днів\")}`),\n    ),\n    trip.desc ? h(\"div\", { class: \"trip-desc\" }, trip.desc) : null,\n    trip.link\n      ? h(\"a\", { class: \"task-link\", href: normalizeUrl(trip.link), target: \"_blank\", rel: \"noopener noreferrer\", style: \"margin-top:14px\" },\n          h(\"span\", { class: \"ico\", html: iconMarkup(\"link\") }), prettyUrl(trip.link))\n      : null,\n  ]);\n\n  append(sheet.footer, [\n    btn(\"Редагувати подорож\", { variant: \"soft\", block: true, icon: \"edit\", onClick: () => { sheet.close(); ctx.openTripForm(trip); } }),\n    btn(\"Видалити\", {\n      variant: \"danger-ghost\", block: true, icon: \"trash\",\n      onClick: async () => {\n        if (await confirmDialog({ title: \"Видалити подорож?\", message: `«${trip.title}» зникне з календаря.`, confirmText: \"Видалити\", danger: true })) {\n          store.removeTrip(trip.id);\n          toast(\"Подорож видалено\", { icon: \"trash\", duration: 2400 });\n          sheet.close();\n        }\n      },\n    }),\n  ]);\n  return sheet;\n}\n\nfunction tripRow(label, dateStr, override) {\n  return h(\"div\", { class: \"trip-row\" },\n    h(\"span\", { class: \"trip-row-label\" }, label),\n    h(\"span\", { class: \"trip-row-value\" },\n      override || (dateStr ? `${fmtDateLong(dateStr)} · ${WEEKDAYS_LONG[weekdayIdx(dateStr)].toLowerCase()}` : \"\"),\n    ),\n  );\n}\n\nfunction repeatText(ev) {\n  const k = ev.kind;\n  if (k === \"yearly\") return \"щороку\";\n  if (k === \"daily\") return \"щодня\";\n  if (k === \"weekly\") return \"щотижня\";\n  if (k === \"monthly\") return \"щомісяця\";\n  return String(k);\n}\n"},{"path":"src/nextcard.js","text":"import { h, btn } from \"./ui.js\";\nimport { iconMarkup } from \"./icons.js\";\nimport { nextItem, countdownText } from \"./schedule.js\";\nimport { openItemSheet, openTripSheet } from \"./itemdetail.js\";\nimport { openExercise } from \"./screens/exercise.js\";\nimport { tripRangeLabel } from \"./util.js\";\n\nexport function nextCard(ctx, opts = {}) {\n  const { filter, hideEmpty = false } = opts;\n  const next = nextItem(filter);\n\n  if (!next) {\n    if (hideEmpty) return null;\n    return h(\"div\", { class: \"gradient-note\" },\n      h(\"div\", { class: \"gn-title\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"sparkles\") }), \"Вільно\"),\n      h(\"div\", { class: \"gn-text\" }, \"На сьогодні й на завтра в розкладі порожньо. Гарний час, щоб додати щось нове.\"),\n      h(\"div\", { class: \"gn-actions\" },\n        btn(\"Додати подію\", { variant: \"ghost\", size: \"sm\", icon: \"plus\", onClick: () => ctx.openEventForm(null) }),\n      ),\n    );\n  }\n\n  const { item, status, date } = next;\n  const isTomorrow = status === \"tomorrow\";\n  const raw = isTomorrow\n    ? \"Наступне завтра\"\n    : status === \"live\"\n      ? (item.end ? `Зараз триває до ${item.end}` : \"Зараз триває\")\n      : (item.start ? countdownText(item, date) : \"Наступне\");\n  const labelText = raw.charAt(0).toUpperCase() + raw.slice(1);\n\n  const open = () => {\n    if (item.source === \"exercise\") { openExercise(ctx); return; }\n    if (item.source === \"trip\") { openTripSheet(item.trip, ctx); return; }\n    openItemSheet(item, date, ctx);\n  };\n\n  return h(\"div\", { class: \"gradient-note\", role: \"button\", style: \"cursor:pointer\", onclick: open },\n    h(\"div\", { class: \"gn-title\" }, h(\"span\", { class: \"ico\", html: iconMarkup(isTomorrow ? \"calendar\" : \"clock\") }), labelText),\n    h(\"div\", { class: \"gn-text\" },\n      h(\"strong\", {}, item.title),\n      item.start ? ` · ${item.start}${item.end ? \"–\" + item.end : \"\"}` : \"\",\n      item.meta ? ` · ${item.meta}` : \"\",\n    ),\n    item.source === \"exercise\" && !item.done\n      ? h(\"div\", { class: \"gn-actions\" },\n          btn(\"Почати\", { variant: \"soft\", size: \"sm\", icon: \"dumbbell\", onClick: (e) => { e.stopPropagation(); openExercise(ctx); } }),\n        )\n      : null,\n  );\n}\n\nexport function tripNotice(trip, reminder, ctx) {\n  return h(\"button\", {\n    class: `trip-note is-${reminder.kind}`,\n    type: \"button\",\n    onclick: () => openTripSheet(trip, ctx),\n  },\n    h(\"span\", { class: \"trip-note-ico\", html: iconMarkup(\"luggage\") }),\n    h(\"span\", { class: \"trip-note-text\" },\n      h(\"span\", { class: \"trip-note-title\" }, reminder.title),\n      h(\"span\", { class: \"trip-note-sub\" }, `${trip.title} · ${reminder.note || tripRangeLabel(trip)}`),\n    ),\n    h(\"span\", { class: \"chev\", html: iconMarkup(\"chevronRight\") }),\n  );\n}\n"},{"path":"src/schedule.js","text":"import { minOf, nowMinutes, todayStr, diffDays, relDayWord, plural, addDaysStr } from \"./util.js\";\nimport { store } from \"./store.js\";\n\nexport const soonMinutes = () => Number(window.root.soonMinutes) || 5;\n\nexport function itemStatus(item, dateStr, nowMin = nowMinutes()) {\n  const isTimed = item.category ? item.category === \"timed\" : !!item.start;\n  if (!isTimed || !item.start) {\n    return dateStr === todayStr() ? \"allday\" : (dateStr \u003c todayStr() ? \"past\" : \"allday\");\n  }\n  if (item.done) return \"past\";\n  const delta = diffDays(todayStr(), dateStr);\n  if (delta \u003c 0) return \"past\";\n  if (delta > 0) return \"upcoming\";\n  const s = minOf(item.start);\n  if (s == null) return \"allday\";\n  const e = item.end ? minOf(item.end) : s + 45;\n  const soon = soonMinutes();\n  // Зарядку можна зробити будь-коли протягом дня, тож після її вікна вона\n  // лишається активною (з кнопкою «Почати»), а не «завершеною».\n  if (item.source === \"exercise\") {\n    if (nowMin \u003c s - soon) return \"upcoming\";\n    if (nowMin \u003c= s) return \"soon\";\n    if (nowMin \u003c e) return \"live\";\n    return \"upcoming\";\n  }\n  if (nowMin \u003c s - soon) return \"upcoming\";\n  if (nowMin \u003c= s) return \"soon\";\n  if (nowMin \u003c e) return \"live\";\n  if (nowMin \u003c e + soon) return \"ending\";\n  return \"past\";\n}\n\nexport function statusClass(status) {\n  switch (status) {\n    case \"soon\": return \"is-soon\";\n    case \"live\": return \"is-now\";\n    case \"ending\": return \"is-ending\";\n    case \"past\": return \"is-past\";\n    default: return \"\";\n  }\n}\n\nexport function statusLabel(status, item) {\n  if (item && item.source === \"exercise\" && item.done) return \"Виконано\";\n  switch (status) {\n    case \"soon\": return \"Ось-ось\";\n    case \"live\": return \"Зараз\";\n    case \"ending\": return \"Завершується\";\n    case \"past\": return \"Завершено\";\n    default: return \"\";\n  }\n}\n\nexport function humanDuration(mins) {\n  const m = Math.max(0, Math.round(mins));\n  if (m \u003c 1) return \"менше хвилини\";\n  if (m \u003c 60) return `${m} ${plural(m, \"хвилина\", \"хвилини\", \"хвилин\")}`;\n  const hours = Math.floor(m / 60);\n  const rest = m % 60;\n  if (hours \u003c 24) {\n    return rest ? `${hours} год ${rest} хв` : `${hours} ${plural(hours, \"година\", \"години\", \"годин\")}`;\n  }\n  const days = Math.round(hours / 24);\n  return `${days} ${plural(days, \"день\", \"дні\", \"днів\")}`;\n}\n\nexport function nextItem(filter) {\n  const today = todayStr();\n  const items = store.dayItems(today);\n  const now = nowMinutes();\n  let exerciseFallback = null;\n  for (const item of items) {\n    if (filter && !filter(item)) continue;\n    const st = itemStatus(item, today, now);\n    if (st === \"live\" || st === \"soon\" || st === \"upcoming\") {\n      // Зарядку можна зробити будь-коли, тож вона не має затуляти реальну найближчу подію:\n      // показуємо її лише тоді, коли вона триває «зараз», або коли більше нічого немає.\n      if (item.source === \"exercise\") {\n        if (st === \"live\") return { item, status: st, date: today };\n        if (!exerciseFallback) exerciseFallback = { item, status: st, date: today };\n        continue;\n      }\n      return { item, status: st, date: today };\n    }\n  }\n  if (exerciseFallback) return exerciseFallback;\n  const tomorrow = addDaysStr(today, 1);\n  const tItems = store.dayItems(tomorrow).filter((i) => (!filter || filter(i)) && i.source !== \"exercise\");\n  if (tItems.length) return { item: tItems[0], status: \"tomorrow\", date: tomorrow };\n  return null;\n}\n\nexport function countdownText(item, dateStr) {\n  if (!item.start) return \"\";\n  const delta = diffDays(todayStr(), dateStr);\n  const now = nowMinutes();\n  const s = minOf(item.start);\n  const minutes = delta * 1440 + s - now;\n  if (minutes \u003c= 0) return \"зараз\";\n  if (delta === 0) return `через ${humanDuration(minutes)}`;\n  return `${relDayWord(delta)}, у ${item.start}`;\n}\n\nexport function dayHasContent(dateStr) {\n  return store.dayItems(dateStr).length > 0;\n}\n"},{"path":"src/scheduler.js","text":"import { toast } from \"./ui.js\";\nimport { store } from \"./store.js\";\nimport { todayStr, addDaysStr, minOf, nowMinutes } from \"./util.js\";\n\nconst KEY = \"kri.planner.notified.v1\";\nlet timer = null;\n\nfunction loadNotified() {\n  try {\n    return JSON.parse(localStorage.getItem(KEY) || \"{}\");\n  } catch (e) {\n    return {};\n  }\n}\n\nfunction saveNotified(obj) {\n  const keys = Object.keys(obj);\n  if (keys.length > 120) {\n    const sorted = keys.sort();\n    const trimmed = {};\n    for (const k of sorted.slice(-80)) trimmed[k] = obj[k];\n    obj = trimmed;\n  }\n  try { localStorage.setItem(KEY, JSON.stringify(obj)); } catch (e) { /* ignore */ }\n}\n\nexport function startScheduler(ctx) {\n  stopScheduler();\n  const tick = () => {\n    try { check(ctx); } catch (e) { console.warn(\"scheduler\", e); }\n  };\n  tick();\n  timer = setInterval(tick, 25000);\n}\n\nexport function stopScheduler() {\n  if (timer) clearInterval(timer);\n  timer = null;\n}\n\nfunction check(ctx) {\n  if (!store.user) return;\n  const notified = loadNotified();\n  const today = todayStr();\n  const now = nowMinutes();\n  let dirty = false;\n\n  const r = store.data.settings.reminders;\n  if (r.events) {\n    const mins = Number(r.eventsMinutes) || 5;\n    for (const item of store.dayItems(today)) {\n      if (!item.start || item.source === \"exercise\" || item.source === \"trip\") continue;\n      const s = minOf(item.start);\n      if (s == null) continue;\n      const diff = s - now;\n      if (diff \u003c= 0 || diff > mins) continue;\n      const key = `ev.${item.id}.${today}`;\n      if (notified[key]) continue;\n      notified[key] = Date.now();\n      dirty = true;\n      toast(`${item.title} — о ${item.start}`, {\n        icon: \"bell\",\n        duration: 10000,\n        actionLabel: \"Показати\",\n        onAction: () => ctx.navigate(\"calendar\", \"day\"),\n      });\n    }\n  }\n\n  const hwKey = \"hw.\" + today;\n  if (r.homework && now >= (minOf(r.homeworkTime || \"18:00\") ?? 1080) && !notified[hwKey]) {\n    const pending = store.data.tasks.filter((t) => !t.done && (t.due === today || t.due === addDaysStr(today, 1)));\n    if (pending.length) {\n      notified[hwKey] = Date.now();\n      dirty = true;\n      toast(`Залишилось ${pending.length} незавершених завдань`, {\n        icon: \"clipboard\",\n        duration: 10000,\n        actionLabel: \"Відкрити\",\n        onAction: () => ctx.navigate(\"diary\", \"tasks\"),\n      });\n    }\n  }\n\n  if (dirty) saveNotified(notified);\n}\n"},{"path":"src/screens/auth.js","text":"import { h, append, btn, field, textInput, clear, toast } from \"../ui.js\";\nimport { iconMarkup } from \"../icons.js\";\nimport { store } from \"../store.js\";\n\nexport function renderAuth({ mode = \"login\", onMode, onAuthed }) {\n  const wrap = h(\"div\", { class: \"auth\" });\n  const inner = h(\"div\", { class: \"auth-inner\" });\n  let current = mode;\n  let busy = false;\n\n  const form = h(\"div\", { class: \"auth-card\" });\n  const switchRow = h(\"div\", { class: \"auth-switch\" });\n  const usersRow = h(\"div\", { class: \"auth-users\" });\n\n  append(inner, [\n    h(\"div\", { class: \"auth-logo\", html: iconMarkup(\"calendar\") }),\n    h(\"h1\", { class: \"auth-title\" }, \"KRI Планер\"),\n    h(\"p\", { class: \"auth-sub\" }, \"Календар · Графік дня · Щоденник · ШІ\"),\n    form,\n    switchRow,\n    usersRow,\n  ]);\n  wrap.appendChild(inner);\n\n  function paint() {\n    clear(form);\n    const isLogin = current === \"login\";\n    const username = textInput({ placeholder: isLogin ? \"Назва профілю\" : \"Придумайте назву\", name: \"username\", autocomplete: \"username\" });\n    const displayName = !isLogin ? textInput({ placeholder: \"Як до вас звертатися\", name: \"displayName\", autocomplete: \"name\" }) : null;\n    const passWrap = h(\"div\", { class: \"input-prefix\" },\n      h(\"span\", { class: \"ico\", html: iconMarkup(\"lock\") }),\n      textInput({ type: \"password\", placeholder: \"Пароль\", name: \"password\", autocomplete: isLogin ? \"current-password\" : \"new-password\", style: \"padding-left:43px\" }),\n    );\n    const pass = passWrap.querySelector(\"input\");\n    const confirm = textInput({ type: \"password\", placeholder: \"Повторіть пароль\", autocomplete: \"new-password\" });\n    const errorBox = h(\"div\", { class: \"auth-error hidden\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"info\") }), h(\"span\", { class: \"grow\" }));\n\n    const eyeBtn = h(\"button\", { class: \"icon-btn plain\", type: \"button\", style: \"position:absolute;right:4px;top:50%;transform:translateY(-50%)\", html: iconMarkup(\"eye\") });\n    eyeBtn.addEventListener(\"click\", () => {\n      const show = pass.type === \"password\";\n      pass.type = show ? \"text\" : \"password\";\n      if (confirm) confirm.type = pass.type;\n      eyeBtn.innerHTML = iconMarkup(show ? \"eyeOff\" : \"eye\");\n    });\n    passWrap.appendChild(eyeBtn);\n\n    function showError(msg) {\n      errorBox.querySelector(\"span.grow\").textContent = msg;\n      errorBox.classList.remove(\"hidden\");\n      errorBox.style.animation = \"none\";\n      void errorBox.offsetWidth;\n      errorBox.style.animation = \"\";\n    }\n\n    const submit = btn(isLogin ? \"Увійти\" : \"Створити акаунт\", {\n      icon: isLogin ? \"arrowRight\" : \"user\",\n      block: true,\n      size: \"lg\",\n      onClick: run,\n    });\n\n    append(form, [\n      errorBox,\n      field(\"Назва профілю\", username, isLogin ? null : \"Ключ входу — саме його вводите при вході\"),\n      !isLogin ? field(\"Ім'я\", displayName, \"Необов'язково. Показується у привітанні\") : null,\n      field(\"Пароль\", passWrap, isLogin ? null : \"Мінімум 4 символи\"),\n      !isLogin ? field(\"Підтвердження пароля\", confirm) : null,\n      submit,\n      h(\"div\", { class: \"faint center\", style: \"font-size:12px;margin-top:12px;line-height:1.45\" },\n        isLogin ? \"Ви залишаєтесь у системі на цьому пристрої — входити щоразу не потрібно.\" : \"Без email. Акаунт зберігається тільки на цьому пристрої.\"),\n    ]);\n\n    function onSubmit(e) { e.preventDefault(); run(); }\n    form.addEventListener(\"keydown\", (e) => { if (e.key === \"
