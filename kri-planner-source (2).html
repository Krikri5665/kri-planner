;\n    for (let i = 0; i \u003c days; i++) {\n      const d = addDaysStr(fromDate, i);\n      for (const ev of this.data.events) {\n        if (occurrencesOfRepeatPattern(ev, d)) out.push({ date: d, ev });\n      }\n    }\n    return out;\n  },\n};\n\nexport function isSameDay(a, b) {\n  return a === b;\n}\n\nexport function dowName(dow) {\n  return [\"Понеділок\", \"Вівторок\", \"Середа\", \"Четвер\", \"П'ятниця\", \"Субота\", \"Неділя\"][dow - 1] || \"\";\n}\n\nexport function dowOfDate(dateStr) {\n  return toISODow(dateStr);\n}\n\nexport function dateOfDowInWeek(startStr, dow) {\n  return addDaysStr(startStr, dow - 1);\n}\n"},{"path":"src/styles.css","text":"/* ============================================================\n   KRI Планер — стилі\n   ============================================================ */\n\n:root {\n  --c1: #0b6b60;\n  --c2: #0d9488;\n  --c3: #2dd4bf;\n  --accent: #0d9488;\n  --accent-ink: #ffffff;\n  --accent-soft: rgba(13, 148, 136, 0.10);\n  --accent-ring: rgba(13, 148, 136, 0.30);\n  --accent-glow: rgba(13, 148, 136, 0.35);\n  --grad: linear-gradient(135deg, #0b6b60, #0d9488 52%, #2dd4bf);\n\n  --bg: #eff4f3;\n  --surface: #ffffff;\n  --surface-2: #f5f9f8;\n  --surface-3: #eaf1f0;\n  --text: #0d1a19;\n  --dim: #5b6b69;\n  --faint: #93a3a1;\n  --border: rgba(13, 26, 25, 0.09);\n  --border-strong: rgba(13, 26, 25, 0.16);\n  --shadow-sm: 0 1px 2px rgba(9, 22, 21, 0.06), 0 2px 8px rgba(9, 22, 21, 0.05);\n  --shadow-md: 0 6px 18px rgba(9, 22, 21, 0.09), 0 2px 6px rgba(9, 22, 21, 0.05);\n  --shadow-lg: 0 18px 48px rgba(9, 22, 21, 0.16), 0 6px 18px rgba(9, 22, 21, 0.08);\n  --radius: 20px;\n  --radius-sm: 14px;\n  --radius-lg: 28px;\n  --tabbar-h: 96px;\n}\n\nhtml[data-mode=\"dark\"] {\n  --bg: #070d0c;\n  --surface: #15201f;\n  --surface-2: #1b2726;\n  --surface-3: #243130;\n  --text: #e9f2f1;\n  --dim: #9aacaa;\n  --faint: #8a9c9a;\n  --border: rgba(255, 255, 255, 0.09);\n  --border-strong: rgba(255, 255, 255, 0.17);\n  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.4);\n  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.5);\n  --shadow-lg: 0 22px 54px rgba(0, 0, 0, 0.62);\n}\n\n* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n\nhtml, body {\n  margin: 0;\n  padding: 0;\n  height: 100%;\n}\n\nbody {\n  text-align: left;\n  font-family: \"Inter\", -apple-system, BlinkMacSystemFont, \"Segoe UI\", Roboto, \"Helvetica Neue\", Arial, sans-serif;\n  font-size: 15px;\n  line-height: 1.5;\n  color: var(--text);\n  background: var(--bg);\n  -webkit-font-smoothing: antialiased;\n  overflow: hidden;\n}\n\n@media (min-width: 940px) {\n  body {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    background:\n      radial-gradient(1200px 700px at 20% -10%, var(--accent-soft), transparent 60%),\n      radial-gradient(900px 600px at 110% 110%, var(--accent-soft), transparent 55%),\n      var(--bg);\n  }\n}\n\nbutton, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }\nbutton { border: none; background: none; cursor: pointer; }\na { color: var(--accent); }\n::selection { background: var(--accent-ring); }\n\n.ico { display: inline-flex; width: 22px; height: 22px; flex: 0 0 auto; }\n.ico svg { width: 100%; height: 100%; display: block; }\n\n/* іконки, вставлені «голим» svg прямо в контейнер (iconMarkup без обгортки .ico) */\n.btn-ico,\n.seg-ico { display: inline-flex; width: 21px; height: 21px; flex: 0 0 auto; }\n.btn-ico > svg,\n.seg-ico > svg { width: 100%; height: 100%; display: block; }\n.chat-send > svg { width: 21px; height: 21px; display: block; }\n.ex-art > svg { width: 56px; height: 56px; display: block; }\n.onboard-art-core > svg { width: 46px; height: 46px; display: block; }\n.check-btn > svg { width: 18px; height: 18px; display: block; }\n.badge-ico > svg { width: 18px; height: 18px; display: block; }\n.next-check > svg { width: 16px; height: 16px; display: block; }\n\n/* ============================================================\n   Каркас\n   ============================================================ */\n\n.app-root {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  width: 100%;\n  max-width: 720px;\n  height: 100dvh;\n  margin: 0 auto;\n  background: var(--bg);\n  overflow: hidden;\n}\n\n@media (min-width: 940px) {\n  .app-root {\n    max-width: min(1120px, 96vw);\n    height: calc(100dvh - 34px);\n    border-radius: 26px;\n    box-shadow: var(--shadow-lg);\n    border: 1px solid var(--border);\n    overflow: hidden;\n  }\n  .page { width: 100%; max-width: 1056px; margin: 0 auto; }\n  .page-chat, .page-tasks { max-width: 880px; }\n  .bubble { max-width: min(620px, 82%); }\n}\n\n@media (min-width: 1180px) {\n  .day-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 22px; align-items: start; }\n  .day-list .day-block { margin-bottom: 0 !important; }\n  .day-list .day-block + .day-block { margin-top: 0; }\n  .tile-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }\n  .week-card { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; }\n  .week-card > .week-head { grid-column: 1 / -1; }\n  .week-card > .wday:nth-child(even) { border-right: 1px solid var(--border); }\n  .week-card .wday-items { flex-direction: row; flex-wrap: wrap; align-content: flex-start; }\n  .week-card .wday-items .chip-item { flex: 0 1 auto; max-width: 100%; }\n}\n\n.app-main {\n  flex: 1 1 auto;\n  overflow-y: auto;\n  overflow-x: hidden;\n  overscroll-behavior: contain;\n  -webkit-overflow-scrolling: touch;\n  padding: 0 16px calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px));\n  scroll-behavior: smooth;\n}\n.app-main::-webkit-scrollbar { width: 8px; }\n.app-main::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }\n.app-main::-webkit-scrollbar-track { background: transparent; }\n\n.page { animation: pageIn 0.34s cubic-bezier(0.22, 0.9, 0.3, 1); }\n@keyframes pageIn {\n  from { opacity: 0; transform: translateY(10px); }\n  to { opacity: 1; transform: none; }\n}\n\n.page-head { padding: 22px 2px 14px; }\n/* на вузьких екранах кругла аватарка профілю (48px, top:14 right:14) сидить у тому ж куті,\n   тому рядок із кнопкою праворуч резервує під неї місце */\n@media (max-width: 1069px) {\n  .page-head .row-between { padding-right: 56px; }\n}\n.page-kicker {\n  font-size: 12.5px;\n  font-weight: 700;\n  letter-spacing: 0.09em;\n  text-transform: uppercase;\n  color: var(--accent);\n  margin-bottom: 4px;\n}\n.page-title {\n  font-size: 33px;\n  line-height: 1.1;\n  font-weight: 800;\n  letter-spacing: -0.025em;\n  margin: 0;\n}\n.page-sub { color: var(--dim); font-size: 14px; margin-top: 6px; }\n\n.kri-pop {\n  color: var(--accent);\n  font-weight: 900;\n  letter-spacing: 0.015em;\n  display: inline-block;\n  animation: kriPop 0.55s cubic-bezier(0.2, 0.9, 0.3, 1.35) both;\n}\n@keyframes kriPop {\n  from { opacity: 0; transform: translateY(-4px) scale(0.76); }\n  to { opacity: 1; transform: none; }\n}\n\nhtml body .floating-avatar {\n  position: absolute;\n  top: 14px;\n  right: 14px;\n  z-index: 34;\n  width: 48px;\n  height: 48px;\n  padding: 2px;\n  border-radius: 50%;\n  display: grid;\n  place-items: center;\n  background: var(--grad);\n  box-shadow: var(--shadow-md);\n  border: none;\n  transition: transform 0.16s ease;\n}\n.floating-avatar:active { transform: scale(0.93); }\nhtml body .floating-avatar .av-inner {\n  position: relative;\n  width: 100%;\n  height: 100%;\n  border-radius: 50%;\n  display: grid;\n  place-items: center;\n  overflow: hidden;\n  background: var(--surface);\n  color: var(--accent);\n  font-weight: 800;\n  font-size: 16.5px;\n  letter-spacing: -0.01em;\n}\nhtml body .floating-avatar .av-inner > img {\n  position: absolute;\n  inset: 0;\n  width: 100%;\n  height: 100%;\n  border-radius: 50%;\n  object-fit: cover;\n  display: block;\n}\n\n/* ============================================================\n   Нижня навігація\n   ============================================================ */\n\n.tabbar {\n  position: absolute;\n  left: 0;\n  right: 0;\n  bottom: 0;\n  z-index: 40;\n  display: flex;\n  align-items: flex-end;\n  gap: 8px;\n  padding: 10px 12px calc(12px + env(safe-area-inset-bottom, 0px));\n  background: linear-gradient(to top, var(--bg) 62%, color-mix(in srgb, var(--bg) 0%, transparent));\n  pointer-events: none;\n}\nhtml[data-mode=\"dark\"] .tabbar { background: linear-gradient(to top, var(--bg) 66%, transparent); }\n.tabbar > * { pointer-events: auto; }\n\n.tabbar-pill {\n  flex: 1 1 auto;\n  display: flex;\n  align-items: stretch;\n  gap: 2px;\n  padding: 6px;\n  border-radius: 26px;\n  background: color-mix(in srgb, var(--surface) 88%, transparent);\n  backdrop-filter: blur(18px) saturate(1.4);\n  -webkit-backdrop-filter: blur(18px) saturate(1.4);\n  box-shadow: var(--shadow-lg);\n  border: 1px solid var(--border);\n}\n\nhtml body .tab-btn {\n  position: relative;\n  flex: 1 1 0;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  justify-content: center;\n  gap: 3px;\n  padding: 7px 1px 5px;\n  border-radius: 20px;\n  color: var(--dim);\n  transition: color 0.2s ease, background 0.25s ease, transform 0.16s ease;\n  overflow: hidden;\n}\n.tab-btn .ico { width: 23px; height: 23px; transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1); }\n.tab-btn-label { font-size: 10.5px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }\n.tab-btn-label.is-tight { font-size: 9.4px; letter-spacing: -0.03em; }\n.tab-btn-label.is-mid { font-size: 10.2px; letter-spacing: -0.02em; }\n.tab-btn:active { transform: scale(0.95); }\n.tab-btn.is-active { color: var(--accent); background: var(--accent-soft); }\n.tab-btn.is-active .ico { transform: translateY(-1px) scale(1.08); }\n.tab-btn.is-active .tab-btn-label { font-weight: 800; }\n.tab-btn.is-active::before {\n  content: \"\";\n  position: absolute;\n  top: 3px;\n  width: 20px;\n  height: 3px;\n  border-radius: 3px;\n  background: var(--grad);\n}\n\n.app-switch {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 3px;\n  padding-bottom: 2px;\n}\n.app-switch-circle {\n  position: relative;\n  width: 52px;\n  height: 52px;\n  border-radius: 50%;\n  display: grid;\n  place-items: center;\n  background: var(--surface);\n  color: var(--accent);\n  box-shadow: var(--shadow-lg);\n  border: 1px solid var(--border);\n  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);\n}\n.app-switch-circle:active { transform: scale(0.92); }\n.app-switch-circle .ico { width: 25px; height: 25px; }\n.app-switch-badge {\n  position: absolute;\n  top: -2px;\n  right: -2px;\n  width: 20px;\n  height: 20px;\n  border-radius: 50%;\n  background: var(--grad);\n  color: #fff;\n  display: grid;\n  place-items: center;\n  box-shadow: var(--shadow-sm);\n}\n.app-switch-badge .ico, .app-switch-badge > svg { width: 12px; height: 12px; stroke-width: 3; }\n.app-switch-label { font-size: 10px; font-weight: 700; color: var(--dim); white-space: nowrap; }\n\n/* ============================================================\n   Кнопки\n   ============================================================ */\n\n.btn {\n  position: relative;\n  overflow: hidden;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  padding: 13px 20px;\n  border-radius: 16px;\n  font-weight: 700;\n  font-size: 15px;\n  line-height: 1;\n  letter-spacing: -0.01em;\n  transition: transform 0.14s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 0.2s;\n  white-space: nowrap;\n}\n.btn:active { transform: scale(0.97); }\n.btn .ico { width: 19px; height: 19px; }\n.btn-label { display: inline-block; }\n.btn-block { width: 100%; }\n.btn-justify { justify-content: space-between; }\n.btn-sm { padding: 9px 14px; font-size: 13.5px; border-radius: 13px; }\n.btn-sm .ico { width: 16px; height: 16px; }\n.btn-lg { padding: 16px 24px; font-size: 16px; border-radius: 18px; }\n\nhtml body .btn-primary { background: var(--grad); color: #fff; box-shadow: 0 8px 22px -6px var(--accent-glow); }\nhtml body .btn-primary:disabled { opacity: 0.5; box-shadow: none; }\nhtml body .btn-soft { background: var(--accent-soft); color: var(--accent); }\nhtml body .btn-ghost { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }\nhtml body .btn-outline { background: transparent; color: var(--accent); border: 1.5px solid var(--accent-ring); }\nhtml body .btn-danger { background: linear-gradient(135deg, #dc2626, #f87171); color: #fff; box-shadow: 0 8px 22px -8px rgba(220, 38, 38, 0.55); }\nhtml body .btn-danger-ghost { background: rgba(220, 38, 38, 0.09); color: #e11d48; }\n.btn-icon { padding: 10px; border-radius: 14px; }\n\nhtml body .icon-btn {\n  display: grid;\n  place-items: center;\n  width: 40px;\n  height: 40px;\n  border-radius: 13px;\n  color: var(--dim);\n  background: var(--surface-2);\n  border: 1px solid var(--border);\n  transition: transform 0.15s ease, color 0.2s;\n}\n.icon-btn:active { transform: scale(0.92); }\n.icon-btn .ico, .icon-btn > svg { width: 19px; height: 19px; }\n.icon-btn.plain { background: transparent; border-color: transparent; }\n\n.ripple { position: relative; overflow: hidden; }\n.ripple-wave {\n  position: absolute;\n  border-radius: 50%;\n  background: rgba(255, 255, 255, 0.45);\n  transform: scale(0);\n  animation: rippleOut 0.6s ease-out;\n  pointer-events: none;\n}\n.btn-soft .ripple-wave, .btn-ghost .ripple-wave, .btn-outline .ripple-wave { background: var(--accent-ring); }\n@keyframes rippleOut { to { transform: scale(1); opacity: 0; } }\n\n/* ============================================================\n   Картки / блоки\n   ============================================================ */\n\n.card {\n  background: var(--surface);\n  border: 1px solid var(--border);\n  border-radius: var(--radius);\n  box-shadow: var(--shadow-sm);\n  padding: 16px;\n}\n.card + .card { margin-top: 12px; }\n\ : \"#db2777\", c3: \"#f9a8d4\", accent: \"#db2777\", ink: \"#ffffff\", soft: \"rgba(219,39,119,0.10)\", ring: \"rgba(219,39,119,0.28)\", glow: \"rgba(219,39,119,0.32)\" },\n    dark: { c1: \"#841744\", c2: \"#ab1f57\", c3: \"#c43573\", accent: \"#f472b6\", ink: \"#ffffff\", soft: \"rgba(244,114,182,0.15)\", ring: \"rgba(244,114,182,0.34)\", glow: \"rgba(244,114,182,0.30)\" },\n  },\n];\n\nexport function getPalette(id) {\n  return PALETTES.find((p) => p.id === id) || PALETTES[0];\n}\n\nexport function applyTheme(themeId, mode) {\n  const palette = getPalette(themeId);\n  const c = palette[mode === \"dark\" ? \"dark\" : \"light\"];\n  const root = document.documentElement;\n  root.setAttribute(\"data-mode\", mode === \"dark\" ? \"dark\" : \"light\");\n  root.setAttribute(\"data-theme\", palette.id);\n  root.style.setProperty(\"--c1\", c.c1);\n  root.style.setProperty(\"--c2\", c.c2);\n  root.style.setProperty(\"--c3\", c.c3);\n  root.style.setProperty(\"--accent\", c.accent);\n  root.style.setProperty(\"--accent-ink\", c.ink);\n  root.style.setProperty(\"--accent-soft\", c.soft);\n  root.style.setProperty(\"--accent-ring\", c.ring);\n  root.style.setProperty(\"--accent-glow\", c.glow);\n  root.style.setProperty(\"--grad\", `linear-gradient(135deg, ${c.c1}, ${c.c2} 52%, ${c.c3})`);\n  const meta = document.querySelector('meta[name=\"theme-color\"]');\n  if (meta) meta.setAttribute(\"content\", mode === \"dark\" ? \"#070d0c\" : c.c2);\n}\n"},{"path":"src/ui.js","text":"import { iconEl, iconMarkup } from \"./icons.js\";\n\nexport function h(tag, props, ...children) {\n  const el = document.createElement(tag);\n  if (props) {\n    for (const key of Object.keys(props)) {\n      const val = props[key];\n      if (val == null || val === false) continue;\n      if (key === \"class\") el.className = val;\n      else if (key === \"style\") {\n        if (typeof val === \"string\") el.style.cssText = val;\n        else Object.assign(el.style, val);\n      } else if (key === \"dataset\") Object.assign(el.dataset, val);\n      else if (key === \"html\") el.innerHTML = val;\n      else if (key === \"ref\" && typeof val === \"function\") val(el);\n      else if (key.startsWith(\"on\") && typeof val === \"function\") el.addEventListener(key.slice(2).toLowerCase(), val);\n      else if (key === \"value\" || key === \"checked\" || key === \"disabled\" || key === \"hidden\") el[key] = val;\n      else if (key === \"type\" || key === \"min\" || key === \"max\" || key === \"step\" || key === \"placeholder\" || key === \"name\" || key === \"id\" || key === \"title\") el[key] = val;\n      else el.setAttribute(key, val);\n    }\n  }\n  append(el, children);\n  return el;\n}\n\nexport function append(el, children) {\n  if (children == null || children === false || children === true) return el;\n  if (typeof children === \"string\" || children instanceof Node || typeof children[Symbol.iterator] !== \"function\") children = [children];\n  for (const child of children) {\n    if (child == null || child === false || child === true) continue;\n    if (Array.isArray(child)) append(el, child);\n    else if (child instanceof Node) el.appendChild(child);\n    else el.appendChild(document.createTextNode(String(child)));\n  }\n  return el;\n}\n\nexport function frag(...children) {\n  const f = document.createDocumentFragment();\n  append(f, children);\n  return f;\n}\n\nexport function clear(el) {\n  while (el.firstChild) el.removeChild(el.firstChild);\n  return el;\n}\n\nexport function $id(id) {\n  return document.getElementById(id);\n}\n\nexport function icon(name, cls = \"ico\") {\n  return iconEl(name, cls);\n}\n\nexport function attachIcons(root) {\n  root.querySelectorAll(\"[data-ico]\").forEach((el) => {\n    if (el.dataset.icoDone) return;\n    el.dataset.icoDone = \"1\";\n    el.innerHTML = iconMarkup(el.dataset.ico);\n  });\n}\n\n/* ---------- toasts ---------- */\n\nlet toastLayer = null;\n\nexport function toast(message, opts = {}) {\n  if (!toastLayer) toastLayer = $id(\"toastLayer\");\n  const { icon: ico = \"check\", duration = 3600, tone = \"accent\", actionLabel, onAction } = opts;\n  const el = h(\"div\", { class: `toast toast-${tone}` },\n    tone === \"accent\" && ico ? h(\"span\", { class: \"toast-ico\", html: iconMarkup(ico) }) : null,\n    h(\"span\", { class: \"toast-text\" }, message),\n    actionLabel ? h(\"button\", { class: \"toast-action\", onclick: () => { onAction && onAction(); dismiss(); } }, actionLabel) : null,\n  );\n  toastLayer.appendChild(el);\n  let killed = false;\n  function dismiss() {\n    if (killed) return;\n    killed = true;\n    clearTimeout(timer);\n    el.classList.add(\"toast-out\");\n    setTimeout(() => el.remove(), 320);\n  }\n  const timer = setTimeout(dismiss, duration);\n  el.addEventListener(\"pointerdown\", (e) => {\n    if (e.target.closest(\".toast-action\")) return;\n    const pressedAt = Date.now();\n    const onUp = () => {\n      window.removeEventListener(\"pointerup\", onUp);\n      if (Date.now() - pressedAt \u003c 450) dismiss();\n    };\n    window.addEventListener(\"pointerup\", onUp, { passive: true });\n  });\n  requestAnimationFrame(() => el.classList.add(\"toast-in\"));\n  return dismiss;\n}\n\n/* ---------- sheets / modals ---------- */\n\nlet modalLayer = null;\nconst activeSheets = [];\n\nexport function openSheet(opts = {}) {\n  if (!modalLayer) modalLayer = $id(\"modalLayer\");\n  const { title, subtitle, icon: ico, size = \"md\", closable = true, onClose, tone } = opts;\n  let closed = false;\n  const body = h(\"div\", { class: \"sheet-body\" });\n  const footer = h(\"div\", { class: \"sheet-footer\" });\n  const headerEl = h(\"div\", { class: \"sheet-head\" },\n    ico ? h(\"div\", { class: \"sheet-head-ico\", html: iconMarkup(ico) }) : null,\n    h(\"div\", { class: \"sheet-head-text\" },\n      title ? h(\"div\", { class: \"sheet-title\" }, title) : null,\n      subtitle ? h(\"div\", { class: \"sheet-sub\" }, subtitle) : null,\n    ),\n    closable ? h(\"button\", { class: \"icon-btn sheet-close\", \"aria-label\": \"Закрити\", html: iconMarkup(\"close\"), onclick: () => ctrl.close() }) : null,\n  );\n  const sheet = h(\"div\", { class: `sheet sheet-${size}${tone ? \" sheet-tone-\" + tone : \"\"}` },\n    h(\"div\", { class: \"sheet-grip\" }),\n    (title || subtitle || ico) ? headerEl : null,\n    body,\n    footer,\n  );\n  const backdrop = h(\"div\", { class: \"sheet-backdrop\" });\n  const wrap = h(\"div\", { class: \"sheet-wrap\" }, backdrop, sheet);\n\n  const ctrl = {\n    body,\n    footer,\n    sheet,\n    wrap,\n    close() {\n      if (closed) return;\n      closed = true;\n      const i = activeSheets.indexOf(ctrl);\n      if (i >= 0) activeSheets.splice(i, 1);\n      wrap.classList.add(\"sheet-closing\");\n      setTimeout(() => { wrap.remove(); onClose && onClose(); }, 260);\n      document.documentElement.classList.toggle(\"has-sheet\", activeSheets.length > 0);\n    },\n    setTitle(t, s) {\n      const titleNode = headerEl.querySelector(\".sheet-title\");\n      if (titleNode) titleNode.textContent = t;\n      const subNode = headerEl.querySelector(\".sheet-sub\");\n      if (subNode && s != null) subNode.textContent = s;\n    },\n  };\n  if (closable) backdrop.addEventListener(\"click\", () => ctrl.close());\n  modalLayer.appendChild(wrap);\n  activeSheets.push(ctrl);\n  document.documentElement.classList.add(\"has-sheet\");\n  requestAnimationFrame(() => wrap.classList.add(\"sheet-open\"));\n  return ctrl;\n}\n\nexport function confirmDialog(opts = {}) {\n  const { title = \"Ви впевнені?\", message = \"\", confirmText = \"Так\", cancelText = \"Скасувати\", danger = false } = opts;\n  return new Promise((resolve) => {\n    let done = false;\n    const sheet = openSheet({ title, subtitle: message, icon: danger ? \"trash\" : \"info\", onClose: () => { if (!done) { done = true; resolve(false); } } });\n    const yes = h(\"button\", { class: `btn ${danger ? \"btn-danger\" : \"btn-primary\"} btn-block` }, confirmText);\n    yes.addEventListener(\"click\", () => { done = true; sheet.close(); resolve(true); });\n    const no = h(\"button\", { class: \"btn btn-ghost btn-block\" }, cancelText);\n    no.addEventListener(\"click\", () => { done = true; sheet.close(); resolve(false); });\n    append(sheet.footer, [yes, no]);\n  });\n}\n\n/* ---------- form controls ---------- */\n\nexport function field(label, control, hint) {\n  return h(\"label\", { class: \"field\" },\n    label ? h(\"span\", { class: \"field-label\" }, label) : null,\n    control,\n    hint ? h(\"span\", { class: \"field-hint\" }, hint) : null,\n  );\n}\n\nexport function textInput(opts = {}) {\n  return h(\"input\", Object.assign({ class: \"input\", type: \"text\", autocomplete: \"off\" }, opts));\n}\n\nexport function textarea(opts = {}) {\n  const el = h(\"textarea\", Object.assign({ class: \"input textarea\", rows: 3 }, opts));\n  autoGrow(el);\n  return el;\n}\n\nexport function autoGrow(el) {\n  const fit = () => { el.style.height = \"auto\"; el.style.height = Math.min(260, el.scrollHeight + 2) + \"px\"; };\n  el.addEventListener(\"input\", fit);\n  requestAnimationFrame(fit);\n}\n\nexport function selectInput(options, value, opts = {}) {\n  const el = h(\"select\", Object.assign({ class: \"input select\" }, opts));\n  for (const opt of options) {\n    el.appendChild(h(\"option\", { value: opt.value, selected: String(opt.value) === String(value) }, opt.label));\n  }\n  return el;\n}\n\nexport function toggleRow(label, checked, onChange, hint) {\n  const input = h(\"input\", { type: \"checkbox\", class: \"switch-input\", checked: !!checked, onchange: () => onChange(input.checked) });\n  return h(\"label\", { class: \"switch-row\" },\n    h(\"span\", { class: \"switch-text\" },\n      h(\"span\", { class: \"switch-label\" }, label),\n      hint ? h(\"span\", { class: \"switch-hint\" }, hint) : null,\n    ),\n    h(\"span\", { class: \"switch\" }, input, h(\"span\", { class: \"switch-knob\" })),\n  );\n}\n\nexport function segmented(options, value, onChange, opts = {}) {\n  const el = h(\"div\", { class: `segmented${opts.fill ? \" segmented-fill\" : \"\"}` });\n  for (const opt of options) {\n    const active = String(opt.value) === String(value);\n    const btn = h(\"button\", { class: `seg-btn${active ? \" is-active\" : \"\"}`, type: \"button\" },\n      opt.icon ? h(\"span\", { class: \"seg-ico\", html: iconMarkup(opt.icon) }) : null,\n      h(\"span\", {}, opt.label),\n    );\n    btn.addEventListener(\"click\", () => {\n      el.querySelectorAll(\".seg-btn\").forEach((b) => b.classList.remove(\"is-active\"));\n      btn.classList.add(\"is-active\");\n      onChange(opt.value);\n    });\n    el.appendChild(btn);\n  }\n  return el;\n}\n\nexport function btn(label, opts = {}) {\n  const { icon: ico, variant = \"primary\", size = \"md\", block, onClick, type = \"button\", disabled, justify } = opts;\n  const el = h(\"button\", { class: `btn btn-${variant} btn-${size}${block ? \" btn-block\" : \"\"}${justify ? \" btn-justify\" : \"\"}`, type, disabled },\n    ico ? h(\"span\", { class: \"btn-ico\", html: iconMarkup(ico) }) : null,\n    h(\"span\", { class: \"btn-label\" }, label),\n  );\n  if (onClick) el.addEventListener(\"click\", onClick);\n  return el;\n}\n\n/* ---------- animation helpers ---------- */\n\nconst SCRAMBLE_CHARS = \"ABCDEFGHIJKLMNOPQRSTUVWXYZ#$%&@*\u003c>/\\\\|~\";\n\nexport function scrambleText(el, finalText, opts = {}) {\n  const { duration = 900, latin = true } = opts;\n  const start = performance.now();\n  const chars = finalText.split(\"\");\n  const latinOnly = \"KRI\";\n  function frame(now) {\n    const t = Math.min(1, (now - start) / duration);\n    const eased = 1 - Math.pow(1 - t, 2.2);\n    const settled = Math.floor(eased * chars.length);\n    let out = \"\";\n    for (let i = 0; i \u003c chars.length; i++) {\n      const ch = chars[i];\n      if (ch === \" \") { out += ch; continue; }\n      if (i \u003c settled) out += ch;\n      else if (latin && i \u003c settled + 3) out += latinOnly[i % latinOnly.length];\n      else out += SCRAMBLE_CHARS[Math.floor(Math.random() * SCRAMBLE_CHARS.length)];\n    }\n    el.textContent = out;\n    if (t \u003c 1) requestAnimationFrame(frame);\n    else el.textContent = finalText;\n  }\n  requestAnimationFrame(frame);\n}\n\nexport function kriTitle(el, word, opts = {}) {\n  const { extra = [\"R\", \"I\"], steps = [[1, 300], [2, 620], [1, 300], [0, 0]] } = opts;\n  const head = word.charAt(0);\n  const tail = word.slice(1);\n\n  function paint(n) {\n    if (!el.isConnected) return;\n    clear(el);\n    if (n \u003c= 0) {\n      el.appendChild(document.createTextNode(word));\n      return;\n    }\n    el.appendChild(h(\"span\", { class: \"kri-pop\" }, head + extra.slice(0, n).join(\"\")));\n    el.appendChild(document.createTextNode(tail));\n  }\n\n  paint(0);\n  let i = 0;\n  function step() {\n    if (!el.isConnected || i >= steps.length) return;\n    const [n, wait] = steps[i++];\n    paint(n);\n    setTimeout(step, wait);\n  }\n  setTimeout(step, 320);\n}\n\nexport function countUp(el, target, duration = 700) {\n  const from = 0;\n  const start = performance.now();\n  function frame(now) {\n    const t = Math.min(1, (now - start) / duration);\n    const eased = 1 - Math.pow(1 - t, 3);\n    el.textContent = Math.round(from + (target - from) * eased);\n    if (t \u003c 1) requestAnimationFrame(frame);\n  }\n  requestAnimationFrame(frame);\n}\n\nexport function burstConfetti(container, count = 26) {\n  const rect = container.getBoundingClientRect();\n  for (let i = 0; i \u003c count; i++) {\n    const piece = h(\"span\", { class: \"confetti-piece\" });\n    piece.style.left = (rect.width / 2 + (Math.random() - 0.5) * rect.width * 0.7) + \"px\";\n    piece.style.top = (rect.height * 0.35) + \"px\";\n    piece.style.setProperty(\"--dx\", (Math.random() - 0.5) * 260 + \"px\");\n    piece.style.setProperty(\"--dy\", (Math.random() * -260 - 60) + \"px\");\n    piece.style.setProperty(\"--rot\", (Math.random() * 720 - 360) + \"deg\");\n    piece.style.animationDelay = (Math.random() * 180) + \"ms\";\n    piece.style.background = [\"var(--c1)\", \"var(--c2)\", \"var(--c3)\"][i % 3];\n    container.appendChild(piece);\n    setTimeout(() => piece.remove(), 1600);\n  }\n}\n\nexport function rippleOn(node) {\n  node.addEventListener(\"pointerdown\", (e) => {\n    if (!node.classList.contains(\"ripple\")) return;\n    const rect = node.getBoundingClientRect();\n    const size = Math.max(rect.width, rect.height) * 1.6;\n    const r = h(\"span\", { class: \"ripple-wave\" });\n    r.style.width = r.style.height = size + \"px\";\n    r.style.left = (e.clientX - rect.left - size / 2) + \"px\";\n    r.style.top = (e.clientY - rect.top - size / 2) + \"px\";\n    node.appendChild(r);\n    setTimeout(() => r.remove(), 620);\n  });\n}\n\nexport function empty(el) {\n  el.classList.add(\"is-empty\");\n  return el;\n}\n\nexport function iconBadge(name, cls = \"badge-ico\") {\n  return h(\"span\", { class: cls, html: iconMarkup(name) });\n}\n"},{"path":"src/util.js","text":"export const MONTHS_GEN = [\n  \"січня\", \"лютого\", \"березня\", \"квітня\", \"травня\", \"червня\",\n  \"липня\", \"серпня\", \"вересня\", \"жовтня\", \"листопада\", \"грудня\",\n];\nexport const MONTHS_NOM = [\n  \"Січень\", \"Лютий\", \"Березень\", \"Квітень\", \"Травень\", \"Червень\",\n  \"Липень\", \"Серпень\", \"Вересень\", \"Жовтень\", \"Листопад\", \"Грудень\",\n];\nexport const WEEKDAYS_SHORT = [\"Пн\", \"Вт\", \"Ср\", \"Чт\", \"Пт\", \"Сб\", \"Нд\"];\nexport const WEEKDAYS_LONG = [\"Понеділок\", \"Вівторок\", \"Середа\", \"Четвер\", \"П'ятниця\", \"Субота\", \"Неділя\"];\nexport const MONTHS_SHORT = [\"січ\", \"лют\", \"бер\", \"кві\", \"тра\", \"чер\", \"лип\", \"сер\", \"вер\", \"жов\", \"лис\", \"гру\"];\n\nexport const pad = (n) => String(n).padStart(2, \"0\");\n\nexport function dateToStr(d) {\n  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;\n}\n\nexport function strToDate(s) {\n  const [y, m, d] = String(s).split(\"-\").map(Number);\n  return new Date(y, (m || 1) - 1, d || 1, 12, 0, 0, 0);\n}\n\nexport function todayStr() {\n  return dateToStr(new Date());\n}\n\nexport function addDaysStr(s, n) {\n  const d = strToDate(s);\n  d.setDate(d.getDate() + n);\n  return dateToStr(d);\n}\n\nexport function weekdayIdx(date) {\n  const d = typeof date === \"string\" ? strToDate(date) : date;\n  return (d.getDay() + 6) % 7;\n}\n\nexport function toISODow(date) {\n  return weekdayIdx(date) + 1;\n}\n\nexport function startOfWeekStr(s) {\n  const idx = weekdayIdx(s);\n  return addDaysStr(s, -idx);\n}\n\nexport function diffDays(a, b) {\n  return Math.round((strToDate(b) - strToDate(a)) / 86400000);\n}\n\nexport function uid() {\n  return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);\n}\n\nexport function minOf(t) {\n  if (!t || typeof t !== \"string\") return null;\n  const m = t.match(/^(\\d{1,2}):(\\d{2})/);\n  if (!m) return null;\n  return Number(m[1]) * 60 + Number(m[2]);\n}\n\nexport function nowMinutes() {\n  const d = new Date();\n  return d.getHours() * 60 + d.getMinutes();\n}\n\nexport function minutesToTime(m) {\n  const mm = Math.max(0, Math.min(24 * 60, Math.round(m)));\n  return `${pad(Math.floor(mm / 60))}:${pad(mm % 60)}`;\n}\n\nexport function fmtDateLong(s) {\n  const d = strToDate(s);\n  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]} ${d.getFullYear()}`;\n}\n\nexport function fmtDateMedium(s) {\n  const d = strToDate(s);\n  return `${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;\n}\n\nexport function fmtDateShort(s) {\n  const d = strToDate(s);\n  return `${d.getDate()} ${MONTHS_SHORT[d.getMonth()]}`;\n}\n\nexport function fmtWeekRange(startStr) {\n  const a = strToDate(startStr);\n  const b = strToDate(addDaysStr(startStr, 6));\n  if (a.getMonth() === b.getMonth()) {\n    return `${a.getDate()}–${b.getDate()} ${MONTHS_GEN[a.getMonth()]}`;\n  }\n  if (a.getFullYear() === b.getFullYear()) {\n    return `${a.getDate()} ${MONTHS_GEN[a.getMonth()]} – ${b.getDate()} ${MONTHS_GEN[b.getMonth()]}`;\n  }\n  return `${fmtDateShort(startStr)} ${a.getFullYear()} – ${fmtDateShort(addDaysStr(startStr, 6))} ${b.getFullYear()}`;\n}\n\nexport function fmtDayHeader(s) {\n  const d = strToDate(s);\n  return `${WEEKDAYS_LONG[weekdayIdx(s)]}, ${d.getDate()} ${MONTHS_GEN[d.getMonth()]}`;\n}\n\nexport function relativeDayLabel(s) {\n  const delta = diffDays(todayStr(), s);\n  if (delta === 0) return \"Сьогодні\";\n  if (delta === 1) return \"Завтра\";\n  if (delta === 2) return \"Післязавтра\";\n  if (delta === -1) return \"Вчора\";\n  return null;\n}\n\nexport function relDayWord(delta) {\n  if (delta === 0) return \"сьогодні\";\n  if (delta === 1) return \"завтра\";\n  if (delta === 2) return \"післязавтра\";\n  return `через ${delta} дн.`;\n}\n\nexport function plural(n, one, few, many) {\n  const abs = Math.abs(n) % 100;\n  const last = abs % 10;\n  if (abs > 10 && abs \u003c 20) return many;\n  if (last > 1 && last \u003c 5) return few;\n  if (last === 1) return one;\n  return many;\n}\n\nexport function weekdayShortOf(s) {\n  return WEEKDAYS_SHORT[weekdayIdx(s)];\n}\n\nexport function clamp(n, a, b) {\n  return Math.max(a, Math.min(b, n));\n}\n\nexport function roomLabel(room) {\n  const r = String(room == null ? \"\" : room).trim();\n  if (!r) return \"\";\n  return /^\\d/.test(r) ? `каб. ${r}` : r;\n}\n\nexport function escapeHtml(str) {\n  return String(str == null ? \"\" : str)\n    .replace(/&/g, \"&amp;\")\n    .replace(/\u003c/g, \"&lt;\")\n    .replace(/>/g, \"&gt;\")\n    .replace(/\"/g, \"&quot;\")\n    .replace(/'/g, \"&#39;\");\n}\n\nexport function normalizeUrl(url) {\n  if (!url) return \"\";\n  const t = String(url).trim();\n  if (!t) return \"\";\n  if (/^[a-z][a-z0-9+.-]*:/i.test(t)) return t;\n  return \"https://\" + t;\n}\n\nexport function prettyUrl(url) {\n  return String(url || \"\").replace(/^https?:\\/\\//, \"\").replace(/\\/$/, \"\");\n}\n\nexport function debounce(fn, ms) {\n  let t = null;\n  return (...args) => {\n    clearTimeout(t);\n    t = setTimeout(() => fn(...args), ms);\n  };\n}\n\nexport function occurrencesOfRepeatPattern(ev, dateStr) {\n  const d = strToDate(dateStr);\n  if (!ev || !ev.date) return false;\n  const start = ev.date;\n  if (dateStr \u003c start) return false;\n  const until = ev.until || null;\n  if (until && dateStr > until) return false;\n\n  const kind = ev.kind || \"once\";\n  if (kind === \"once\") return dateStr === start;\n\n  const sd = strToDate(start);\n  if (kind === \"yearly\") {\n    return d.getMonth() === sd.getMonth() && d.getDate() === sd.getDate();\n  }\n  if (kind === \"daily\") {\n    const iv = Math.max(1, Number(ev.interval || 1));\n    return diffDays(start, dateStr) % iv === 0;\n  }\n  if (kind === \"weekly\") {\n    const iv = Math.max(1, Number(ev.interval || 1));\n    const days = ev.days && ev.days.length ? ev.days : [toISODow(sd)];\n    if (!days.includes(toISODow(d))) return false;\n    const weeks = Math.floor(diffDays(startOfWeekStr(start), startOfWeekStr(dateStr)) / 7);\n    return weeks % iv === 0;\n  }\n  if (kind === \"monthly\") {\n    const iv = Math.max(1, Number(ev.interval || 1));\n    const months = (d.getFullYear() - sd.getFullYear()) * 12 + (d.getMonth() - sd.getMonth());\n    if (months % iv !== 0) return false;\n    const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();\n    const want = Math.min(sd.getDate(), lastDay);\n    return d.getDate() === want;\n  }\n  if (kind === \"everyN\") {\n    const iv = Math.max(1, Number(ev.interval || 1));\n    const unit = ev.unit || \"day\";\n    if (unit === \"day\") return diffDays(start, dateStr) % iv === 0;\n    if (unit === \"week\") {\n      const weeks = Math.floor(diffDays(startOfWeekStr(start), startOfWeekStr(dateStr)) / 7);\n      return weeks % iv === 0 && toISODow(d) === toISODow(sd);\n    }\n    if (unit === \"month\") {\n      const months = (d.getFullYear() - sd.getFullYear()) * 12 + (d.getMonth() - sd.getMonth());\n      const lastDay = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();\n      const want = Math.min(sd.getDate(), lastDay);\n      return months % iv === 0 && d.getDate() === want;\n    }\n  }\n  return false;\n}\n\n/* ---------- подорожі ---------- */\n\nexport function tripCovers(trip, dateStr) {\n  if (!trip || !trip.from || !trip.to) return false;\n  return dateStr >= trip.from && dateStr \u003c= trip.to;\n}\n\nexport function tripDuration(trip) {\n  return Math.max(1, diffDays(trip.from, trip.to) + 1);\n}\n\nexport function tripDayIndex(trip, dateStr) {\n  return diffDays(trip.from, dateStr) + 1;\n}\n\nexport function tripRangeLabel(trip) {\n  if (!trip || !trip.from || !trip.to) return \"\";\n  if (trip.from === trip.to) return fmtDateMedium(trip.from);\n  return `${fmtDateMedium(trip.from)} — ${fmtDateMedium(trip.to)}`;\n}\n\nexport function tripReminder(trip, dateStr) {\n  if (!trip || !trip.from || !trip.to) return null;\n  const from = trip.from;\n  const to = trip.to;\n  const first = addDaysStr(from, -1);\n  if (dateStr \u003c first || dateStr > to) return null;\n\n  if (dateStr === from) {\n    const oneDay = from === to;\n    return {\n      kind: \"start\",\n      title: oneDay ? \"Сьогодні подорож\" : \"Сьогодні у вас подорож\",\n      note: oneDay ? \"\" : `Повернення ${fmtDateMedium(to)}`,\n    };\n  }\n  if (dateStr === to) {\n    return {\n      kind: \"end\",\n      title: \"Сьогодні повернення\",\n      note: from === to ? \"\" : `${fmtDateMedium(from)} — ${fmtDateMedium(to)}`,\n    };\n  }\n  if (dateStr === first) {\n    return {\n      kind: \"before\",\n      title: \"Завтра подорож\",\n      note: `Виїзд ${fmtDateMedium(from)}`,\n    };\n  }\n  if (dateStr > from && dateStr \u003c to) {\n    const tomorrowIsEnd = dateStr === addDaysStr(to, -1);\n    return {\n      kind: \"during\",\n      title: \"Подорож триває\",\n      note: tomorrowIsEnd ? \"Завтра повернення\" : `Повернення ${fmtDateMedium(to)}`,\n    };\n  }\n  return null;\n}\n\nexport function repeatLabel(ev) {\n  const kind = ev.kind || \"once\";\n  if (kind === \"once\") return \"Одноразова\";\n  if (kind === \"yearly\") return \"Щороку\";\n  if (kind === \"daily\") return Number(ev.interval || 1) === 1 ? \"Щодня\" : `Кожні ${ev.interval} дн.`;\n  if (kind === \"weekly\") {\n    const iv = Number(ev.interval || 1);\n    const names = (ev.days || []).map((i) => WEEKDAYS_SHORT[i - 1]).join(\", \");\n    const base = iv === 1 ? \"Щотижня\" : `Кожні ${iv} тиж.`;\n    return names ? `${base} · ${names}` : base;\n  }\n  if (kind === \"monthly\") {\n    const iv = Number(ev.interval || 1);\n    return iv === 1 ? \"Щомісяця\" : `Кожні ${iv} міс.`;\n  }\n  if (kind === \"everyN\") {\n    const iv = Number(ev.interval || 1);\n    const u = ev.unit === \"week\" ? \"тиж.\" : ev.unit === \"month\" ? \"міс.\" : \"дн.\";\n    return `Кожні ${iv} ${u}`;\n  }\n  return \"\";\n}\n"}]</script>
<script>
const files = JSON.parse(document.getElementById("filesData").textContent);
const tree = document.getElementById("tree"), code = document.getElementById("code"), cur = document.getElementById("cur");
let active = 0;
function show(i){
  active = i; cur.textContent = files[i].path; code.textContent = files[i].text;
  [...tree.children].forEach((b,j)=>b.classList.toggle("on", j===i));
}
files.forEach((f,i)=>{ const b=document.createElement("button"); b.textContent=f.path; b.onclick=()=>show(i); tree.appendChild(b); });
function dl(name, text){
  const b = new Blob([text], {type:"text/plain;charset=utf-8"});
  const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name.replace(/\//g,"_"); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
document.getElementById("save").onclick = ()=>dl(files[active].path.split("/").pop(), files[active].text);
document.getElementById("copy").onclick = async (e)=>{ try { await navigator.clipboard.writeText(files[active].text); e.target.textContent="Скопійовано"; setTimeout(()=>e.target.textContent="Копіювати",1200); } catch(err){ alert("Копіювання недоступне — виділи текст вручну"); } };
document.getElementById("all").onclick = async ()=>{ for (const f of files){ dl(f.path.split("/").pop(), f.text); await new Promise(r=>setTimeout(r,600)); } };
document.getElementById("zip").onclick = ()=>{ location.href = "https://user.uploads.dev/file/d284c9eacf760b2a96337fe80915ac72.zip"; };
show(0);
</script>
