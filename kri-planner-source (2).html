Enter\") run(); });\n\n    async function run() {\n      if (busy) return;\n      const name = username.value.trim();\n      const pwd = pass.value;\n      const shown = displayName ? displayName.value.trim() : \"\";\n      if (!name) return showError(\"Введіть назву профілю\");\n      if (name.length \u003c 2) return showError(\"Назва профілю занадто коротка\");\n      if (!pwd) return showError(\"Введіть пароль\");\n      if (!isLogin) {\n        if (pwd.length \u003c 4) return showError(\"Пароль має містити щонайменше 4 символи\");\n        if (pwd !== confirm.value) return showError(\"Паролі не збігаються\");\n      }\n      busy = true;\n      errorBox.classList.add(\"hidden\");\n      submit.disabled = true;\n      clear(submit);\n      append(submit, [h(\"span\", { class: \"spinner\" }), h(\"span\", { class: \"btn-label\" }, isLogin ? \"Входимо…\" : \"Створюємо…\")]);\n      try {\n        if (isLogin) await store.login(name, pwd);\n        else {\n          await store.register(name, pwd, shown);\n          toast(`Вітаємо, ${shown || name}! Акаунт створено`, { icon: \"sparkles\" });\n        }\n        onAuthed();\n      } catch (err) {\n        busy = false;\n        submit.disabled = false;\n        clear(submit);\n        append(submit, [h(\"span\", { class: \"btn-ico\", html: iconMarkup(isLogin ? \"arrowRight\" : \"user\") }), h(\"span\", { class: \"btn-label\" }, isLogin ? \"Увійти\" : \"Створити акаунт\")]);\n        showError(err && err.message ? err.message : \"Щось пішло не так\");\n      }\n    }\n\n    clear(switchRow);\n    append(switchRow, [\n      isLogin ? \"Ще немає акаунту? \" : \"Вже маєте акаунт? \",\n      h(\"button\", { type: \"button\", onclick: () => { current = isLogin ? \"register\" : \"login\"; paint(); onMode && onMode(current); } }, isLogin ? \"Зареєструватися\" : \"Увійти\"),\n    ]);\n\n    loadUsers(isLogin, username);\n  }\n\n  async function loadUsers(isLogin, usernameInput) {\n    clear(usersRow);\n    if (!isLogin) return;\n    let names = [];\n    try { names = await store.listUsers(); } catch (e) { names = []; }\n    if (!names.length) return;\n    append(usersRow, [h(\"div\", { class: \"faint\", style: \"width:100%;font-size:12px;margin-bottom:2px\" }, \"Швидкий вибір профілю:\")]);\n    for (const n of names.slice(0, 8)) {\n      const chip = h(\"button\", { class: \"chip\", type: \"button\" },\n        h(\"span\", { class: \"ico\", html: iconMarkup(\"user\") }), n);\n      chip.addEventListener(\"click\", () => { usernameInput.value = n; usernameInput.focus(); });\n      usersRow.appendChild(chip);\n    }\n  }\n\n  paint();\n  return wrap;\n}\n"},{"path":"src/screens/calendar-edit.js","text":"import { h, append, clear, btn, toast, confirmDialog, toggleRow, segmented, field, selectInput } from \"../ui.js\";\nimport { iconMarkup } from \"../icons.js\";\nimport { store } from \"../store.js\";\nimport { todayStr, addDaysStr, toISODow, plural, occurrencesOfRepeatPattern, diffDays, tripDuration, tripRangeLabel, tripReminder } from \"../util.js\";\nimport { openEventForm, openTimetableEditor, openTripForm } from \"../forms.js\";\nimport { openTripSheet } from \"../itemdetail.js\";\nimport { exerciseSettingsBlock } from \"./exercise.js\";\nimport { PALETTES, applyTheme } from \"../themes.js\";\n\nexport function nextOccurrence(ev) {\n  const today = todayStr();\n  if (ev.kind === \"once\" || !ev.kind) return ev.date;\n  for (let i = 0; i \u003c 400; i++) {\n    const d = addDaysStr(today, i);\n    if (occurrencesOfRepeatPattern(ev, d)) return d;\n  }\n  return null;\n}\n\nexport function renderCalendarEdit(ctx) {\n  const page = h(\"div\", { class: \"page page-edit\" });\n\n  function build() {\n    clear(page);\n    append(page, [\n      h(\"div\", { class: \"page-head\" },\n        h(\"div\", { class: \"page-kicker\" }, \"Керування\"),\n        h(\"h1\", { class: \"page-title\" }, \"Редагування\"),\n        h(\"div\", { class: \"page-sub\" }, \"Події, подорожі, графік тижня та налаштування застосунку\"),\n      ),\n      h(\"div\", { class: \"section\" },\n        h(\"div\", { class: \"section-title\", style: \"margin:0 2px 10px\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"plus\") }), \"Додати\"),\n        h(\"div\", { class: \"tile-grid\" },\n          tile(\"Додати одноразову подію\", \"Зустріч, тренування, візит — на конкретну дату\", \"calendar\", () => openEventForm(ctx, null, \"once\")),\n          tile(\"Додати свято\", \"Повторюється щороку раз на рік і показується в Календарі\", \"gift\", () => openEventForm(ctx, null, \"yearly\")),\n          tile(\"Додати подорож\", \"Обери дати виїзду й повернення — Календар нагадає заздалегідь\", \"luggage\", () => openTripForm(ctx, null)),\n          tile(\"Додати повторювану подію\", \"Щодня, щотижня, щомісяця або кожні N днів\", \"refresh\", () => openEventForm(ctx, null, \"weekly\")),\n          tile(\"Редагувати графік\", \"Заняття тижня по годинах — повторюються щотижня\", \"book\", () => openTimetableEditor(ctx, toISODow(new Date()))),\n        ),\n      ),\n      tripsSection(),\n      settingsSection(),\n    ]);\n  }\n\n  function tile(title, sub, ico, onclick) {\n    return h(\"button\", { class: \"tile\", onclick },\n      h(\"span\", { class: \"tile-ico\", html: iconMarkup(ico) }),\n      h(\"span\", { class: \"tile-text\" },\n        h(\"span\", { class: \"tile-title\" }, title),\n        h(\"span\", { class: \"tile-sub\" }, sub),\n      ),\n      h(\"span\", { class: \"chev\", html: iconMarkup(\"chevronRight\") }),\n    );\n  }\n\n  function tripsSection() {\n    const today = todayStr();\n    const list = store.data.trips.slice().sort((a, b) => String(a.from).localeCompare(String(b.from)));\n    const box = h(\"div\", { class: \"section\" },\n      h(\"div\", { class: \"section-head\" },\n        h(\"div\", { class: \"section-title\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"luggage\") }), \"Мої подорожі\"),\n        h(\"div\", { class: \"section-hint\" }, `${list.length} ${plural(list.length, \"подорож\", \"подорожі\", \"подорожей\")}`),\n      ),\n    );\n    if (!list.length) {\n      box.appendChild(h(\"div\", { class: \"empty-state\" },\n        h(\"span\", { class: \"ico\", html: iconMarkup(\"mapPin\") }),\n        h(\"h4\", {}, \"Подорожей поки немає\"),\n        h(\"p\", {}, \"Додайте подорож — і Календар нагадає за день до виїзду та в день подорожі.\"),\n      ));\n      return box;\n    }\n    for (const trip of list) {\n      const days = tripDuration(trip);\n      const rem = tripReminder(trip, today);\n      const until = diffDays(today, trip.from);\n      const when = rem\n        ? rem.title\n        : (trip.to \u003c today\n          ? \"Завершено\"\n          : until === 1\n            ? \"Завтра подорож\"\n            : `Через ${until} ${plural(until, \"день\", \"дні\", \"днів\")}`);\n      const row = h(\"div\", { class: `list-row is-trip${rem ? \" is-active\" : \"\"}` },\n        h(\"span\", { class: \"tile-ico is-trip\", html: iconMarkup(\"luggage\") }),\n        h(\"div\", { class: \"list-row-main\", style: \"cursor:pointer\", onclick: () => openTripSheet(trip, ctx) },\n          h(\"div\", { class: \"list-row-title\" }, trip.title),\n          h(\"div\", { class: \"list-row-sub\" },\n            h(\"span\", {}, tripRangeLabel(trip)),\n            h(\"span\", {}, `${days} ${plural(days, \"день\", \"дні\", \"днів\")}`),\n            h(\"span\", { class: `tag${rem ? \"\" : \" tag-muted\"}` }, when),\n          ),\n        ),\n        h(\"div\", { class: \"list-row-actions\" },\n          h(\"button\", { class: \"icon-btn\", title: \"Редагувати\", html: iconMarkup(\"edit\"), onclick: () => openTripForm(ctx, trip) }),\n          h(\"button\", {\n            class: \"icon-btn\", title: \"Видалити\", html: iconMarkup(\"trash\"),\n            onclick: async () => {\n              if (await confirmDialog({ title: \"Видалити подорож?\", message: `«${trip.title}» зникне з календаря.`, confirmText: \"Видалити\", danger: true })) {\n                store.removeTrip(trip.id);\n                toast(\"Подорож видалено\", { icon: \"trash\", duration: 2200 });\n              }\n            },\n          }),\n        ),\n      );\n      box.appendChild(row);\n    }\n    return box;\n  }\n\n  function settingsSection() {\n    const s = store.data.settings;\n    const box = h(\"div\", { class: \"section\", id: \"app-settings\" },\n      h(\"div\", { class: \"section-head\" },\n        h(\"div\", { class: \"section-title\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"sliders\") }), \"Налаштування\"),\n      ),\n      h(\"div\", { class: \"card\" },\n        h(\"button\", {\n          class: \"tile\", style: \"box-shadow:none;border:none;padding:14px 0;background:transparent\", onclick: () => toast(\"Зміна мови з'явиться в наступному оновленні\", { icon: \"globe\", duration: 3000 }),\n        },\n          h(\"span\", { class: \"tile-ico\", html: iconMarkup(\"globe\") }),\n          h(\"span\", { class: \"tile-text\" },\n            h(\"span\", { class: \"tile-title\" }, \"Змінити мову\"),\n            h(\"span\", { class: \"tile-sub\" }, \"Зараз — українська\"),\n          ),\n          h(\"span\", { class: \"chev\", html: iconMarkup(\"chevronRight\") }),\n        ),\n      ),\n      h(\"div\", { class: \"card\", style: \"margin-top:12px\" },\n        h(\"div\", { class: \"section-title\", style: \"margin-bottom:6px\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"dumbbell\") }), \"Зарядка\"),\n        exerciseBlock.el,\n      ),\n      h(\"div\", { class: \"card\", style: \"margin-top:12px\" },\n        h(\"div\", { class: \"section-title\", style: \"margin-bottom:6px\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"bell\") }), \"Нагадування\"),\n        toggleRow(\"Нагадувати про події\", !!s.reminders.events, (v) => { store.setSetting(\"reminders.events\", v); rebuild(); }, \"Спливаюче повідомлення перед початком події\"),\n        s.reminders.events ? field(\"За скільки хвилин\", selectInput(\n          [{ value: 5, label: \"за 5 хвилин\" }, { value: 10, label: \"за 10 хвилин\" }, { value: 15, label: \"за 15 хвилин\" }, { value: 30, label: \"за 30 хвилин\" }],\n          s.reminders.eventsMinutes,\n          { onchange: (e) => store.setSetting(\"reminders.eventsMinutes\", Number(e.target.value)) },\n        )) : null,\n      ),\n      h(\"div\", { class: \"card\", style: \"margin-top:12px\" },\n        h(\"div\", { class: \"section-title\", style: \"margin-bottom:10px\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"palette\") }), \"Вигляд\"),\n        h(\"div\", { class: \"field-label\" }, \"Світлий чи темний режим\"),\n        segmented(\n          [{ value: \"light\", label: \"Світлий\", icon: \"sun\" }, { value: \"dark\", label: \"Темний\", icon: \"moon\" }],\n          s.mode,\n          (v) => { store.setSetting(\"mode\", v); applyTheme(store.data.settings.theme, v); rebuild(); },\n          { fill: true },\n        ),\n        h(\"div\", { class: \"field-label\", style: \"margin:16px 0 8px\" }, \"Головний колір\"),\n        h(\"div\", { class: \"color-grid\" }, PALETTES.map((p) => {\n          const active = p.id === s.theme;\n          const swatch = p[mode()];\n          const opt = h(\"button\", { class: `color-opt${active ? \" is-active\" : \"\"}`, type: \"button\" },\n            h(\"span\", { class: \"color-swatch\", style: `background:linear-gradient(135deg,${swatch.c1},${swatch.c2} 55%,${swatch.c3})` }),\n            h(\"span\", {},\n              h(\"span\", { class: \"color-opt-name\" }, p.name),\n              h(\"span\", { class: \"color-opt-hint\" }, p.hint),\n            ),\n          );\n          opt.addEventListener(\"click\", () => { store.setSetting(\"theme\", p.id); applyTheme(p.id, store.data.settings.mode); rebuild(); });\n          return opt;\n        })),\n      ),\n      accountCard(),\n    );\n    return box;\n  }\n\n  function mode() {\n    return store.data.settings.mode === \"dark\" ? \"dark\" : \"light\";\n  }\n\n  const exerciseBlock = exerciseSettingsBlock(ctx);\n\n  function accountCard() {\n    return h(\"div\", { class: \"card\", style: \"margin-top:12px\" },\n      h(\"div\", { class: \"section-title\", style: \"margin-bottom:10px\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"user\") }), \"Профіль\"),\n      h(\"div\", { class: \"row-between\" },\n        h(\"div\", {},\n          h(\"div\", { style: \"font-weight:800;font-size:15px\" }, store.displayName() || \"—\"),\n          h(\"div\", { class: \"faint\", style: \"font-size:12.5px;margin-top:2px\" }, `Назва профілю: ${store.user || \"—\"} · дані на цьому пристрої`),\n        ),\n        btn(\"Вийти\", {\n          variant: \"danger-ghost\", size: \"sm\", icon: \"arrowLeft\",\n          onClick: async () => {\n            if (await confirmDialog({ title: \"Вийти з акаунту?\", message: \"Ви зможете увійти знову в будь-який момент — дані залишаться на пристрої.\", confirmText: \"Вийти\", danger: true })) {\n              await store.logout();\n            }\n          },\n        }),\n      ),\n    );\n  }\n\n  function rebuild() { build(); }\n\n  build();\n  return { el: page, update: build };\n}\n"},{"path":"src/screens/chat.js","text":"import { h, append, clear, autoGrow, toast, confirmDialog } from \"../ui.js\";\nimport { iconMarkup } from \"../icons.js\";\nimport { ChatSession } from \"../ai.js\";\nimport { store } from \"../store.js\";\n\nexport function renderRich(text) {\n  const frag = document.createDocumentFragment();\n  const lines = String(text == null ? \"\" : text).split(\"\\n\");\n  let list = null;\n  for (const raw of lines) {\n    const line = raw.replace(/\\s+$/, \"\");\n    const bullet = line.match(/^\\s*(?:[-•*]|\\d+\\.)\\s+(.*)$/);\n    if (bullet) {\n      if (!list) { list = document.createElement(\"ul\"); frag.appendChild(list); }\n      const li = document.createElement(\"li\");\n      appendInline(li, bullet[1]);\n      list.appendChild(li);\n      continue;\n    }\n    list = null;\n    if (!line.trim()) continue;\n    const p = document.createElement(\"p\");\n    appendInline(p, line);\n    frag.appendChild(p);\n  }\n  return frag;\n}\n\nfunction appendInline(el, text) {\n  const parts = String(text).split(/(\\*\\*[^*]+\\*\\*|`[^`]+`)/g);\n  for (const part of parts) {\n    if (!part) continue;\n    if (/^\\*\\*[^*]+\\*\\*$/.test(part)) {\n      const b = document.createElement(\"strong\");\n      b.textContent = part.slice(2, -2);\n      el.appendChild(b);\n    } else if (/^`[^`]+`$/.test(part)) {\n      const c = document.createElement(\"code\");\n      c.textContent = part.slice(1, -1);\n      el.appendChild(c);\n    } else {\n      el.appendChild(document.createTextNode(part));\n    }\n  }\n}\n\nexport function renderChat(ctx) {\n  const kind = ctx.panel === \"diary\" ? \"diary\" : \"calendar\";\n  const page = h(\"div\", { class: \"page page-chat\" });\n  const list = h(\"div\", { class: \"chat-wrap\" });\n  let session = ctx.chatSessions[kind];\n  if (!session) session = ctx.chatSessions[kind] = ChatSession.load(kind);\n  let busy = false;\n\n  const isDiary = kind === \"diary\";\n  const composer = h(\"div\", { class: \"chat-composer\" });\n  const input = h(\"textarea\", { class: \"input textarea\", rows: 1, placeholder: isDiary ? \"Напиши, що додати в щоденник…\" : \"Спитай або додай подію…\" });\n  autoGrow(input);\n  const sendBtn = h(\"button\", { class: \"chat-send\", title: \"Надіслати\", html: iconMarkup(\"send\") });\n  append(composer, [input, sendBtn]);\n\n  const scroller = ctx.mainEl;\n\n  function nearBottom() {\n    return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight \u003c 260;\n  }\n  function toBottom(force) {\n    if (force || nearBottom()) {\n      requestAnimationFrame(() => { scroller.scrollTop = scroller.scrollHeight; });\n    }\n  }\n\n  function buildHead() {\n    return h(\"div\", { class: \"page-head\" },\n      h(\"div\", { class: \"page-kicker\" }, isDiary ? \"Щоденник · помічник\" : \"Календар · помічник\"),\n      h(\"div\", { class: \"row-between\" },\n        h(\"h1\", { class: \"page-title\" }, \"ШІ\"),\n        h(\"button\", {\n          class: \"icon-btn\", title: \"Очистити чат\", html: iconMarkup(\"refresh\"),\n          onclick: async () => {\n            if (!session.log.length) return;\n            if (await confirmDialog({ title: \"Очистити чат?\", message: \"Історія повідомлень з ШІ буде стерта. Дані календаря залишаться.\", confirmText: \"Очистити\", danger: true })) {\n              session.clear();\n              renderMessages();\n              toast(\"Чат очищено\", { duration: 2200 });\n            }\n          },\n        }),\n      ),\n      h(\"div\", { class: \"page-sub\" }, isDiary ? \"Питай про завдання або проси додати нові\" : \"Питай про розклад або проси додати події\"),\n    );\n  }\n\n  function avatarNode(role) {\n    const el = h(\"div\", { class: \"chat-avatar\" });\n    paintAvatarNode(el, role);\n    return el;\n  }\n\n  function paintAvatarNode(el, role) {\n    clear(el);\n    const photo = role === \"user\" ? store.avatar() : \"\";\n    el.classList.toggle(\"has-photo\", !!photo);\n    if (photo) {\n      el.appendChild(h(\"img\", { src: photo, alt: \"\", draggable: false }));\n    } else {\n      el.innerHTML = iconMarkup(role === \"user\" ? \"user\" : \"sparkles\");\n    }\n  }\n\n  function paintUserAvatars() {\n    for (const el of list.querySelectorAll(\".chat-msg.is-user .chat-avatar\")) paintAvatarNode(el, \"user\");\n  }\n\n  function addMessage(msg) {\n    const bubble = h(\"div\", { class: \"bubble\" });\n    const row = h(\"div\", { class: `chat-msg ${msg.role === \"user\" ? \"is-user\" : \"is-bot\"}` },\n      avatarNode(msg.role === \"user\" ? \"user\" : \"assistant\"),\n      bubble,\n    );\n    if (msg.role === \"user\") {\n      bubble.appendChild(document.createTextNode(msg.text));\n    } else {\n      bubble.appendChild(renderRich(msg.text));\n      if (msg.changes && msg.changes.length) {\n        bubble.appendChild(changesNode(msg.changes));\n      }\n    }\n    list.appendChild(row);\n    return bubble;\n  }\n\n  function changesNode(changes) {\n    const box = h(\"div\", { class: \"chat-changes\" });\n    for (const c of changes) {\n      box.appendChild(h(\"div\", { class: \"chat-change\" },\n        h(\"span\", { class: \"ico\", html: iconMarkup(\"check\") }),\n        h(\"span\", {}, c),\n      ));\n    }\n    return box;\n  }\n\n  function renderMessages() {\n    clear(list);\n    if (!session.log.length) {\n      list.appendChild(emptyState());\n      return;\n    }\n    for (const msg of session.log) addMessage(msg);\n  }\n\n  function emptyState() {\n    const box = h(\"div\", { class: \"chat-hero\" });\n    append(box, [\n      h(\"div\", { class: \"gradient-note\" },\n        h(\"div\", { class: \"gn-title\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"sparkles\") }), isDiary ? \"Привіт! Я твій помічник щоденника\" : \"Привіт! Я твій помічник календаря\"),\n        h(\"div\", { class: \"gn-text\" }, isDiary\n          ? \"Можу розповісти, що задано на завтра, або додати нове завдання. Просто напиши своїми словами.\"\n          : \"Можу розповісти про твій розклад, або додати подію — просто напиши своїми словами.\"),\n      ),\n      h(\"div\", { class: \"section\" },\n        h(\"div\", { class: \"section-head\" }, h(\"div\", { class: \"section-title\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"info\") }), \"Спробуй запитати\")),\n        h(\"div\", { class: \"chip-row\" }, session.suggestions().map((s) => {\n          const chip = h(\"button\", { class: \"chip\" }, s);\n          chip.addEventListener(\"click\", () => { input.value = s; submit(); });\n          return chip;\n        })),\n      ),\n    ]);\n    return box;\n  }\n\n  function renderStream(bubble, text) {\n    clear(bubble);\n    if (!text) {\n      bubble.appendChild(typingNode());\n      return;\n    }\n    bubble.appendChild(renderRich(text));\n    bubble.appendChild(typingNode());\n  }\n\n  function typingNode() {\n    return h(\"div\", { class: \"typing\" }, h(\"i\"), h(\"i\"), h(\"i\"));\n  }\n\n  function setBusy(v) {\n    busy = v;\n    sendBtn.disabled = v;\n    clear(sendBtn);\n    sendBtn.innerHTML = iconMarkup(v ? \"stop\" : \"send\");\n    if (v) {\n      sendBtn.onclick = () => { session.stop(); };\n    } else {\n      sendBtn.onclick = submit;\n    }\n  }\n\n  async function submit() {\n    const text = input.value.trim();\n    if (!text || busy) return;\n    input.value = \"\";\n    input.style.height = \"auto\";\n    if (list.querySelector(\".chat-hero\")) clear(list);\n    addMessage({ role: \"user\", text });\n    toBottom(true);\n    const bubble = addMessage({ role: \"assistant\", text: \"\" });\n    clear(bubble);\n    bubble.appendChild(typingNode());\n    setBusy(true);\n    toBottom(true);\n    try {\n      const reply = await session.send(text, {\n        onChunk: (shown) => { renderStream(bubble, shown); toBottom(false); },\n      });\n      clear(bubble);\n      bubble.appendChild(renderRich(reply.text || \"Готово.\"));\n      if (reply.changes && reply.changes.length) bubble.appendChild(changesNode(reply.changes));\n      if (reply.changes && reply.changes.length) {\n        toast(reply.changes[0], { icon: \"check\", duration: 3200 });\n      }\n      ctx.pokeRefresh();\n    } catch (err) {\n      clear(bubble);\n      bubble.appendChild(h(\"div\", { class: \"chat-change\", style: \"background:rgba(220,38,38,.1);color:#dc2626\" },\n        h(\"span\", { class: \"ico\", html: iconMarkup(\"info\") }),\n        h(\"span\", {}, err.message || \"Помилка\"),\n      ));\n    } finally {\n      setBusy(false);\n      toBottom(false);\n    }\n  }\n\n  sendBtn.onclick = submit;\n  input.addEventListener(\"keydown\", (e) => {\n    if (e.key === \"Enter\" && !e.shiftKey) { e.preventDefault(); submit(); }\n  });\n\n  renderMessages();\n  append(page, [buildHead(), list, composer]);\n\n  return {\n    el: page,\n    update: () => { paintUserAvatars(); },\n    destroy: () => {},\n  };\n}\n"},{"path":"src/screens/day.js","text":"import { h, append, clear } from \"../ui.js\";\nimport { iconMarkup } from \"../icons.js\";\nimport { store } from \"../store.js\";\nimport {\n  todayStr, addDaysStr, weekdayIdx, WEEKDAYS_SHORT, WEEKDAYS_LONG, MONTHS_GEN,\n  minOf, nowMinutes, minutesToTime, fmtDateLong, normalizeUrl, prettyUrl, clamp, plural,\n} from \"../util.js\";\nimport { itemStatus, statusClass, statusLabel } from \"../schedule.js\";\nimport { openItemSheet } from \"../itemdetail.js\";\nimport { openEventForm } from \"../forms.js\";\nimport { openExercise } from \"./exercise.js\";\nimport { nextCard } from \"../nextcard.js\";\n\nconst HOUR_H = 72;\nconst CARD_MIN_H = 62;\nconst DEFAULT_LESSON_MIN = 45;\nconst DAY_FROM = 0;\nconst DAY_TO = 24;\nconst SNAP_MIN = 30;\n\nfunction isNightHour(hh) {\n  return hh \u003c 7 || hh >= 22;\n}\n\nfunction layoutTimed(items) {\n  const rows = items.map((it) => {\n    const s = minOf(it.start);\n    const e = it.end ? Math.max(minOf(it.end), s + 20) : s + DEFAULT_LESSON_MIN;\n    const hgt = Math.max(CARD_MIN_H, Math.round((e - s) / 60 * HOUR_H - 5));\n    const effE = Math.max(e, s + (hgt / HOUR_H) * 60);\n    return { it, s, e, effE, hgt, lane: 0, lanes: 1 };\n  }).sort((a, b) => a.s - b.s || a.e - b.e);\n\n  let cluster = [];\n  let clusterMaxEnd = -1;\n  const flush = () => {\n    if (!cluster.length) return;\n    const laneEnds = [];\n    for (const row of cluster) {\n      let placed = -1;\n      for (let i = 0; i \u003c laneEnds.length; i++) {\n        if (laneEnds[i] \u003c= row.s) { placed = i; break; }\n      }\n      if (placed === -1) { laneEnds.push(row.effE); placed = laneEnds.length - 1; }\n      else laneEnds[placed] = row.effE;\n      row.lane = placed;\n    }\n    const lanes = Math.max(1, laneEnds.length);\n    for (const row of cluster) row.lanes = lanes;\n    cluster = [];\n    clusterMaxEnd = -1;\n  };\n\n  for (const row of rows) {\n    if (cluster.length && row.s >= clusterMaxEnd) flush();\n    cluster.push(row);\n    clusterMaxEnd = Math.max(clusterMaxEnd, row.effE);\n  }\n  flush();\n  return rows;\n}\n\nfunction countLabel(n) {\n  return `${n} ${plural(n, \"подія\", \"події\", \"подій\")}`;\n}\n\nexport function renderDay(ctx) {\n  const page = h(\"div\", { class: \"page page-day\" });\n  const lookahead = Number(window.root.dayLookahead) || 3;\n  let tick = null;\n  let firstScroll = true;\n\n  function build() {\n    clear(page);\n    const today = todayStr();\n    append(page, [\n      h(\"div\", { class: \"page-head\" },\n        h(\"div\", { class: \"page-kicker\" }, \"Погодинно\"),\n        h(\"h1\", { class: \"page-title\" }, \"Графік дня\"),\n        h(\"div\", { class: \"page-sub\" }, `${fmtDateLong(today)} · сьогодні та ще ${lookahead} ${lookahead === 1 ? \"день\" : \"дні\"}`),\n      ),\n      nextCard(ctx, { filter: (i) => i.category === \"timed\", hideEmpty: true }),\n    ]);\n\n    let todayScrollTarget = null;\n    const list = h(\"div\", { class: \"day-list\" });\n    for (let i = 0; i \u003c= lookahead; i++) {\n      const date = addDaysStr(today, i);\n      const block = dayBlock(date, today, i);\n      list.appendChild(block.el);\n      if (i === 0) todayScrollTarget = block.nowAnchor;\n    }\n    page.appendChild(list);\n\n    if (firstScroll && todayScrollTarget) {\n      firstScroll = false;\n      requestAnimationFrame(() => ctx.scrollToEl(todayScrollTarget, 150));\n    }\n  }\n\n  function dayBlock(date, today, offset) {\n    const items = store.timedItems(date);\n    const dow = weekdayIdx(date);\n    const isToday = date === today;\n    const from = DAY_FROM;\n    const to = DAY_TO;\n\n    const head = h(\"div\", { class: \"day-block-head\" },\n      h(\"div\", { class: `day-badge${isToday ? \" is-today\" : \"\"}` },\n        h(\"div\", { class: \"day-badge-dow\" }, WEEKDAYS_SHORT[dow]),\n        h(\"div\", { class: \"day-badge-num\" }, String(Number(date.slice(8, 10)))),\n      ),\n      h(\"div\", { class: \"day-head-text\" },\n        h(\"div\", { class: \"day-head-title\" }, offset === 0 ? \"Сьогодні\" : offset === 1 ? \"Завтра\" : offset === 2 ? \"Післязавтра\" : WEEKDAYS_LONG[dow]),\n        h(\"div\", { class: \"day-head-sub\" }, `${WEEKDAYS_LONG[dow]}, ${Number(date.slice(8, 10))} ${MONTHS_GEN[Number(date.slice(5, 7)) - 1]} · ${countLabel(items.length)}`),\n      ),\n    );\n\n    const block = h(\"div\", { class: \"day-block\" }, head);\n\n    if (!items.length) {\n      block.appendChild(h(\"div\", { class: \"day-free-note\" },\n        h(\"span\", { class: \"dfn-ico\", html: iconMarkup(\"clock\") }),\n        h(\"span\", {}, \"Вільно — натисни на годину, щоб додати подію\"),\n      ));\n    }\n\n    const timeline = h(\"div\", { class: \"timeline\" });\n    const rangeStartMin = from * 60;\n    const height = (to - from) * HOUR_H;\n    const scroll = h(\"div\", { class: \"tl-scroll\", style: `height:${height}px;--hour-h:${HOUR_H}px` });\n\n    for (const span of [[-1, 7], [22, 25]]) {\n      const a = Math.max(span[0], from);\n      const b = Math.min(span[1], to);\n      if (b \u003c= a) continue;\n      scroll.appendChild(h(\"div\", { class: \"night-band\", style: `top:${(a - from) * HOUR_H}px;height:${(b - a) * HOUR_H}px` }));\n    }\n\n    const nowMin = nowMinutes();\n    const nowTop = isToday ? (nowMin - rangeStartMin) / 60 * HOUR_H : null;\n\n    for (let hh = from; hh \u003c= to; hh++) {\n      const top = (hh * 60 - rangeStartMin) / 60 * HOUR_H;\n      const night = isNightHour(hh);\n      scroll.appendChild(h(\"div\", { class: `hour-line${night ? \" is-night\" : \"\"}`, style: `top:${top}px` }));\n      if (hh \u003c to) {\n        let labelTop = top + HOUR_H / 2;\n        if (nowTop !== null && Math.abs(labelTop - nowTop) \u003c 22) {\n          labelTop = nowTop + (labelTop >= nowTop ? 22 : -22);\n        }\n        scroll.appendChild(h(\"div\", { class: `hour-label${night ? \" is-night\" : \"\"}`, style: `top:${labelTop}px` }, `${String(hh).padStart(2, \"0\")}:00`));\n      }\n    }\n\n    const rows = layoutTimed(items);\n    const area = h(\"div\", { class: \"tl-area\" });\n    for (const row of rows) {\n      const st = itemStatus(row.it, date);\n      const top = (row.s - rangeStartMin) / 60 * HOUR_H;\n      const hgt = row.hgt;\n      const left = (row.lane / row.lanes) * 100;\n      const width = (1 / row.lanes) * 100;\n      const card = eventCard(row.it, date, st, { top, hgt, left, width });\n      area.appendChild(card);\n    }\n    scroll.appendChild(area);\n\n    let nowAnchor = head;\n    if (isToday && nowTop !== null) {\n      scroll.appendChild(h(\"div\", { class: \"now-line\", style: `top:${nowTop}px` }));\n      scroll.appendChild(h(\"div\", { class: \"now-label\", style: `top:${nowTop}px` }, `${String(Math.floor(nowMin / 60)).padStart(2, \"0\")}:${String(nowMin % 60).padStart(2, \"0\")}`));\n      const marker = h(\"div\", { class: \"now-anchor\", style: `top:${nowTop}px` });\n      scroll.appendChild(marker);\n      nowAnchor = marker;\n    }\n\n    scroll.addEventListener(\"click\", (e) => {\n      if (e.target.closest(\".eb\") || e.target.closest(\"a\") || e.target.closest(\"button\")) return;\n      const rect = scroll.getBoundingClientRect();\n      const y = e.clientY - rect.top;\n      const snapped = clamp(Math.floor(((y / HOUR_H) * 60) / SNAP_MIN) * SNAP_MIN, 0, 23 * 60 + 30);\n      openEventForm(ctx, null, \"once\", {\n        date,\n        start: minutesToTime(snapped),\n        end: minutesToTime(Math.min(snapped + 60, 23 * 60 + 59)),\n      });\n    });\n\n    timeline.appendChild(scroll);\n    block.appendChild(timeline);\n    if (offset !== 0) block.style.marginBottom = \"22px\";\n    return { el: block, nowAnchor };\n  }\n\n  function eventCard(item, date, st, geo) {\n    const isExercise = item.source === \"exercise\";\n    const isLesson = item.source === \"lesson\";\n    const style = `top:${geo.top}px;height:${geo.hgt}px;left:calc(${geo.left}% + 6px);width:calc(${geo.width}% - 12px)`;\n\n    const titleRow = h(\"div\", { class: \"eb-title\" },\n      isLesson ? h(\"span\", { class: \"eb-badge eb-num\" }, String(item.lessonNo)) : null,\n      isExercise ? h(\"span\", { class: \"eb-badge eb-ico-badge\", html: iconMarkup(\"dumbbell\") }) : null,\n      h(\"span\", { class: \"eb-name\" }, item.short || item.title),\n      item.link ? linkChip(item.link) : null,\n    );\n\n    const narrow = geo.width \u003c= 70;\n    const metaText = narrow && isExercise\n      ? item.start\n      : `${item.start}${item.end ? \"–\" + item.end : \"\"}${item.meta ? \" · \" + item.meta : \"\"}`;\n    const metaRow = h(\"div\", { class: \"eb-meta-row\" },\n      h(\"span\", { class: \"eb-meta\" }, metaText),\n      isExercise && item.done ? h(\"span\", { class: \"eb-badge eb-done\" }, \"Виконано\") : null,\n      isExercise && !item.done ? h(\"button\", {\n        class: \"eb-start\", type: \"button\",\n        onclick: (e) => { e.stopPropagation(); openExercise(ctx); },\n      }, \"Почати\") : null,\n      st === \"live\" || st === \"soon\" ? h(\"span\", { class: \"eb-badge\" }, statusLabel(st, item)) : null,\n    );\n\n    const card = h(\"div\", { class: `eb is-${item.source} ${statusClass(st)}`.trim(), style },\n      titleRow,\n      metaRow,\n    );\n\n    if (isExercise && item.done) {\n      card.classList.add(\"is-static\");\n    } else {\n      card.addEventListener(\"click\", (e) => {\n        if (e.target.closest(\"a\")) return;\n        if (isExercise) { openExercise(ctx); return; }\n        openItemSheet(item, date, ctx);\n      });\n    }\n    return card;\n  }\n\n  function linkChip(linkUrl) {\n    return h(\"a\", {\n      class: \"eb-linkchip\",\n      href: normalizeUrl(linkUrl),\n      target: \"_blank\",\n      rel: \"noopener noreferrer\",\n      title: prettyUrl(linkUrl),\n      html: iconMarkup(\"link\"),\n      onclick: (e) => e.stopPropagation(),\n    });\n  }\n\n  build();\n  tick = setInterval(build, 20000);\n  return {\n    el: page,\n    update: () => { firstScroll = false; build(); },\n    destroy: () => clearInterval(tick),\n  };\n}\n"},{"path":"src/screens/diary-edit.js","text":"import { h, append, clear, toast, toggleRow, field } from \"../ui.js\";\nimport { iconMarkup } from \"../icons.js\";\nimport { store } from \"../store.js\";\nimport { todayStr, toISODow, plural } from \"../util.js\";\nimport { openTaskForm, openTimetableEditor } from \"../forms.js\";\n\nexport function renderDiaryEdit(ctx) {\n  const page = h(\"div\", { class: \"page page-edit\" });\n\n  function build() {\n    clear(page);\n    append(page, [\n      h(\"div\", { class: \"page-head\" },\n        h(\"div\", { class: \"page-kicker\" }, \"Щоденник · керування\"),\n        h(\"h1\", { class: \"page-title\" }, \"Редагування\"),\n        h(\"div\", { class: \"page-sub\" }, \"Завдання, розклад і налаштування щоденника\"),\n      ),\n      h(\"div\", { class: \"section\" },\n        h(\"div\", { class: \"section-title\", style: \"margin:0 2px 10px\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"plus\") }), \"Додати\"),\n        h(\"div\", { class: \"tile-grid\" },\n          tile(\"Додати завдання\", \"Тема, назва, опис, дата та посилання\", \"clipboard\", () => openTaskForm(ctx, null)),\n          tile(\"Розклад\", \"Заняття на всі дні тижня — з'являться в Графіку дня\", \"book\", () => openTimetableEditor(ctx, toISODow(new Date()))),\n        ),\n      ),\n      settingsSection(),\n    ]);\n  }\n\n  function tile(title, sub, ico, onclick) {\n    return h(\"button\", { class: \"tile\", onclick },\n      h(\"span\", { class: \"tile-ico\", html: iconMarkup(ico) }),\n      h(\"span\", { class: \"tile-text\" },\n        h(\"span\", { class: \"tile-title\" }, title),\n        h(\"span\", { class: \"tile-sub\" }, sub),\n      ),\n      h(\"span\", { class: \"chev\", html: iconMarkup(\"chevronRight\") }),\n    );\n  }\n\n  function settingsSection() {\n    const s = store.data.settings;\n    const timeInput = h(\"input\", { class: \"input\", type: \"time\", value: s.reminders.homeworkTime || \"18:00\", style: \"max-width:140px\" });\n    timeInput.addEventListener(\"change\", () => store.setSetting(\"reminders.homeworkTime\", timeInput.value || \"18:00\"));\n    return h(\"div\", { class: \"section\" },\n      h(\"div\", { class: \"section-head\" },\n        h(\"div\", { class: \"section-title\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"sliders\") }), \"Налаштування щоденника\"),\n      ),\n      h(\"div\", { class: \"card\" },\n        toggleRow(\"Показувати виконані завдання\", !!s.diary.showDone, (v) => store.setSetting(\"diary.showDone\", v), \"Окремий згорнутий список унизу\"),\n        toggleRow(\"Пропонувати «найближче заняття»\", !!s.diary.defaultNextLesson, (v) => store.setSetting(\"diary.defaultNextLesson\", v), \"Автоматична дата, якщо завдання прив'язане до теми\"),\n        toggleRow(\"Нагадування про завдання\", !!s.reminders.homework, (v) => { store.setSetting(\"reminders.homework\", v); build(); }, \"Нагадати ввечері, якщо залишились невиконані завдання\"),\n        s.reminders.homework ? field(\"Час нагадування\", timeInput) : null,\n        toggleRow(\"Переносити прострочені на сьогодні\", !!s.diary.rollOver, (v) => { store.setSetting(\"diary.rollOver\", v); if (v) rollOver(); }, \"Старі завдання не загубляться\"),\n      ),\n      h(\"div\", { class: \"card\", style: \"margin-top:12px\" },\n        h(\"button\", {\n          class: \"tile\", style: \"box-shadow:none;border:none;padding:4px 0;background:transparent\",\n          onclick: () => ctx.navigate(\"calendar\", \"edit\", { scrollTo: \"app-settings\" }),\n        },\n          h(\"span\", { class: \"tile-ico\", html: iconMarkup(\"sliders\") }),\n          h(\"span\", { class: \"tile-text\" },\n            h(\"span\", { class: \"tile-title\" }, \"Налаштувати весь застосунок\"),\n            h(\"span\", { class: \"tile-sub\" }, \"Колір, тема, зарядка, нагадування — у розділі «Календар → Редагування»\"),\n          ),\n          h(\"span\", { class: \"chev\", html: iconMarkup(\"chevronRight\") }),\n        ),\n      ),\n    );\n  }\n\n  function rollOver() {\n    const today = todayStr();\n    let moved = 0;\n    for (const t of store.data.tasks) {\n      if (!t.done && t.due \u003c today && t.due) { t.due = today; moved++; }\n    }\n    if (moved) { store.commit(); toast(`Перенесено ${moved} ${plural(moved, \"завдання\", \"завдання\", \"завдань\")} на сьогодні`, { icon: \"refresh\" }); }\n  }\n\n  build();\n  return { el: page, update: build };\n}\n"},{"path":"src/screens/exercise.js","text":"import { h, append, clear, openSheet, btn, toast, burstConfetti, toggleRow, field } from \"../ui.js\";\nimport { iconMarkup } from \"../icons.js\";\nimport { store } from \"../store.js\";\nimport { todayStr, addDaysStr, minutesToTime, minOf } from \"../util.js\";\n\nexport const LEVELS = [\n  { id: \"beginner\", name: \"Початківець\", icon: \"user\" },\n  { id: \"advanced\", name: \"Знаток\", icon: \"target\" },\n  { id: \"athlete\", name: \"Спортсмен\", icon: \"flame\" },\n];\n\nexport const EXERCISES = [\n  { id: \"pushups\", name: \"Віджимання\", unit: \"віджимань\", icon: \"dumbbell\", reps: { beginner: 10, advanced: 25, athlete: 45 } },\n  { id: \"pullups\", name: \"Підтягування\", unit: \"підтягувань\", icon: \"target\", reps: { beginner: 5, advanced: 10, athlete: 20 } },\n  { id: \"squats\", name: \"Присідання\", unit: \"присідань\", icon: \"flame\", reps: { beginner: 10, advanced: 25, athlete: 35 } },\n];\n\nexport function openExercise(ctx, onFinished) {\n  const sheet = openSheet({\n    title: \"Ранкова зарядка\",\n    subtitle: `${EXERCISES.length} вправи · приблизно ${store.data.settings.exercise.duration || 20} хвилин`,\n    icon: \"dumbbell\",\n    size: \"lg\",\n  });\n  let step = 0;\n  const body = sheet.body;\n\n  function level() {\n    return store.data.settings.exercise.level || \"beginner\";\n  }\n\n  function setLevel(id) {\n    store.setSetting(\"exercise.level\", id);\n    render();\n  }\n\n  function progress() {\n    return h(\"div\", { class: \"ex-progress\" }, EXERCISES.map((_, i) => h(\"span\", { class: i \u003c step ? \"is-done\" : \"\" })));\n  }\n\n  function render() {\n    clear(body);\n    clear(sheet.footer);\n    if (step >= EXERCISES.length) return renderDone();\n\n    const ex = EXERCISES[step];\n    const lvl = level();\n    const wrap = h(\"div\", { class: \"ex-wrap\" });\n\n    append(wrap, [\n      progress(),\n      h(\"div\", { class: \"ex-art\", html: iconMarkup(ex.icon) }),\n      h(\"div\", {},\n        h(\"div\", { class: \"faint\", style: \"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em\" }, `Вправа ${step + 1} з ${EXERCISES.length}`),\n        h(\"div\", { class: \"ex-name\" }, ex.name),\n      ),\n      h(\"div\", {},\n        h(\"div\", { class: \"ex-reps\" }, String(ex.reps[lvl])),\n        h(\"div\", { class: \"ex-reps-unit\" }, ex.unit),\n      ),\n      h(\"div\", { class: \"level-list\" }, LEVELS.map((L) => {\n        const row = h(\"button\", { class: `level-row${L.id === lvl ? \" is-active\" : \"\"}`, type: \"button\" },\n          h(\"span\", { class: \"level-row-name\" }, h(\"span\", { class: \"ico\", html: iconMarkup(L.icon) }), L.name),\n          h(\"span\", { class: \"level-row-reps\" }, `${ex.reps[L.id]} ${ex.unit}`),\n        );\n        row.addEventListener(\"click\", () => setLevel(L.id));\n        return row;\n      })),\n      h(\"div\", { class: \"faint\", style: \"font-size:12.5px;max-width:320px\" }, \"Обери свій рівень — кількість повторень підлаштується автоматично.\"),\n    ]);\n\n    body.appendChild(wrap);\n    append(sheet.footer, [\n      btn(step === EXERCISES.length - 1 ? \"Завершити\" : \"Далі\", { block: true, size: \"lg\", icon: \"arrowRight\", onClick: next }),\n      btn(\"Пропустити зарядку\", { variant: \"ghost\", block: true, onClick: () => sheet.close() }),\n    ]);\n  }\n\n  function next() {\n    step++;\n    render();\n  }\n\n  function renderDone() {\n    const ex = store.data.settings.exercise;\n    const today = todayStr();\n    const yesterday = addDaysStr(today, -1);\n    const prev = ex.lastDone;\n    let streak = ex.streak || 0;\n    if (prev !== today) {\n      streak = prev === yesterday ? streak + 1 : 1;\n    }\n    store.data.settings.exercise = Object.assign({}, ex, {\n      lastDone: today,\n      streak,\n      best: Math.max(streak, ex.best || 0),\n    });\n    if (!store.data.exerciseLog) store.data.exerciseLog = {};\n    store.data.exerciseLog[today] = { level: ex.level, at: Date.now() };\n    store.commit();\n\n    const wrap = h(\"div\", { class: \"ex-wrap\" },\n      h(\"div\", { class: \"ex-art is-done\", html: iconMarkup(\"trophy\") }),\n      h(\"div\", { class: \"ex-name\" }, \"На сьогодні зарядку завершено!\"),\n      h(\"div\", { class: \"ex-done-text\" }, \"Повертайтеся завтра, щоб продовжити займатися спортом. Гарного дня!\"),\n      h(\"div\", { class: \"streak-card\", style: \"width:100%\" },\n        h(\"div\", { class: \"streak-ico\", html: iconMarkup(\"flame\") }),\n        h(\"div\", {},\n          h(\"div\", { class: \"streak-num\" }, String(streak) + (streak === 1 ? \" день\" : streak \u003c 5 ? \" дні\" : \" днів\")),\n          h(\"div\", { class: \"streak-label\" }, \"серія тренувань поспіль\"),\n        ),\n      ),\n    );\n    body.appendChild(wrap);\n    append(sheet.footer, [\n      btn(\"Готово\", { block: true, size: \"lg\", icon: \"check\", onClick: () => { sheet.close(); toast(\"Чудова робота! Зарядку зараховано\", { icon: \"trophy\", duration: 3600 }); onFinished && onFinished(); } }),\n    ]);\n    burstConfetti(sheet.sheet, 30);\n  }\n\n  render();\n  return sheet;\n}\n\nexport function exerciseSettingsBlock(ctx) {\n  const box = h(\"div\", { class: \"\" });\n  const ex = () => store.data.settings.exercise;\n\n  function render() {\n    clear(box);\n    const e = ex();\n    const timeInput = h(\"input\", { class: \"input\", type: \"time\", value: e.time || \"09:00\", style: \"max-width:140px\" });\n    timeInput.addEventListener(\"change\", () => {\n      store.setSetting(\"exercise.time\", timeInput.value || \"09:00\");\n      toast(`Зарядка о ${timeInput.value || \"09:00\"}`, { icon: \"bell\", duration: 2400 });\n    });\n    append(box, [\n      toggleRow(\"Щоранкова зарядка\", !!e.enabled, (v) => { store.setSetting(\"exercise.enabled\", v); render(); }, `Щодня о ${e.time}. Три вправи поспіль.`),\n      e.enabled ? h(\"div\", { style: \"padding:4px 0 12px\" },\n        field(\"Час початку\", timeInput, \"Можна підлаштувати під себе\"),\n        h(\"div\", { class: \"faint\", style: \"font-size:12.5px\" }, e.time + \"–\" + minutesToTime((minOf(e.time) ?? 540) + (e.duration || 20)) + \" · тривалість \" + (e.duration || 20) + \" хв\"),\n        h(\"div\", { style: \"margin-top:12px;display:flex;gap:10px;flex-wrap:wrap\" },\n          btn(\"Почати зарядку зараз\", { variant: \"soft\", icon: \"dumbbell\", onClick: () => openExercise(ctx) }),\n        ),\n        h(\"div\", { style: \"margin-top:14px\" },\n          h(\"div\", { class: \"field-label\" }, \"Мій рівень\"),\n          h(\"div\", { class: \"chip-row\" }, LEVELS.map((L) => {\n            const chip = h(\"button\", { class: `chip${L.id === e.level ? \" is-active\" : \"\"}`, type: \"button\" },\n              h(\"span\", { class: \"ico\", html: iconMarkup(L.icon) }), L.name);\n            chip.addEventListener(\"click\", () => { store.setSetting(\"exercise.level\", L.id); render(); });\n            return chip;\n          })),\n        ),\n      ) : null,\n    ]);\n  }\n\n  render();\n  return { el: box, update: render };\n}\n"},{"path":"src/screens/onboarding.js","text":"import { h, append, btn } from \"../ui.js\";\nimport { iconMarkup } from \"../icons.js\";\n\nconst SLIDES = [\n  {\n    ico: \"calendar\",\n    title: \"Розумний календар\",\n    text: \"Твій тиждень одним поглядом і кожен день — по годинах. Бачиш, що було, що триває зараз і що буде далі.\",\n  },\n  {\n    ico: \"sparkles\",\n    title: \"ШІ-помічник поруч\",\n    text: \"Запитай «що в розкладі на завтра?» або просто напиши «додай тренування у четвер о 18:00» — і воно з'явиться в календарі.\",\n  },\n  {\n    ico: \"clipboard\",\n    title: \"Щоденник завдань\",\n    text: \"Домашні завдання на завтра й післязавтра. Позначив виконане — і воно зникає зі списку. Нічого не загубиться.\",\n  },\n  {\n    ico: \"dumbbell\",\n    title: \"Ранкова зарядка\",\n    text: \"Щоранку — нагадування й коротке тренування на 20 хвилин. Три рівні складності, для будь-якої підготовки.\",\n  },\n  {\n    ico: \"palette\",\n    title: \"Налаштуй під себе\",\n    text: \"Обери колір і світлу чи темну тему. Усі дані зберігаються на твоєму пристрої й нікуди не зникають.\",\n  },\n];\n\nexport function renderOnboarding({ onFinish }) {\n  const wrap = h(\"div\", { class: \"onboard\" });\n  const slidesWrap = h(\"div\", { class: \"onboard-slides\" });\n  const nodes = SLIDES.map((s, i) => {\n    const art = h(\"div\", { class: \"onboard-art\" },\n      h(\"div\", { class: \"onboard-art-ring r1\" }),\n      h(\"div\", { class: \"onboard-art-ring r2\" }),\n      h(\"div\", { class: \"onboard-art-core\", html: iconMarkup(s.ico) }),\n      h(\"div\", { class: \"onboard-art-dot\", style: \"top:14px;right:20px\" }),\n      h(\"div\", { class: \"onboard-art-dot\", style: \"bottom:26px;left:8px;width:11px;height:11px\" }),\n      h(\"div\", { class: \"onboard-art-dot\", style: \"bottom:8px;right:52px;width:8px;height:8px\" }),\n    );\n    const slide = h(\"div\", { class: \"onboard-slide\", dataset: { index: i } },\n      art,\n      h(\"h2\", {}, s.title),\n      h(\"p\", {}, s.text),\n    );\n    slidesWrap.appendChild(slide);\n    return slide;\n  });\n\n  const dots = h(\"div\", { class: \"dots\" }, SLIDES.map(() => h(\"span\", { class: \"dot\" })));\n  const cta = h(\"div\", { class: \"onboard-cta\" });\n  const bottom = h(\"div\", { class: \"onboard-bottom\" }, dots, cta);\n\n  let index = 0;\n  let locked = false;\n\n  function paint(dir) {\n    nodes.forEach((node, i) => {\n      node.classList.remove(\"enter-left\", \"enter-right\", \"is-active\");\n      if (i === index) node.classList.add(\"is-active\");\n      else if (i \u003c index) node.classList.add(dir >= 0 ? \"enter-left\" : \"enter-right\");\n      else node.classList.add(dir >= 0 ? \"enter-right\" : \"enter-left\");\n    });\n    dots.querySelectorAll(\".dot\").forEach((d, i) => d.classList.toggle(\"is-active\", i === index));\n    append(clearEl(cta), [\n      index \u003c SLIDES.length - 1\n        ? buildNext()\n        : h(\"div\", { class: \"stack\" },\n            btn(\"Увійти\", { icon: \"lock\", block: true, size: \"lg\", onClick: () => onFinish(\"login\") }),\n            btn(\"Зареєструватися\", { variant: \"ghost\", block: true, size: \"lg\", onClick: () => onFinish(\"register\") }),\n          ),\n    ]);\n    if (index === SLIDES.length - 1) {\n      append(cta, h(\"div\", { class: \"faint center\", style: \"font-size:12.5px;margin-top:2px\" }, \"Дані зберігаються лише на цьому пристрої\"));\n    }\n  }\n\n  function buildNext() {\n    return btn(\"Далі\", { icon: \"arrowRight\", block: true, size: \"lg\", onClick: next });\n  }\n\n  function next() {\n    if (locked || index >= SLIDES.length - 1) return;\n    locked = true;\n    index++;\n    paint(1);\n    setTimeout(() => { locked = false; }, 420);\n  }\n\n  const skip = h(\"button\", { class: \"onboard-skip\", onclick: () => { index = SLIDES.length - 1; paint(1); } }, \"Пропустити\");\n\n  let startX = null;\n  wrap.addEventListener(\"pointerdown\", (e) => { startX = e.clientX; });\n  wrap.addEventListener(\"pointerup\", (e) => {\n    if (startX == null) return;\n    const dx = e.clientX - startX;\n    startX = null;\n    if (Math.abs(dx) \u003c 55) return;\n    if (dx \u003c 0 && index \u003c SLIDES.length - 1) next();\n    else if (dx > 0 && index > 0) { index--; paint(-1); }\n  });\n\n  append(wrap, [skip, slidesWrap, bottom]);\n  paint(1);\n  return wrap;\n}\n\nfunction clearEl(el) {\n  while (el.firstChild) el.removeChild(el.firstChild);\n  return el;\n}\n"},{"path":"src/screens/tasks.js","text":"import { h, append, clear, btn, toast, confirmDialog } from \"../ui.js\";\nimport { iconMarkup } from \"../icons.js\";\nimport { store } from \"../store.js\";\nimport { todayStr, addDaysStr, diffDays, fmtDateLong, fmtDateShort, relativeDayLabel, dateToStr, WEEKDAYS_LONG, weekdayIdx, normalizeUrl, prettyUrl, plural } from \"../util.js\";\n\nexport function renderTasks(ctx) {\n  const page = h(\"div\", { class: \"page page-tasks\" });\n\n  function build() {\n    clear(page);\n    const today = todayStr();\n    const tomorrow = addDaysStr(today, 1);\n    const after = addDaysStr(today, 2);\n\n    const titleEl = h(\"h1\", { class: \"page-title\" }, \"Завдання\");\n    append(page, [\n      h(\"div\", { class: \"page-head\" },\n        h(\"div\", { class: \"page-kicker\" }, \"Щоденник · план\"),\n        titleEl,\n        h(\"div\", { class: \"page-sub\" }, `${WEEKDAYS_LONG[weekdayIdx(today)]}, ${fmtDateLong(today)}`),\n      ),\n    ]);\n\n    const nowTasks = store.tasksFor(today);\n    const tTasks = store.tasksFor(tomorrow);\n    const aTasks = store.tasksFor(after);\n    const tLessons = store.dayItems(tomorrow).filter((i) => i.source === \"lesson\");\n\n    if (!nowTasks.length && !tTasks.length && !aTasks.length) {\n      const box = h(\"div\", { class: \"empty-state\" },\n        h(\"span\", { class: \"ico\", html: iconMarkup(\"clipboard\") }),\n        h(\"h4\", {}, \"На найближчі дні пусто\"),\n        h(\"p\", {}, \"Загляньте в «Редагування», щоб додати заняття в розклад і нові завдання.\"),\n        btn(\"Перейти в редагування\", { icon: \"plus\", onClick: () => ctx.navigate(\"diary\", \"edit\") }),\n      );\n      page.appendChild(box);\n      if (tLessons.length) page.appendChild(lessonsCard(tTomorrowLessonsLabel(), tLessons));\n      const doneEarly = doneSection();\n      if (doneEarly) page.appendChild(doneEarly);\n      maybeAnimateTitle();\n      return;\n    }\n\n    page.appendChild(sectionLabel(\"На сьогодні\", fmtDateLong(today), nowTasks.length));\n    if (nowTasks.length) {\n      for (const task of nowTasks) page.appendChild(taskCard(task, today));\n    } else {\n      page.appendChild(h(\"div\", { class: \"faint\", style: \"font-size:13.5px;padding:2px 4px 6px\" }, \"На сьогодні завдань немає.\"));\n    }\n\n    page.appendChild(sectionLabel(\"На завтра\", fmtDateLong(tomorrow), tTasks.length));\n    if (tLessons.length) page.appendChild(lessonsCard(\"Розклад на завтра\", tLessons));\n    if (tTasks.length) {\n      for (const task of tTasks) page.appendChild(taskCard(task, tomorrow));\n    } else {\n      page.appendChild(h(\"div\", { class: \"faint\", style: \"font-size:13.5px;padding:2px 4px 6px\" }, \"Завдань на завтра немає.\"));\n    }\n\n    page.appendChild(sectionLabel(\"На післязавтра\", fmtDateLong(after), aTasks.length));\n    if (aTasks.length) {\n      for (const task of aTasks) page.appendChild(taskCard(task, after));\n    } else {\n      page.appendChild(h(\"div\", { class: \"faint\", style: \"font-size:13.5px;padding:2px 4px 6px\" }, \"На післязавтра завдань ще немає.\"));\n    }\n\n    const doneBox = doneSection();\n    if (doneBox) page.appendChild(doneBox);\n\n    maybeAnimateTitle();\n  }\n\n  function doneSection() {\n    const done = store.data.tasks\n      .filter((t) => t.done)\n      .sort((a, b) => String(b.due).localeCompare(String(a.due)) || (b.doneAt || 0) - (a.doneAt || 0));\n    if (!done.length || !store.data.settings.diary.showDone) return null;\n    const listBox = h(\"div\", { hidden: true });\n    for (const task of done) listBox.appendChild(taskCard(task, task.due, true));\n\n    const toggle = h(\"button\", { class: \"ds-toggle\", type: \"button\", title: \"Показати виконані\" },\n      h(\"span\", { class: \"ico\", html: iconMarkup(\"check\"), style: \"width:18px;height:18px;color:var(--accent)\" }),\n      \"Виконані\",\n      h(\"span\", { class: \"pill\" }, String(done.length)),\n      h(\"span\", { class: \"ico ds-caret\", html: iconMarkup(\"chevronDown\"), style: \"width:17px;height:17px\" }),\n    );\n    toggle.addEventListener(\"click\", () => {\n      listBox.hidden = !listBox.hidden;\n      toggle.classList.toggle(\"is-open\", !listBox.hidden);\n    });\n\n    const clearBtn = h(\"button\", {\n      class: \"icon-btn ds-clear\", type: \"button\", title: \"Очистити виконані\", html: iconMarkup(\"trash\"),\n      onclick: clearDone,\n    });\n\n    return h(\"div\", {},\n      h(\"div\", { class: \"day-section-title ds-done-head\" }, toggle, clearBtn),\n      listBox,\n    );\n  }\n\n  async function clearDone() {\n    const allDone = store.data.tasks.filter((t) => t.done);\n    if (!allDone.length) return;\n    const word = plural(allDone.length, \"виконане завдання\", \"виконані завдання\", \"виконаних завдань\");\n    const ok = await confirmDialog({\n      title: \"Очистити виконані?\",\n      message: `Видалити ${allDone.length} ${word}? Скасувати це не вийде.`,\n      confirmText: \"Очистити\",\n      danger: true,\n    });\n    if (!ok) return;\n    const removed = store.clearDoneTasks();\n    toast(`Прибрано: ${removed}`, { icon: \"check\", duration: 2400 });\n  }\n\n  function tTomorrowLessonsLabel() {\n    return \"Розклад на завтра\";\n  }\n\n  function maybeAnimateTitle() {\n    if (ctx.consumeTitleAnim) ctx.consumeTitleAnim();\n  }\n\n  function sectionLabel(label, dateText, count) {\n    return h(\"div\", { class: \"day-section-title\" },\n      label,\n      h(\"span\", { class: \"faint\", style: \"font-size:12.5px;font-weight:600\" }, dateText),\n      count ? h(\"span\", { class: \"pill\" }, `${count} ${plural(count, \"завдання\", \"завдання\", \"завдань\")}`) : null,\n    );\n  }\n\n  function lessonsCard(label, lessons) {\n    return h(\"div\", { class: \"card\", style: \"margin-bottom:14px;padding:13px 14px\" },\n      h(\"div\", { class: \"faint\", style: \"font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px\" }, label),\n      h(\"div\", { class: \"chip-row\" }, lessons.map((l) => h(\"span\", { class: \"chip\", style: \"cursor:default\" },\n        l.start ? h(\"span\", { style: \"color:var(--accent);font-variant-numeric:tabular-nums\" }, l.start) : null,\n        l.title,\n      ))),\n    );\n  }\n\n  function doneWhenLabel(task) {\n    const day = task.doneAt ? dateToStr(new Date(task.doneAt)) : task.due;\n    if (!day) return \"\";\n    const delta = diffDays(todayStr(), day);\n    if (delta > 0) return fmtDateShort(day);\n    return relativeDayLabel(day) || fmtDateShort(day);\n  }\n\n  function taskCard(task, dateStr, isDone) {\n    const card = h(\"div\", { class: `task${task.done ? \" is-done\" : \"\"}` });\n    const check = h(\"button\", {\n      class: `check-btn${task.done ? \" is-done\" : \"\"}`,\n      title: task.done ? \"Повернути в роботу\" : \"Позначити виконаним\",\n      html: iconMarkup(\"check\"),\n    });\n    check.addEventListener(\"click\", () => {\n      if (!task.done) {\n        card.classList.add(\"is-removing\");\n        setTimeout(() => { store.toggleTask(task.id); toast(\"Виконано! Так тримати\", { icon: \"check\", duration: 2400 }); }, 320);\n      } else {\n        store.toggleTask(task.id);\n      }\n    });\n\n    append(card, [\n      h(\"div\", { class: \"task-main\" },\n        task.subject ? h(\"div\", { class: \"task-subject\" }, h(\"span\", { class: \"ico\", html: iconMarkup(\"book\"), style: \"width:13px;height:13px\" }), task.subject) : null,\n        h(\"div\", { class: \"task-title\" }, task.title),\n        task.desc ? h(\"div\", { class: \"task-desc\" }, task.desc) : null,\n        isDone ? h(\"div\", { class: \"task-when\" }, \"Виконано · \" + doneWhenLabel(task)) : null,\n        h(\"div\", { class: \"task-foot\" },\n          task.link ? h(\"a\", { class: \"task-link\", href: normalizeUrl(task.link), target: \"_blank\", rel: \"noopener noreferrer\" },\n            h(\"span\", { class: \"ico\", html: iconMarkup(\"link\") }), prettyUrl(task.link)) : null,\n          h(\"button\", { class: \"icon-btn\", style: \"width:30px;height:30px\", title: \"Редагувати\", html: iconMarkup(\"edit\"), onclick: () => ctx.openTaskForm(task) }),\n          h(\"button\", {\n            class: \"icon-btn\", style: \"width:30px;height:30px\", title: \"Видалити\", html: iconMarkup(\"trash\"),\n            onclick: async () => {\n              if (await confirmDialog({ title: \"Видалити завдання?\", message: `«${task.title}»`, confirmText: \"Видалити\", danger: true })) store.removeTask(task.id);\n            },\n          }),\n        ),\n      ),\n      check,\n    ]);\n    return card;\n  }\n\n  build();\n  return { el: page, update: build };\n}\n"},{"path":"src/screens/week.js","text":"import { h, append, clear, kriTitle } from \"../ui.js\";\nimport { iconMarkup } from \"../icons.js\";\nimport { store } from \"../store.js\";\nimport { todayStr, addDaysStr, startOfWeekStr, fmtWeekRange, WEEKDAYS_SHORT, fmtDateLong, WEEKDAYS_LONG, weekdayIdx, plural, tripReminder } from \"../util.js\";\nimport { itemStatus } from \"../schedule.js\";\nimport { openItemSheet, openTripSheet } from \"../itemdetail.js\";\nimport { tripNotice } from \"../nextcard.js\";\n\nfunction greeting() {\n  const hour = new Date().getHours();\n  if (hour \u003c 5) return \"Доброї ночі\";\n  if (hour \u003c 12) return \"Доброго ранку\";\n  if (hour \u003c 18) return \"Доброго дня\";\n  return \"Доброго вечора\";\n}\n\nexport function renderWeek(ctx) {\n  const page = h(\"div\", { class: \"page page-week\" });\n  const lookahead = Number(window.root.weekLookahead) || 3;\n\n  function build() {\n    clear(page);\n    const today = todayStr();\n\n    const titleEl = h(\"h1\", { class: \"page-title\" }, \"Календар\");\n    append(page, [\n      h(\"div\", { class: \"page-head\" },\n        h(\"div\", { class: \"page-kicker\" }, `${greeting()}${store.displayName() ? \", \" + store.displayName() : \"\"}`),\n        titleEl,\n        h(\"div\", { class: \"page-sub\" }, `${WEEKDAYS_LONG[weekdayIdx(today)]}, ${fmtDateLong(today)}`),\n      ),\n      tripBanners(today),\n      h(\"div\", { class: \"section\" },\n        h(\"div\", { class: \"section-head is-stacked\" },\n          h(\"div\", { class: \"section-title\" },\n            h(\"span\", { class: \"ico\", html: iconMarkup(\"calendar\") }),\n            \"Розклад на тижні\",\n            h(\"span\", { class: \"tag tag-muted\" }, `до ${lookahead} ${plural(lookahead, \"тижня\", \"тижнів\", \"тижнів\")} уперед`),\n          ),\n          h(\"div\", { class: \"section-hint\" }, \"Події на весь день, свята й подорожі. Події з часом — у «Графіку дня»\"),\n        ),\n        weekList(today, lookahead),\n      ),\n    ]);\n\n    if (ctx.consumeTitleAnim && ctx.consumeTitleAnim()) {\n      kriTitle(titleEl, \"Календар\");\n    }\n  }\n\n  function tripBanners(today) {\n    const out = [];\n    for (const trip of store.data.trips) {\n      const rem = tripReminder(trip, today);\n      if (!rem) continue;\n      out.push(h(\"div\", { class: \"trip-banner\" }, tripNotice(trip, rem, ctx)));\n    }\n    return out;\n  }\n\n  function weekList(today, lookahead) {\n    const wrap = h(\"div\", { class: \"week-list\" });\n    const base = startOfWeekStr(today);\n    for (let w = 0; w \u003c= lookahead; w++) {\n      const start = addDaysStr(base, w * 7);\n      const isCurrent = w === 0;\n      const days = [];\n      for (let i = 0; i \u003c 7; i++) {\n        const date = addDaysStr(start, i);\n        const items = store.calendarItems(date);\n        const isToday = date === today;\n        const dow = weekdayIdx(date);\n        const dateCol = h(\"div\", { class: \"wday-date\" },\n          h(\"div\", { class: \"wday-name\" }, WEEKDAYS_SHORT[dow]),\n          h(\"div\", { class: `wday-num${date \u003c today ? \" is-past\" : \"\"}` }, String(Number(date.slice(8, 10)))),\n        );\n        const itemsCol = h(\"div\", { class: \"wday-items\" });\n        if (!items.length) {\n          itemsCol.appendChild(h(\"div\", { class: \"wday-empty\" }, \"—\"));\n        } else {\n          for (const item of items) itemsCol.appendChild(calChip(item, date));\n        }\n        days.push(h(\"div\", { class: `wday${isToday ? \" is-today\" : \"\"}${dow >= 5 ? \" is-weekend\" : \"\"}` }, dateCol, itemsCol));\n      }\n      const card = h(\"div\", { class: `card week-card${isCurrent ? \" is-current\" : \"\"}` },\n        h(\"div\", { class: \"week-head\" },\n          h(\"div\", {},\n            h(\"div\", { class: \"week-head-title\" }, fmtWeekRange(start)),\n            h(\"div\", { class: \"week-head-sub\" }, isCurrent ? \"Цей тиждень\" : w === 1 ? \"Наступний тиждень\" : `Через ${w} ${plural(w, \"тиждень\", \"тижні\", \"тижнів\")}`),\n          ),\n          isCurrent ? h(\"span\", { class: \"tag\" }, \"Сьогодні тут\") : null,\n        ),\n        ...days,\n      );\n      wrap.appendChild(card);\n    }\n    return wrap;\n  }\n\n  function calChip(item, date) {\n    if (item.source === \"trip\") {\n      const rem = item.reminder;\n      return h(\"button\", {\n        class: `trip-chip is-${rem.kind}`,\n        type: \"button\",\n        onclick: () => openTripSheet(item.trip, ctx),\n      },\n        h(\"span\", { class: \"trip-chip-ico\", html: iconMarkup(\"luggage\") }),\n        h(\"span\", { class: \"trip-chip-text\" },\n          h(\"span\", { class: \"trip-chip-title\" }, rem.title),\n          h(\"span\", { class: \"trip-chip-sub\" }, `${item.trip.title}${rem.note ? \" · \" + rem.note : \"\"}`),\n        ),\n        h(\"span\", { class: \"chev\", html: iconMarkup(\"chevronRight\") }),\n      );\n    }\n    const st = itemStatus(item, date);\n    const isHoliday = item.category === \"holiday\";\n    return h(\"button\", {\n      class: `chip-item is-${isHoliday ? \"holiday\" : \"allday\"}${st === \"past\" ? \" is-past\" : \"\"}`,\n      onclick: () => openItemSheet(item, date, ctx),\n    },\n      h(\"span\", { class: \"ci-ico\", html: iconMarkup(isHoliday ? \"gift\" : \"calendar\") }),\n      h(\"span\", { class: \"ci-title\" }, item.title),\n      item.start ? h(\"span\", { class: \"ci-time\" }, item.start) : null,\n    );\n  }\n\n  build();\n  return { el: page, update: build };\n}\n"},{"path":"src/store.js","text":"import {\n  uid, todayStr, strToDate, weekdayIdx, toISODow, occurrencesOfRepeatPattern, addDaysStr, minOf,\n  minutesToTime, roomLabel, fmtDateMedium, tripCovers, tripReminder,\n} from \"./util.js\";\n\nconst SESSION_KEY = \"kri.planner.session.v1\";\nconst ACCOUNTS = \"accounts\";\nconst STORE = \"appData\";\n\nfunction kv() {\n  return window.root.kv;\n}\n\nexport function defaultSettings() {\n  return {\n    theme: \"teal\",\n    mode: \"light\",\n    language: \"uk\",\n    exercise: {\n      enabled: true,\n      time: \"09:00\",\n      duration: 20,\n      level: \"beginner\",\n      lastDone: null,\n      streak: 0,\n      best: 0,\n    },\n    reminders: {\n      events: true,\n      eventsMinutes: 5,\n      homework: false,\n      homeworkTime: \"18:00\",\n    },\n    diary: {\n      showDone: true,\n      hideEmptyDays: false,\n      defaultNextLesson: true,\n      rollOver: false,\n    },\n  };\n}\n\nexport function defaultData() {\n  return {\n    version: 1,\n    createdAt: Date.now(),\n    settings: defaultSettings(),\n    timetable: {},\n    events: [],\n    trips: [],\n    tasks: [],\n    exerciseLog: {},\n  };\n}\n\nfunction migrate(data) {\n  const base = defaultData();\n  const out = Object.assign({}, base, data || {});\n  out.settings = Object.assign({}, base.settings, (data && data.settings) || {});\n  out.settings.exercise = Object.assign({}, base.settings.exercise, (data && data.settings && data.settings.exercise) || {});\n  out.settings.reminders = Object.assign({}, base.settings.reminders, (data && data.settings && data.settings.reminders) || {});\n  out.settings.diary = Object.assign({}, base.settings.diary, (data && data.settings && data.settings.diary) || {});\n  out.timetable = (data && data.timetable) || {};\n  out.events = (data && data.events) || [];\n  out.trips = (data && data.trips) || [];\n  out.tasks = (data && data.tasks) || [];\n  out.exerciseLog = (data && data.exerciseLog) || {};\n  return out;\n}\n\nfunction bytesToB64(bytes) {\n  let s = \"\";\n  for (let i = 0; i \u003c bytes.length; i++) s += String.fromCharCode(bytes[i]);\n  return btoa(s);\n}\n\nfunction b64ToBytes(b64) {\n  const bin = atob(b64);\n  const out = new Uint8Array(bin.length);\n  for (let i = 0; i \u003c bin.length; i++) out[i] = bin.charCodeAt(i);\n  return out;\n}\n\nasync function hashPassword(password, saltB64, iterations = 120000) {\n  const enc = new TextEncoder();\n  const key = await crypto.subtle.importKey(\"raw\", enc.encode(password), \"PBKDF2\", false, [\"deriveBits\"]);\n  const bits = await crypto.subtle.deriveBits(\n    { name: \"PBKDF2\", salt: b64ToBytes(saltB64), iterations, hash: \"SHA-256\" },\n    key,\n    256,\n  );\n  return bytesToB64(new Uint8Array(bits));\n}\n\nexport const store = {\n  user: null,\n  data: defaultData(),\n  profile: { displayName: \"\", avatar: \"\" },\n  ready: false,\n  _subs: new Set(),\n  _saveTimer: null,\n\n  subscribe(fn) {\n    this._subs.add(fn);\n    return () => this._subs.delete(fn);\n  },\n\n  emit() {\n    for (const fn of Array.from(this._subs)) fn();\n  },\n\n  displayName() {\n    return (this.profile && this.profile.displayName) || this.user || \"\";\n  },\n\n  avatar() {\n    return (this.profile && this.profile.avatar) || \"\";\n  },\n\n  async init() {\n    try {\n      this.user = localStorage.getItem(SESSION_KEY) || null;\n      if (this.user) {\n        const accounts = (await kv()[ACCOUNTS].get(this.user)) || null;\n        if (!accounts) this.user = null;\n        else {\n          this.profile = {\n            displayName: accounts.displayName || this.user,\n            avatar: accounts.avatar || \"\",\n          };\n          const raw = await kv()[STORE].get(this.user);\n          this.data = migrate(raw);\n        }\n      }\n    } catch (e) {\n      console.warn(\"store init failed\", e);\n      this.user = null;\n      this.data = defaultData();\n    }\n    this.ready = true;\n    this.emit();\n    return this.user;\n  },\n\n  async register(username, password, displayName) {\n    const name = String(username || \"\").trim();\n    const existing = await kv()[ACCOUNTS].get(name);\n    if (existing) throw new Error(\"Профіль із такою назвою вже існує\");\n    const salt = crypto.getRandomValues(new Uint8Array(16));\n    const saltB64 = bytesToB64(salt);\n    const hash = await hashPassword(password, saltB64);\n    const shown = String(displayName || \"\").trim() || name;\n    await kv()[ACCOUNTS].set(name, { salt: saltB64, hash, createdAt: Date.now(), displayName: shown, avatar: \"\" });\n    const data = defaultData();\n    data.settings = defaultSettings();\n    await kv()[STORE].set(name, data);\n    this.user = name;\n    this.profile = { displayName: shown, avatar: \"\" };\n    this.data = data;\n    localStorage.setItem(SESSION_KEY, name);\n    this.emit();\n    return name;\n  },\n\n  async login(username, password) {\n    const name = String(username || \"\").trim();\n    const account = await kv()[ACCOUNTS].get(name);\n    if (!account) throw new Error(\"Такого профілю не знайдено\");\n    const hash = await hashPassword(password, account.salt);\n    if (hash !== account.hash) throw new Error(\"Невірний пароль\");\n    this.user = name;\n    this.profile = { displayName: account.displayName || name, avatar: account.avatar || \"\" };\n    const raw = await kv()[STORE].get(name);\n    this.data = migrate(raw);\n    localStorage.setItem(SESSION_KEY, name);\n    this.emit();\n    return name;\n  },\n\n  /* ---------- профіль ---------- */\n\n  async accountInfo() {\n    if (!this.user) return null;\n    return (await kv()[ACCOUNTS].get(this.user)) || null;\n  },\n\n  async saveProfile({ displayName, avatar }) {\n    if (!this.user) throw new Error(\"Немає активного профілю\");\n    const account = (await kv()[ACCOUNTS].get(this.user)) || {};\n    const next = {\n      displayName: displayName != null ? String(displayName).trim() : (this.profile.displayName || this.user),\n      avatar: avatar != null ? avatar : (this.profile.avatar || \"\"),\n    };\n    if (!next.displayName) next.displayName = this.user;\n    await kv()[ACCOUNTS].set(this.user, Object.assign({}, account, next));\n    this.profile = next;\n    this.emit();\n    return next;\n  },\n\n  async verifyPassword(password) {\n    const account = await this.accountInfo();\n    if (!account) return false;\n    const hash = await hashPassword(String(password || \"\"), account.salt);\n    return hash === account.hash;\n  },\n\n  async changePassword(current, next) {\n    const pwd = String(next || \"\");\n    if (pwd.length \u003c 4) throw new Error(\"Новий пароль — мінімум 4 символи\");\n    if (!(await this.verifyPassword(current))) throw new Error(\"Поточний пароль невірний\");\n    const account = await this.accountInfo();\n    const salt = bytesToB64(crypto.getRandomValues(new Uint8Array(16)));\n    const hash = await hashPassword(pwd, salt);\n    await kv()[ACCOUNTS].set(this.user, Object.assign({}, account, { salt, hash }));\n  },\n\n  async renameProfile(newName) {\n    const old = this.user;\n    const next = String(newName || \"\").trim();\n    if (!old) throw new Error(\"Немає активного профілю\");\n    if (!next || next === old) return old;\n    if (next.length \u003c 2) throw new Error(\"Назва профілю занадто коротка\");\n    if (await kv()[ACCOUNTS].get(next)) throw new Error(\"Така назва профілю вже зайнята\");\n    clearTimeout(this._saveTimer);\n    await kv()[STORE].set(old, this.data);\n    const account = await kv()[ACCOUNTS].get(old);\n    await kv()[ACCOUNTS].set(next, account);\n    await kv()[STORE].set(next, this.data);\n    if (!(await kv()[ACCOUNTS].get(next))) throw new Error(\"Не вдалося зберегти профіль\");\n    await kv()[ACCOUNTS].delete(old);\n    await kv()[STORE].delete(old);\n    this.user = next;\n    localStorage.setItem(SESSION_KEY, next);\n    this.emit();\n    return next;\n  },\n\n  async logout() {\n    this.user = null;\n    this.profile = { displayName: \"\", avatar: \"\" };\n    this.data = defaultData();\n    localStorage.removeItem(SESSION_KEY);\n    this.emit();\n  },\n\n  async listUsers() {\n    try {\n      const keys = await kv()[ACCOUNTS].keys();\n      return keys.slice().sort((a, b) => a.localeCompare(b, \"uk\"));\n    } catch (e) {\n      return [];\n    }\n  },\n\n  save() {\n    if (!this.user) return;\n    clearTimeout(this._saveTimer);\n    this._saveTimer = setTimeout(() => {\n      const payload = this.data;\n      kv()[STORE].set(this.user, payload).catch((e) => console.warn(\"save failed\", e));\n    }, 350);\n  },\n\n  commit() {\n    this.save();\n    this.emit();\n  },\n\n  /* ---------- timetable ---------- */\n\n  timetableFor(dow) {\n    const list = this.data.timetable[String(dow)] || [];\n    return list.slice().sort((a, b) => (minOf(a.start) ?? 0) - (minOf(b.start) ?? 0));\n  },\n\n  setTimetable(dow, list) {\n    this.data.timetable[String(dow)] = list;\n    this.commit();\n  },\n\n  addLesson(dow, lesson) {\n    const list = (this.data.timetable[String(dow)] || []).slice();\n    list.push(Object.assign({ id: uid() }, lesson));\n    list.sort((a, b) => (minOf(a.start) ?? 0) - (minOf(b.start) ?? 0));\n    this.setTimetable(dow, list);\n    return list;\n  },\n\n  updateLesson(dow, id, patch) {\n    const list = (this.data.timetable[String(dow)] || []).map((l) => (l.id === id ? Object.assign({}, l, patch) : l));\n    list.sort((a, b) => (minOf(a.start) ?? 0) - (minOf(b.start) ?? 0));\n    this.setTimetable(dow, list);\n  },\n\n  removeLesson(dow, id) {\n    this.setTimetable(dow, (this.data.timetable[String(dow)] || []).filter((l) => l.id !== id));\n  },\n\n  subjects() {\n    const seen = new Set();\n    for (const dow of Object.keys(this.data.timetable)) {\n      for (const l of this.data.timetable[dow] || []) {\n        if (l.subject) seen.add(String(l.subject).trim());\n      }\n    }\n    return Array.from(seen).sort((a, b) => a.localeCompare(b, \"uk\"));\n  },\n\n  lessonsForSubject(subject) {\n    const out = [];\n    for (const dow of Object.keys(this.data.timetable)) {\n      for (const l of this.data.timetable[dow] || []) {\n        if (String(l.subject).trim().toLowerCase() === String(subject).trim().toLowerCase()) {\n          out.push(Object.assign({ dow: Number(dow) }, l));\n        }\n      }\n    }\n    return out;\n  },\n\n  /* ---------- events ---------- */\n\n  addEvent(ev) {\n    const item = Object.assign(\n      { id: uid(), kind: \"once\", title: \"\", desc: \"\", link: \"\", date: todayStr(), start: \"\", end: \"\", allDay: false, createdAt: Date.now() },\n      ev,\n    );\n    this.data.events.push(item);\n    this.commit();\n    return item;\n  },\n\n  updateEvent(id, patch) {\n    const i = this.data.events.findIndex((e) => e.id === id);\n    if (i >= 0) this.data.events[i] = Object.assign({}, this.data.events[i], patch);\n    this.commit();\n  },\n\n  removeEvent(id) {\n    this.data.events = this.data.events.filter((e) => e.id !== id);\n    this.commit();\n  },\n\n  /* ---------- подорожі ---------- */\n\n  normalizeTrip(from, to) {\n    let a = from;\n    let b = to;\n    if (!a || !b) return { from: a || b || todayStr(), to: b || a || todayStr() };\n    if (b \u003c a) { const t = a; a = b; b = t; }\n    return { from: a, to: b };\n  },\n\n  addTrip(trip) {\n    const range = this.normalizeTrip(trip.from, trip.to);\n    const item = Object.assign(\n      { id: uid(), title: \"\", desc: \"\", link: \"\", createdAt: Date.now() },\n      trip,\n      range,\n    );\n    this.data.trips.push(item);\n    this.commit();\n    return item;\n  },\n\n  updateTrip(id, patch) {\n    const i = this.data.trips.findIndex((t) => t.id === id);\n    if (i >= 0) {\n      const next = Object.assign({}, this.data.trips[i], patch);\n      const range = this.normalizeTrip(next.from, next.to);\n      this.data.trips[i] = Object.assign(next, range);\n    }\n    this.commit();\n  },\n\n  removeTrip(id) {\n    this.data.trips = this.data.trips.filter((t) => t.id !== id);\n    this.commit();\n  },\n\n  tripsOn(dateStr) {\n    return this.data.trips.filter((t) => tripCovers(t, dateStr));\n  },\n\n  /* ---------- tasks ---------- */\n\n  addTask(task) {\n    const item = Object.assign(\n      { id: uid(), subject: \"\", title: \"\", desc: \"\", link: \"\", due: todayStr(), done: false, doneAt: null, createdAt: Date.now() },\n      task,\n    );\n    this.data.tasks.push(item);\n    this.commit();\n    return item;\n  },\n\n  updateTask(id, patch) {\n    const i = this.data.tasks.findIndex((t) => t.id === id);\n    if (i >= 0) this.data.tasks[i] = Object.assign({}, this.data.tasks[i], patch);\n    this.commit();\n  },\n\n  removeTask(id) {\n    this.data.tasks = this.data.tasks.filter((t) => t.id !== id);\n    this.commit();\n  },\n\n  clearDoneTasks() {\n    const before = this.data.tasks.length;\n    this.data.tasks = this.data.tasks.filter((t) => !t.done);\n    const removed = before - this.data.tasks.length;\n    if (removed) this.commit();\n    return removed;\n  },\n\n  toggleTask(id) {\n    const t = this.data.tasks.find((x) => x.id === id);\n    if (!t) return;\n    t.done = !t.done;\n    t.doneAt = t.done ? Date.now() : null;\n    this.commit();\n  },\n\n  tasksFor(dateStr, includeDone = false) {\n    return this.data.tasks\n      .filter((t) => t.due === dateStr && (includeDone || !t.done))\n      .sort((a, b) => String(a.subject).localeCompare(String(b.subject), \"uk\"));\n  },\n\n  /* ---------- settings ---------- */\n\n  setSetting(path, value) {\n    const parts = path.split(\".\");\n    let node = this.data.settings;\n    for (let i = 0; i \u003c parts.length - 1; i++) node = node[parts[i]];\n    node[parts[parts.length - 1]] = value;\n    this.commit();\n  },\n\n  /* ---------- merged schedule ---------- */\n\n  dayItems(dateStr) {\n    const items = [];\n    const dow = toISODow(dateStr);\n    const lessons = this.timetableFor(dow);\n    let lessonNo = 0;\n    for (const l of lessons) {\n      lessonNo++;\n      items.push({\n        id: \"tt-\" + l.id,\n        source: \"lesson\",\n        category: \"timed\",\n        lessonNo,\n        title: l.subject || \"Заняття\",\n        desc: l.note || \"\",\n        meta: [roomLabel(l.room), l.teacher].filter(Boolean).join(\" · \"),\n        link: l.link || \"\",\n        start: l.start || \"\",\n        end: l.end || \"\",\n        allDay: false,\n        raw: l,\n      });\n    }\n    for (const ev of this.data.events) {\n      if (!occurrencesOfRepeatPattern(ev, dateStr)) continue;\n      const holiday = ev.kind === \"yearly\";\n      const allDay = !ev.start || !!ev.allDay;\n      items.push({\n        id: \"ev-\" + ev.id,\n        source: \"event\",\n        category: holiday ? \"holiday\" : allDay ? \"allday\" : \"timed\",\n        kind: ev.kind,\n        title: ev.title || \"Подія\",\n        desc: ev.desc || \"\",\n        meta: \"\",\n        link: ev.link || \"\",\n        start: allDay ? \"\" : (ev.start || \"\"),\n        end: allDay ? \"\" : (ev.end || \"\"),\n        allDay,\n        raw: ev,\n      });\n    }\n    for (const trip of this.data.trips) {\n      const reminder = tripReminder(trip, dateStr);\n      if (!reminder) continue;\n      items.push({\n        id: \"trip-\" + trip.id,\n        source: \"trip\",\n        category: \"trip\",\n        title: trip.title || \"Подорож\",\n        desc: trip.desc || \"\",\n        meta: `${fmtDateMedium(trip.from)} — ${fmtDateMedium(trip.to)}`,\n        link: trip.link || \"\",\n        start: \"\",\n        end: \"\",\n        allDay: true,\n        reminder,\n        trip,\n        raw: trip,\n      });\n    }\n    const ex = this.data.settings.exercise;\n    if (ex && ex.enabled && dateStr === todayStr()) {\n      const s = minOf(ex.time || \"09:00\");\n      const start = s == null ? 540 : s;\n      const dur = Math.max(5, Number(ex.duration) || 20);\n      items.push({\n        id: \"exercise-\" + dateStr,\n        source: \"exercise\",\n        category: \"timed\",\n        title: \"Ранкова зарядка\",\n        short: \"Зарядка\",\n        desc: \"Віджимання, підтягування, присідання — три вправи поспіль.\",\n        meta: `${dur} хв`,\n        link: \"\",\n        start: minutesToTime(start),\n        end: minutesToTime(start + dur),\n        allDay: false,\n        done: !!this.data.exerciseLog[dateStr],\n        raw: null,\n      });\n    }\n    items.sort((a, b) => {\n      if (a.allDay !== b.allDay) return a.allDay ? -1 : 1;\n      const am = a.start ? minOf(a.start) : 24 * 60;\n      const bm = b.start ? minOf(b.start) : 24 * 60;\n      if (am !== bm) return am - bm;\n      return String(a.title).localeCompare(String(b.title), \"uk\");\n    });\n    return items;\n  },\n\n  /* Події «з часом» — те, що показує Графік дня. */\n  timedItems(dateStr) {\n    return this.dayItems(dateStr).filter((i) => i.category === \"timed\" && i.start);\n  },\n\n  /* Події «на весь день»: свята, події без часу та подорожі — те, що показує Календар. */\n  calendarItems(dateStr) {\n    return this.dayItems(dateStr).filter((i) => i.category !== \"timed\");\n  },\n\n  weekItems(startStr) {\n    const out = [];\n    for (let i = 0; i \u003c 7; i++) {\n      const d = addDaysStr(startStr, i);\n      out.push({ date: d, items: this.dayItems(d) });\n    }\n    return out;\n  },\n\n  upcomingEvents(fromDate, days = 30) {\n    const out = []
